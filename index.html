<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuum Topology</title>
    <!--
      Applies a saved theme choice before anything renders, so a reload or navigation never flashes the
      wrong theme while React's own JS is still loading. Mirrors src/lib/theme.ts's storage key/values
      exactly (kept duplicated on purpose: this one has to run synchronously, inline, before first paint,
      which rules out importing the module here) - update both together.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('continuum:theme')
          if (t !== 'light' && t !== 'dark') {
            // No pinned choice: resolve the OS preference now, in JS, rather than leaving data-theme
            // absent for a `@media (prefers-color-scheme)` rule in index.css to pick up - see the long
            // comment atop src/lib/theme.ts for the story behind that choice.
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
