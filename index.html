<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikhnos</title>
    <!--
      Applies a saved theme choice (or the OS preference) before anything renders, so a reload never flashes the
      wrong theme. It is an external file, not an inline script: the server's Content-Security-Policy allows scripts
      from its own origin only, so an inline one is blocked there and the page stayed on the dark default whatever
      the OS said. Classic and synchronous on purpose (no type=module, no defer): it must run before first paint.
      The logic lives in public/theme-init.js and mirrors src/lib/theme.ts - update both together.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
