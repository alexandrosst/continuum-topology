# Everything locked down: NetworkPolicies on the server and Neo4j, admin port only from the Gateway's namespace, TLSRoute
# passthrough for agents, an existing PVC.
agent:
  publicAddress: continuum.example.com:443
  service:
    type: ClusterIP
  tlsRoute:
    enabled: true
    parentRefs: [{name: shared-gateway, namespace: gateways, sectionName: agents-tls}]
    hostnames: [continuum.example.com]
httproute:
  enabled: true
  parentRefs: [{name: shared-gateway, namespace: gateways, sectionName: https}]
  hostnames: [continuum-ui.example.com]
persistence:
  existingClaim: continuum-data-restored
neo4j:
  mode: bundled
  networkPolicy:
    enabled: true
networkPolicy:
  enabled: true
  ingress:
    admin:
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateways}}
    agent:
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateways}}
  egress:
    deciderCIDRs: ["198.51.100.0/24"]
decider:
  allowCIDRs: ["198.51.100.0/24"]
podDisruptionBudget:
  enabled: true
  minAvailable: null
  maxUnavailable: 1
