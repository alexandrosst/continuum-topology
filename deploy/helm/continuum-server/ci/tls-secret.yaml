# The admin listener serves HTTPS itself from a kubernetes.io/tls Secret (no TLS-terminating proxy needed). A proxy in front
# then re-encrypts; agents still go straight to the LoadBalancer. Also: a CA key passphrase and the Gateway API routes.
agent:
  publicAddress: continuum.example.com:8443
  tlsRoute:
    enabled: true
    parentRefs: [{name: shared-gateway, namespace: gateways, sectionName: agents-tls}]
    hostnames: [continuum.example.com]
admin:
  tls:
    secretName: continuum-admin-tls
httproute:
  enabled: true
  parentRefs: [{name: shared-gateway, namespace: gateways, sectionName: https}]
  hostnames: [continuum.example.com]
pki:
  caKeyPassphraseSecret:
    name: continuum-ca-passphrase
    key: passphrase
