{{- if include "continuum.adminSelfSigned" . }}
{{- /*
  Generated once and kept: on upgrade the certificate already in the cluster is reused (lookup), so a browser that was
  already told to trust it doesn't have to do that again on every helm upgrade - the same "generate once, keep" policy
  as pki's CA-key passphrase and neo4j.auth's generated password. `lookup` returns nothing under `helm template` (Argo
  CD, Flux with helm template, --dry-run=client), so in those flows a fresh self-signed certificate is rendered on
  every run: give admin.tls.secretName a real Secret you manage if that matters to you (a GitOps pipeline, say).

  This is a fallback for a trial or a LAN-reachable install, not a substitute for a real certificate: every browser
  shows a "not private" warning until you click through it once, and it only covers the hostnames/IPs baked in below
  (localhost, 127.0.0.1, ::1, plus admin.tls.selfSignedHosts) - anything else you reach it by needs to be added there,
  or the browser also complains about a hostname mismatch. For a real, browser-trusted certificate on a public domain,
  use httproute with cert-manager instead; this generated one never gets you that.
*/ -}}
{{- $name := include "continuum.adminSelfSignedSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $extra := .Values.admin.tls.selfSignedHosts | default (list) }}
{{- $ips := list "127.0.0.1" "::1" }}
{{- $dns := list "localhost" }}
{{- range $extra }}
{{- if regexMatch "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$" . }}
{{- $ips = append $ips . }}
{{- else }}
{{- $dns = append $dns . }}
{{- end }}
{{- end }}
{{- $cert := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") }}
{{- $cert = index $existing.data "tls.crt" | b64dec }}
{{- $key = index $existing.data "tls.key" | b64dec }}
{{- else }}
{{- $generated := genSelfSignedCert (include "continuum.fullname" .) $ips $dns 825 }}
{{- $cert = $generated.Cert }}
{{- $key = $generated.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # Kept on uninstall so a reinstall (same release name, same volume) doesn't force every browser to click through
    # the self-signed warning again. Delete it by hand if you want a fresh certificate.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
{{- end }}
