{{- if .Values.backup.volumeSnapshot.enabled }}
{{- /*
  Scheduled CSI VolumeSnapshots of the data volume (and optionally the bundled Neo4j volume).

  Why snapshots and not a copy job: /data is a ReadWriteOnce volume held by the server, and its SQLite database runs in WAL mode,
  so a live `cp` of continuum.db misses what is still in the -wal file. A second pod cannot mount the volume unless it lands on the
  same node, and `sqlite3 .backup` would need a sqlite image plus a place to put the result. A volume snapshot is taken by the
  storage layer at one instant for the whole volume (database, -wal, -shm and the CA key together): crash-consistent, which SQLite
  in WAL mode recovers from like a power cut.

  Neo4j: with includeNeo4j the bundled volume is snapshotted too. That is crash-consistent as well (Neo4j replays its transaction log);
  for a fully consistent Neo4j backup stop it and use `neo4j-admin database dump`.
*/ -}}
{{- $b := .Values.backup.volumeSnapshot }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-backup" (include "continuum.fullname" .) | trunc 52 | trimSuffix "-" }}
{{- $pvcs := list (dict "component" "data" "claim" (include "continuum.dataClaim" .)) }}
{{- if and $b.includeNeo4j (eq .Values.neo4j.mode "bundled") }}
{{- $pvcs = append $pvcs (dict "component" "neo4j" "claim" (printf "data-%s-0" (include "continuum.neo4jName" .))) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
# The one pod in this chart that talks to the Kubernetes API: it creates and prunes VolumeSnapshots in this namespace, nothing else.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ $b.schedule | quote }}
  {{- with $b.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  suspend: {{ $b.suspend }}
  successfulJobsHistoryLimit: {{ $b.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $b.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "continuum.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: snapshot
              image: "{{ $b.image.repository }}:{{ $b.image.tag }}"
              imagePullPolicy: {{ $b.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}
              resources: {{- toYaml $b.resources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
              command: ["/bin/sh", "-ceu"]
              args:
                - |
                  ts=$(date -u +%Y%m%d-%H%M%S)
                  snapshot() { # $1 = component label, $2 = PVC name
                    name="{{ include "continuum.fullname" . | trunc 30 | trimSuffix "-" }}-$1-$ts"
                    kubectl -n {{ $ns }} create -f - <<EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: $name
                    labels:
                      app.kubernetes.io/name: {{ include "continuum.name" . }}
                      app.kubernetes.io/instance: {{ .Release.Name }}
                      app.kubernetes.io/component: backup
                      continuum.io/snapshot-of: $1
                  spec:
                    {{- with $b.className }}
                    volumeSnapshotClassName: {{ . | quote }}
                    {{- end }}
                    source:
                      persistentVolumeClaimName: $2
                  EOF
                    kubectl -n {{ $ns }} wait --for=jsonpath='{.status.readyToUse}'=true "volumesnapshot/$name" --timeout={{ $b.readyTimeout }}
                  }
                  prune() { # $1 = component label; keep the newest {{ $b.retain }}
                    kubectl -n {{ $ns }} get volumesnapshot \
                      -l "app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=backup,continuum.io/snapshot-of=$1" \
                      --sort-by=.metadata.creationTimestamp -o name \
                      | awk -v keep={{ $b.retain }} '{a[NR]=$0} END{for(i=1;i<=NR-keep;i++) print a[i]}' \
                      | xargs -r kubectl -n {{ $ns }} delete
                  }
                  {{- range $pvcs }}
                  snapshot {{ .component }} {{ .claim }}
                  prune {{ .component }}
                  {{- end }}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 32Mi}
{{- end }}
