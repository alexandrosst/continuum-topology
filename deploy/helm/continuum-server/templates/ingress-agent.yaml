{{- if .Values.agent.ingress.enabled }}
{{- /*
  TLS PASSTHROUGH for the agent port. The agents' mutual TLS is end to end with the server's own CA: a proxy that terminates it
  breaks every agent. With ingress-nginx this works only when the controller was started with --enable-ssl-passthrough; the
  controller then routes on the TLS SNI host and never looks at paths. Other controllers have their own switch (Traefik: an
  IngressRouteTCP with tls.passthrough; HAProxy: ssl-passthrough annotation): use agent.tlsRoute or your controller's CRD there.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "continuum.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.agent.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.agent.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.agent.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "continuum.fullname" . }}-agent
                port:
                  name: agent
{{- end }}
