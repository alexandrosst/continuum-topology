{{- if and .Values.pki.encryptAtRest (not .Values.pki.caKeyPassphraseSecret.name) }}
{{- /*
  Generated once and kept: on upgrade the value already in the cluster is reused (lookup), so a CA key this chart
  already encrypted under it stays openable. Regenerating this on every render would brick the server the moment it
  restarts with a passphrase that no longer opens its own key (internal/pki refuses to start, on purpose, rather than
  silently create a second CA over half of one). `lookup` returns nothing under `helm template` (Argo CD, Flux with
  helm template, --dry-run=client), so in those flows a new random passphrase is rendered on every run: create the
  Secret yourself and set pki.caKeyPassphraseSecret.name, exactly as with neo4j.auth.existingSecret.
*/ -}}
{{- $name := include "continuum.caPassphraseSecretName" . }}
{{- $key := include "continuum.caPassphraseSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pass := randAlphaNum 40 }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $pass = index $existing.data $key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # The CA private key on the data volume is encrypted under this passphrase the moment the server first sees it.
    # Losing this Secret without a copy of the encrypted key is harmless (the key is still on the volume); losing it
    # is catastrophic. Keep it if the release is removed, so a reinstall that reuses the volume can still open the key.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $pass | b64enc | quote }}
{{- end }}
