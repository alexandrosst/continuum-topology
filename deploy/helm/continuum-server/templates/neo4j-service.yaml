{{- if eq .Values.neo4j.mode "bundled" }}
# Headless: the server reaches the single Neo4j pod by name. Only the HTTP port is published (the server uses HTTP only);
# Bolt (7687) stays inside the pod. For an admin shell use `kubectl port-forward pod/<neo4j pod> 7474 7687`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum.neo4jName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  clusterIP: None
  selector: {{- include "continuum.neo4jSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
{{- end }}
