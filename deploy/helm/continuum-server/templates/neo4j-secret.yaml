{{- if and (eq .Values.neo4j.mode "bundled") (not .Values.neo4j.auth.existingSecret) }}
{{- /*
  Generated once and kept: on upgrade the value already in the cluster is reused (lookup), so the server and the Neo4j data
  volume never disagree. `lookup` returns nothing under `helm template` (Argo CD, Flux with helm template, --dry-run=client), so
  in those flows a new random password is rendered on every run: create the Secret yourself and set neo4j.auth.existingSecret.
*/ -}}
{{- $name := include "continuum.neo4jSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := randAlphaNum 32 }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $pw = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
  annotations:
    # The password is baked into the Neo4j data volume on first start. Keep the Secret if the release is removed, so a reinstall
    # that reuses the volume still matches it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}
