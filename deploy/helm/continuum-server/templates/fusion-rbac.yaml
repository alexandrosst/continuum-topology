{{- if include "continuum.fusionControl" . }}
{{- $n := include "continuum.fusionName" . }}
{{- $grafana := ternary (printf ", %s-grafana" $n) "" (.Values.fusion.grafana.enabled | default false) }}
{{- /* The stores' pods and claims: a StatefulSet's pod is <name>-0 and its claim <template>-<pod>, and the subchart's template is "data". internal/chart/server_fusion_test.go pins these names to what the subchart renders. */}}
{{- $pods := list (printf "%s-prometheus-0" $n) (printf "%s-loki-0" $n) (printf "%s-tempo-0" $n) }}
{{- if .Values.fusion.grafana.enabled | default false }}{{- $pods = append $pods (printf "%s-grafana-0" $n) }}{{- end }}
{{- $claims := list }}
{{- range $pods }}{{- $claims = append $claims (printf "data-%s" .) }}{{- end }}
{{- /* The three stores only: what the server may restart and grow when it changes retention. Grafana's pod and volume are not part of that. */}}
{{- $storePods := list (printf "%s-prometheus-0" $n) (printf "%s-loki-0" $n) (printf "%s-tempo-0" $n) }}
{{- $storeClaims := list }}
{{- range $storePods }}{{- $storeClaims = append $storeClaims (printf "data-%s" .) }}{{- end }}
# The only things this server may do with the Kubernetes API: switch FUSION on and off, change how long the stores keep
# their data (and grow their volumes), and read what it needs to say why a part is not starting or where it can be
# reached. Namespaced, and every rule names the objects it covers - the stores (and their pods and volume claims), the
# central gateway, its Service, its certificate Secret and its settings - so it cannot see or touch anything else in the
# namespace. There is no create, list or watch, the only delete is a store's own pod (a restart), and no Secret can be read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "continuum.fullname" . }}-fusion-switch
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
rules:
  # Read the workloads' state ("starting", "running") and their replica count.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $n }}-prometheus, {{ $n }}-loki, {{ $n }}-tempo{{ $grafana }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $n }}-central]
    verbs: ["get"]
  # The switch itself: set the replica count to 0 or 1, through the scale subresource only.
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: [{{ $n }}-prometheus, {{ $n }}-loki, {{ $n }}-tempo{{ $grafana }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ $n }}-central]
    verbs: ["get", "patch"]
  # Why a store is not starting ("cannot download the image", "waiting for a volume"): its one pod and its one volume
  # claim, read-only. The gateway's pod has a generated name and is not covered.
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ join ", " $pods }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: [{{ join ", " $claims }}]
    verbs: ["get"]
  # Retention: the stores read how long to keep data from one ConfigMap, which the server changes. It holds no secret.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $n }}-settings]
    verbs: ["get", "patch"]
  # A store reads its settings when it starts: the server restarts it by deleting its pod, which its StatefulSet puts back.
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ join ", " $storePods }}]
    verbs: ["delete"]
  # A bigger volume when the retention needs it: the claim's requested size, which the storage class must allow to grow.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: [{{ join ", " $storeClaims }}]
    verbs: ["patch"]
  # Where the gateway can be reached: the address its LoadBalancer or NodePort Service was given.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ $n }}-central]
    verbs: ["get"]
  # Put the gateway's server and CA certificates in. Write-only: this role cannot read the Secret back.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $n }}-central-receiver-tls]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "continuum.fullname" . }}-fusion-switch
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "continuum.fullname" . }}-fusion-switch
subjects:
  - kind: ServiceAccount
    name: {{ include "continuum.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
