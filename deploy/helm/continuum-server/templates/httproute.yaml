{{- if .Values.httproute.enabled }}
{{- /* Gateway API HTTPRoute for the UI (HTTPS is terminated by the Gateway listener). */ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "continuum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.httproute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  {{- with .Values.httproute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "continuum.fullname" . }}
          port: {{ .Values.admin.service.port }}
{{- end }}
