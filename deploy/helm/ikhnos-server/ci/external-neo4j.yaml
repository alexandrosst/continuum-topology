# Neo4j run elsewhere, over https; closed registration; the first admin's password comes from a Secret you created:
#   kubectl -n ikhnos create secret generic ikhnos-admin --from-literal=password='...'
#   kubectl -n ikhnos create secret generic neo4j-credentials --from-literal=password='...' --from-literal=username=ikhnos
agent:
  publicAddress: "203.0.113.7:8443"
registration: closed
admin:
  behindTlsProxy: true
  existingPasswordSecret: ikhnos-admin
neo4j:
  mode: external
  database: ikhnos
  external:
    url: https://neo4j.example.com:7473
    existingSecret: neo4j-credentials
    passwordKey: password
    usernameKey: username
geoip:
  path: /geoip/dbip-city-lite.mmdb
extraVolumes:
  - name: geoip
    persistentVolumeClaim: {claimName: geoip-db, readOnly: true}
extraVolumeMounts:
  - {name: geoip, mountPath: /geoip, readOnly: true}
decider:
  allowCIDRs: ["10.20.0.0/16"]

# The secrets the server must read back are stored as they are here; a real install names a key Secret (sealing.keySecret.name).
sealing:
  disabled: true
