apiVersion: v1
kind: Service
metadata:
  name: {{ include "ikhnos.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ikhnos.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.admin.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.admin.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.admin.service.type }}
  selector: {{- include "ikhnos.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.admin.service.port }}
      targetPort: admin
      protocol: TCP
      appProtocol: {{ if include "ikhnos.adminTLS" . }}https{{ else }}http{{ end }}
