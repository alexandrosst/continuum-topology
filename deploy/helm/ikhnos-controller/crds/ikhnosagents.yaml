# An IkhnosAgent asks the controller to keep one Ikhnos agent installed in this cluster. The controller is optional: it installs the same
# agent chart the Connect page's `helm install` does, from the same choices. See docs-site/docs/architecture/lifecycle.md.
#
# Helm installs what is in a chart's crds/ directory once and never changes it afterwards, so a new version of this definition is applied
# by hand: `kubectl apply -f` this file (the chart's README says so on every upgrade).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ikhnosagents.ikhnos.io
spec:
  group: ikhnos.io
  scope: Namespaced
  names:
    kind: IkhnosAgent
    listKind: IkhnosAgentList
    plural: ikhnosagents
    singular: ikhnosagent
    shortNames: [ikagent]
    categories: [ikhnos]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Server
          type: string
          jsonPath: .spec.server.address
        - name: Chart
          type: string
          jsonPath: .status.release.chartVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: IkhnosAgent keeps one Ikhnos agent installed in its namespace.
          required: [spec]
          properties:
            spec:
              type: object
              required: [server]
              properties:
                server:
                  type: object
                  description: The server the agent enrols with.
                  required: [address, caPin]
                  properties:
                    address:
                      type: string
                      description: host:port of the server's agent listener.
                      minLength: 3
                    caPin:
                      type: string
                      description: Pin of the server's CA (sha256/...), shown by the Connect page.
                      minLength: 1
                enrollment:
                  type: object
                  properties:
                    tokenSecretRef:
                      type: object
                      description: >-
                        A Secret in this namespace that holds the one-time enrolment token. Needed until the agent has enrolled;
                        after that it may be removed.
                      required: [name]
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          description: The key that holds the token. Default token.
                accessTier:
                  type: integer
                  description: The access ceiling to install with. Absent, the chart's default (2).
                  minimum: 0
                  maximum: 2
                collectors:
                  type: object
                  description: The parts of the agent that run on every node. Each is off unless asked for.
                  properties:
                    nodeProbe:
                      type: boolean
                      description: Reads facts about each machine. Needs accessTier 1 or more.
                    flowObserver:
                      type: boolean
                      description: Counts which workloads talk to which. Needs accessTier 2.
                    measurements:
                      type: boolean
                      description: Times TCP connections to addresses the server names. Needs accessTier 2.
                scope:
                  type: object
                  description: Which namespaces the agent reports. Empty, all of them.
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                    exclude:
                      type: array
                      items:
                        type: string
                    selector:
                      type: string
                      description: Adds the namespaces carrying a label, written key=value (or just key).
                purgeIdentityOnDelete:
                  type: boolean
                  description: Deleting this resource also deletes the agent's identity Secret, which an uninstall keeps by default.
                image:
                  type: object
                  description: Where the agent's image comes from, when not the chart's own.
                  properties:
                    repository:
                      type: string
                    tag:
                      type: string
                    digest:
                      type: string
                telemetry:
                  type: object
                  description: >-
                    What the agent collects and where it sends it, as the Telemetry panel sets it. It is all of the agent's telemetry (what it does not
                    say is the chart's default), so without it the agent has none. The controller must have been given allowTelemetry. Extra processors
                    and a regional operator as the destination are not here: use the helm command for those.
                  properties:
                    signals:
                      type: object
                      description: Each signal is off unless asked for.
                      properties:
                        resourceUsage: {type: boolean}
                        energy: {type: boolean}
                        kubernetesState: {type: boolean}
                        nodeRuntime: {type: boolean}
                        networkLatency: {type: boolean, description: Needs collectors.measurements.}
                        clusterLinks: {type: boolean, description: Needs accessTier 2.}
                        applicationMetrics: {type: boolean}
                        systemLogs: {type: boolean}
                        kubernetesEvents: {type: boolean}
                        applicationLogs: {type: boolean}
                        traces: {type: boolean}
                        accelerators: {type: boolean}
                    energy:
                      type: object
                      properties:
                        kind:
                          type: string
                          description: bundle-kepler (the default) or existing.
                          enum: [bundle-kepler, existing]
                        endpoint:
                          type: string
                          description: host:port of the Kepler that already runs, when kind is existing.
                    accelerators:
                      type: object
                      properties:
                        kind:
                          type: string
                          description: bundle-dcgm (the default) or existing.
                          enum: [bundle-dcgm, existing]
                        endpoint:
                          type: string
                        applyScope:
                          type: boolean
                          description: Attach the pod and namespace using the GPU, so the namespace scope narrows GPU metrics too.
                    clusterLinks:
                      type: object
                      properties:
                        probe:
                          type: boolean
                          description: Runs the active probe (delay, jitter, loss, path size and route).
                        throughput:
                          type: boolean
                          description: Also runs and answers throughput tests. Needs probe.
                        authSecret:
                          type: string
                          description: A Secret of your own with iperf3's credentials. Empty, Ikhnos issues them.
                    scopes:
                      type: object
                      properties:
                        applicationMetrics:
                          type: object
                          properties:
                            namespaces:
                              type: array
                              items:
                                type: string
                            exclude:
                              type: array
                              items:
                                type: string
                            workloads:
                              type: array
                              description: Inside a namespace, keep only the named workloads. A namespace listed with no names keeps nothing of it.
                              items:
                                type: object
                                required: [namespace]
                                properties:
                                  namespace:
                                    type: string
                                  names:
                                    type: array
                                    items:
                                      type: string
                        applicationLogs:
                          type: object
                          properties:
                            namespaces:
                              type: array
                              items:
                                type: string
                            exclude:
                              type: array
                              items:
                                type: string
                            workloads:
                              type: array
                              description: Inside a namespace, keep only the named workloads. A namespace listed with no names keeps nothing of it.
                              items:
                                type: object
                                required: [namespace]
                                properties:
                                  namespace:
                                    type: string
                                  names:
                                    type: array
                                    items:
                                      type: string
                        traces:
                          type: object
                          properties:
                            namespaces:
                              type: array
                              items:
                                type: string
                            exclude:
                              type: array
                              items:
                                type: string
                            workloads:
                              type: array
                              description: Inside a namespace, keep only the named workloads. A namespace listed with no names keeps nothing of it.
                              items:
                                type: object
                                required: [namespace]
                                properties:
                                  namespace:
                                    type: string
                                  names:
                                    type: array
                                    items:
                                      type: string
                        infrastructure:
                          type: boolean
                          description: The infrastructure signals follow the scope the application signals combine to.
                    destination:
                      type: object
                      description: Where telemetry goes. The credential is read from the Secret authSecret, never written here.
                      properties:
                        endpoint:
                          type: string
                          description: host:port, or a URL.
                        protocol:
                          type: string
                          description: grpc (the default), http (both OTLP) or zipkin (spans only).
                          enum: [grpc, http, zipkin]
                        insecure:
                          type: boolean
                          description: Turns TLS verification off.
                        authHeader:
                          type: string
                          description: The header the credential is sent in. Default Authorization.
                        authSecret:
                          type: string
                          description: A Secret in this namespace that holds the credential.
                        authKey:
                          type: string
                          description: The key of that Secret. Default token.
                    routes:
                      type: object
                      description: Send each kind of signal to a destination of its own, instead of everything to destination.
                      properties:
                        split:
                          type: boolean
                        metrics:
                          type: object
                          description: Where telemetry goes. The credential is read from the Secret authSecret, never written here.
                          properties:
                            endpoint:
                              type: string
                              description: host:port, or a URL.
                            protocol:
                              type: string
                              description: grpc (the default), http (both OTLP) or zipkin (spans only).
                              enum: [grpc, http, zipkin]
                            insecure:
                              type: boolean
                              description: Turns TLS verification off.
                            authHeader:
                              type: string
                              description: The header the credential is sent in. Default Authorization.
                            authSecret:
                              type: string
                              description: A Secret in this namespace that holds the credential.
                            authKey:
                              type: string
                              description: The key of that Secret. Default token.
                        logs:
                          type: object
                          description: Where telemetry goes. The credential is read from the Secret authSecret, never written here.
                          properties:
                            endpoint:
                              type: string
                              description: host:port, or a URL.
                            protocol:
                              type: string
                              description: grpc (the default), http (both OTLP) or zipkin (spans only).
                              enum: [grpc, http, zipkin]
                            insecure:
                              type: boolean
                              description: Turns TLS verification off.
                            authHeader:
                              type: string
                              description: The header the credential is sent in. Default Authorization.
                            authSecret:
                              type: string
                              description: A Secret in this namespace that holds the credential.
                            authKey:
                              type: string
                              description: The key of that Secret. Default token.
                        traces:
                          type: object
                          description: Where telemetry goes. The credential is read from the Secret authSecret, never written here.
                          properties:
                            endpoint:
                              type: string
                              description: host:port, or a URL.
                            protocol:
                              type: string
                              description: grpc (the default), http (both OTLP) or zipkin (spans only).
                              enum: [grpc, http, zipkin]
                            insecure:
                              type: boolean
                              description: Turns TLS verification off.
                            authHeader:
                              type: string
                              description: The header the credential is sent in. Default Authorization.
                            authSecret:
                              type: string
                              description: A Secret in this namespace that holds the credential.
                            authKey:
                              type: string
                              description: The key of that Secret. Default token.
                    processing:
                      type: object
                      properties:
                        resourceDetection:
                          type: boolean
                        redaction:
                          type: boolean
                          description: Masks values of keys that look like secrets before anything leaves the cluster.
                        tracesSamplingPercent:
                          type: number
                          description: The share of traces kept. Default 100.
                          minimum: 0
                          maximum: 100
                        debug:
                          type: string
                          description: Writes what passed to the collector's own log.
                          enum: [basic, detailed]
                        tags:
                          type: array
                          description: Labels put on everything the agent emits.
                          items:
                            type: object
                            required: [key, value]
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                    owner:
                      type: object
                      description: Who the telemetry belongs to, stamped on everything as ikhnos.org.id and ikhnos.cluster.id.
                      properties:
                        orgId:
                          type: string
                        clusterId:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Installing, Ready, Failed, Invalid, Blocked, Deleting]
                observedGeneration:
                  type: integer
                  format: int64
                release:
                  type: object
                  properties:
                    name:
                      type: string
                    revision:
                      type: integer
                    chartVersion:
                      type: string
                valuesHash:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
