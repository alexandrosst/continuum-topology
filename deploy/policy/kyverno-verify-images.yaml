# Refuse to run a Continuum image that was not signed by scripts/publish.sh, using Kyverno's built-in cosign
# verification (verifyImages) rather than a separate Sigstore policy-controller install. See "Signing and
# verifying releases" in ../README.md for how publish.sh signs, and how to check what the last release was signed
# with before you fill in the two placeholders below.
#
# Install Kyverno first if you don't already run it: https://kyverno.io/docs/installation/
#   helm install kyverno kyverno/kyverno -n kyverno --create-namespace
#
# Then, with the placeholders filled in:
#   kubectl apply -f kyverno-verify-images.yaml
#
# Kyverno reports every admission (allowed or blocked) as a PolicyReport
# (kubectl get policyreport -A), so a rollout that starts failing here shows up there, not just as a stuck
# Deployment.
#
# START IN AUDIT MODE. `validationFailureAction: Audit` (the default below) never blocks anything: it only
# records a failing PolicyReport, so you can point this at a live cluster, deploy a Continuum agent as usual, and
# check `kubectl get policyreport -A` shows a PASS for it before you flip a word below to `Enforce` and mean it.
# Deploying an *unsigned* build in Audit mode (e.g. one you built locally without SIGN=1) is exactly what should
# show up as a FAIL in the report - if it doesn't, the identity/issuer below don't match what you actually signed
# with, and Enforce would then block nothing at all.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-continuum-images
  annotations:
    policies.kyverno.io/title: Verify Continuum image signatures
    policies.kyverno.io/description: >-
      Requires every continuum-agent and continuum-server image to carry a valid cosign signature from the
      identity/issuer that scripts/publish.sh signs releases with, before Kubernetes admits the pod.
spec:
  validationFailureAction: Audit # change to Enforce only once PolicyReport shows this catches what it should
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-continuum-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            # Match by repository name, whatever registry/namespace you publish to (scripts/publish.sh's REGISTRY
            # argument): the images are always named .../continuum and .../server. Narrow this to your exact
            # registry (e.g. "ghcr.io/yourname/continuum") once you have one, so a same-named image from
            # elsewhere can never satisfy this rule by accident.
            - "*/continuum"
            - "*/continuum:*"
            - "*/server"
            - "*/server:*"
          attestors:
            - entries:
                - keyless:
                    # The identity that ran scripts/publish.sh - a person's OIDC email for an interactive keyless
                    # sign, or a CI provider's own workflow identity. Find out what a specific tag was actually
                    # signed with (rather than guess) with:
                    #   cosign verify --certificate-identity-regexp '.*' --certificate-oidc-issuer-regexp '.*' \
                    #     <registry>/continuum:<tag>
                    # which prints the real "Issuer" and "Subject" from the signature's certificate - copy those
                    # here exactly, then re-run the same command WITHOUT the "-regexp" suffixes (using
                    # --certificate-identity and --certificate-oidc-issuer instead) to confirm it still passes
                    # with the exact values pinned, before trusting Kyverno to enforce the same check.
                    subject: "REPLACE-ME@example.com" # e.g. the GitHub account, or a CI workflow's subject
                    issuer: "https://github.com/login/oauth" # e.g. https://token.actions.githubusercontent.com for GitHub Actions OIDC
                    rekor:
                      url: https://rekor.sigstore.dev
