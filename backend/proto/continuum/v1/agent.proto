syntax = "proto3";

package continuum.v1;

option go_package = "continuum/gen/continuumv1;continuumv1";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Enrollment: served over TLS without a client certificate (the agent has none
// yet). Everything here is authenticated by a one-time token (Enroll) or by a
// per-enrollment secret (PollEnrollment).
// ---------------------------------------------------------------------------
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc PollEnrollment(PollRequest) returns (PollResponse);
  // Rejoin lets an agent whose certificate expired while it was offline get a new one without a
  // new token. Proof: the expired certificate (signed by our CA, recent) plus a request signed
  // by the same private key. The agent must still be approved; revocation always wins.
  rpc Rejoin(RejoinRequest) returns (RenewResponse);
}

message RejoinRequest {
  bytes expired_leaf_der = 1;
  // PKCS#10 request (DER) made with the SAME key as expired_leaf_der. Its self-signature is the
  // proof that the sender still holds that key; the server checks the public keys are identical.
  bytes csr_der = 2;
}

message EnrollRequest {
  string token = 1;
  // PKCS#10 certificate request (DER). ECDSA P-256 only. The private key never leaves the agent.
  bytes csr_der = 2;
  // UID of the kube-system namespace: the cluster's identity. A human confirms it before approval.
  string cluster_fingerprint = 3;
  string agent_version = 4;
  string kubernetes_version = 5;
  // The highest access tier the installed RBAC allows (0-4). The server decides what is accepted.
  uint32 installed_access_tier = 6;
  // Binds the approval code the agent prints in its own log to this request: an Argon2id hash of the
  // code, salted with the hash of the request's public key (see internal/approval). The code itself is
  // never sent; the server keeps only this hash and checks what the administrator types against it.
  // Empty from an older agent: the enrollment is then "legacy" and is approved by the old fingerprint
  // confirmation. Sending the same token, key and hash again is a retry of the same enrollment.
  bytes approval_code_hash = 7;
}

message EnrollResponse {
  string agent_id = 1;
  // Known only to this agent; needed to poll and to collect the certificate after approval. A retry
  // of the same enrollment gets a fresh one (the first response may have been lost).
  string poll_secret = 2;
  int32 poll_interval_seconds = 3;
  // The server's clock (Unix seconds), so the agent can tell when its own is off.
  int64 server_time_unix = 4;
  // How long the server keeps this enrollment waiting for approval before it expires.
  int32 pending_ttl_seconds = 5;
}

message PollRequest {
  string agent_id = 1;
  string poll_secret = 2;
}

message PollResponse {
  enum State {
    PENDING = 0;
    APPROVED = 1;
    REJECTED = 2;
    // Nobody approved it in time. The token is not spent: the agent enrolls again with the same key
    // and token, and prints a new approval code.
    EXPIRED = 3;
  }
  State state = 1;
  bytes leaf_der = 2;
  bytes ca_der = 3;
  google.protobuf.Timestamp not_after = 4;
  string reason = 5;
  // While PENDING: when to ask again. The agent clamps it (2-60 s) and adds jitter.
  int32 poll_after_seconds = 6;
  int64 server_time_unix = 7;
}

// ---------------------------------------------------------------------------
// Agent service: mutual TLS only. The client certificate identifies the agent.
// ---------------------------------------------------------------------------
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  bytes leaf_der = 1;
  bytes ca_der = 2;
  google.protobuf.Timestamp not_after = 3;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Sync sync = 2;
    Heartbeat heartbeat = 3;
    FlowBatch flows = 4;
    Measurements measurements = 5;
  }
}

message Hello {
  string agent_version = 1;
  string kubernetes_version = 2;
  uint32 installed_access_tier = 3;
  // What this agent is, what its install allows (the ceiling the cluster's owner set with the chart) and what it
  // is doing about it. The server records it, and can only ever narrow within it. Absent from an older agent.
  Diagnostics diagnostics = 4;
  // The Kubernetes namespace this agent's own Helm release lives in (its own pod's namespace, from the
  // Kubernetes downward API, not a value it was told). The server needs this to print a `helm upgrade` or
  // `helm uninstall` command that actually targets the right release; before this field existed it always
  // guessed "continuum-system". Empty for an older agent, in which case that guess is still shown, with a
  // note that it may be wrong.
  string namespace = 5;
  // The name of the Helm release this agent was installed as (`helm install RELEASE_NAME ...`), templated in as
  // `.Release.Name` at chart-render time (Helm does not expose this to a running pod any other way). Every object the
  // chart creates has a fixed name regardless of the release name, so this only matters for the two `helm` commands
  // themselves, not for anything `kubectl` deletes. Empty for an older agent, in which case those commands guess
  // "continuum-agent", with a note that it may be wrong.
  string release_name = 6;
}

message Heartbeat {
  repeated ModuleStatus modules = 1;
  // The agent's clock minus the server's, in milliseconds, as measured when the stream was set up
  // (Config.server_time_unix). Positive: the agent's clock runs ahead. Zero: not measured.
  int64 clock_skew_ms = 2;
  // The agent's own account of itself, sent when it changed and at least every five minutes.
  Diagnostics diagnostics = 3;
}

message ModuleStatus {
  enum State {
    OK = 0;
    SKIPPED = 1;
    ERROR = 2;
  }
  string name = 1;
  State state = 2;
  // Why it did not run, e.g. "not permitted by installed RBAC". Shown to the user.
  string reason = 3;
}

// One batch of observed facts. With full=true it is the complete state and anything
// not in it no longer exists; otherwise it carries only what changed.
message Sync {
  uint64 seq = 1;
  bool full = 2;
  ClusterFacts cluster = 3;
  repeated NodeFacts nodes = 4;
  repeated string deleted_nodes = 5;
  repeated NamespaceFacts namespaces = 6;
  repeated string deleted_namespaces = 7;
  repeated WorkloadFacts workloads = 8;
  repeated string deleted_workloads = 9;
  repeated ModuleStatus modules = 10;
  // Chunked delivery. A picture too large for one message is sent as chunk_total messages sharing one sync_id,
  // numbered 0..chunk_total-1 in order, each with the same full flag and seq. The server assembles them and applies
  // the result atomically when the last one arrives; a connection that ends first leaves the previous state as it
  // was. chunk_total 0 or 1 is an ordinary single-message sync.
  uint32 chunk_index = 11;
  uint32 chunk_total = 12;
  string sync_id = 13;
}

// Facts are raw observations. Interpretation (distribution, VM or bare metal,
// application grouping) happens on the server so rules can change without
// redeploying agents.
message ClusterFacts {
  string uid = 1;
  string version = 2;
  // Host of the API endpoint as configured on the agent (never credentials).
  string api_host = 3;
  repeated string storage_classes = 4;
  repeated string ingress_classes = 5;
  // Creation time of the kube-system namespace: the best available answer to "how old is this cluster".
  google.protobuf.Timestamp created_at = 6;
  // What this agent was told to leave out of view. Absent: everything is visible.
  ScopeFacts scope = 7;
  // The service mesh found in the cluster, if any. Absent: none was found (or the mesh module is off).
  MeshFacts mesh = 8;
  // The cluster's Service CIDR, as best the agent can tell: the smallest IPv4 range covering every
  // ClusterIP currently assigned. A floor, not a fact - only as wide as what happens to be allocated so
  // far, same limitation as the node pod CIDRs this same message carries; the server may widen it to a
  // distribution's well-known default the same way it does for pod_cidr. Computed on the agent, from
  // Service objects that never themselves leave the cluster (see joinServices): only this one summary
  // value is sent, never an individual ClusterIP.
  string service_cidr = 9;
  // Pods in Pending phase with no node assigned yet, across every namespace this agent can see (fewer than
  // the whole cluster's in namespaced RBAC mode, same limitation service_cidr above already has). Absent
  // means pods were never read (below tier 2), not that none are pending.
  optional int32 pending_pod_count = 10;
}

// Which namespaces the agent reports on. Out-of-scope namespaces are dropped in the agent, so nothing
// about them (not even their names) reaches the server; only how many there are.
message ScopeFacts {
  // Human-readable rule, e.g. "only namespaces shop, payments" or "all except dev".
  string description = 1;
  int32 namespaces_total = 2;
  int32 namespaces_in_scope = 3;
}

// A service mesh as far as the agent could tell from labels, annotations, container names and the
// mesh's own policy objects. Nothing here comes from the proxies themselves.
message MeshFacts {
  string kind = 1;    // istio | linkerd | consul | kuma | cilium
  string mode = 2;    // sidecar | ambient | node-proxy
  string version = 3; // from the control plane's image tag; empty when unknown
  // Workload keys ("namespace/Kind/name") of the control plane and the gateways.
  repeated string control_plane = 4;
  // Mesh-wide mutual TLS between meshed workloads: strict | permissive | disabled | automatic | unknown.
  string mtls = 5;
  // Per-namespace mode where a policy overrides the mesh-wide one.
  map<string, string> namespace_mtls = 6;
  // Whether the mesh's policy objects could be read (needs the extra RBAC the chart grants at tier 2).
  bool policy_read = 7;
  // Why the policy objects were not read, when they were not.
  string policy_note = 8;
}

// One workload's relation to the mesh.
message WorkloadMesh {
  string mesh = 1;  // istio | linkerd | ...
  string proxy = 2; // sidecar | ambient | node-proxy; empty when traffic does not go through a proxy
  // Injection was explicitly switched off for this workload.
  bool bypass = 3;
  // Ports the workload excludes from the proxy (from its annotations), so they are not intercepted.
  repeated string excluded_ports = 4;
  // The workload is part of the mesh's own control plane or a gateway.
  bool control_plane = 5;
  // "namespace" or "workload": where the injection setting was read from.
  string source = 6;
}

message NodeFacts {
  string key = 1;
  string name = 2;
  string uid = 3;
  string machine_id = 4;
  string system_uuid = 5;
  string provider_id = 6;
  repeated string internal_ips = 7;
  string os_image = 8;
  string kernel_version = 9;
  string container_runtime = 10;
  string kubelet_version = 11;
  string architecture = 12;
  int64 cpu_capacity_millis = 13;
  int64 memory_capacity_bytes = 14;
  int64 cpu_allocatable_millis = 15;
  int64 memory_allocatable_bytes = 16;
  int64 cpu_requested_millis = 17;
  int64 memory_requested_bytes = 18;
  map<string, string> labels = 19;
  // Only annotations on the agent's allow-list.
  map<string, string> annotations = 20;
  repeated string taints = 21;
  bool ready = 22;
  // Active problem conditions only (MemoryPressure, DiskPressure, ...).
  repeated string problem_conditions = 23;
  repeated string pod_cidrs = 24;
  // Extended resources from node capacity, e.g. nvidia.com/gpu.
  map<string, int64> extended_resources = 25;
  google.protobuf.Timestamp created_at = 26;
  // How many pods the kubelet will run at most (capacity "pods"); the real limit on small boards.
  int32 pod_capacity = 27;
  // Pods currently placed on the node. Unset unless the agent reads pods (tier 2), so "unknown"
  // is never mistaken for "empty". The same holds for the requested_* fields above.
  optional int32 pod_count = 28;
  // What the optional node probe read from the machine itself. Absent when no probe runs on this node.
  HostProbe probe = 29;
  // Addresses on the node that are reachable from outside the machine (the API's ExternalIP entries).
  repeated string external_ips = 30;
  // Root filesystem capacity Kubernetes reports for this node ("ephemeral-storage" in Capacity/
  // Allocatable) - what pod ephemeral storage, images and logs actually share, not any one physical
  // disk's raw size (HostProbe.disks below has those). Not `optional`: every real kubelet reports this as
  // part of Capacity/Allocatable once the node exists, so unlike pod_count/pending_pod_count above there is
  // no "never collected" case worth a pointer for - a bare 0 here would mean the node object itself is
  // missing this key entirely, which does not happen for a real, running node.
  int64 ephemeral_storage_capacity_bytes = 31;
  int64 ephemeral_storage_allocatable_bytes = 32;
}

// Read-only observations of one machine, made by the node probe (a small DaemonSet the administrator
// installs on purpose). Free-text fields are copied from firmware and are untrusted display text.
// Nothing here identifies a person or the machine uniquely: serial numbers, MAC addresses and
// UUIDs are never read.
message HostProbe {
  string probe_version = 1;
  // CPUID hypervisor bit, from /proc/cpuinfo. The most reliable single signal for "this is a VM".
  bool hypervisor_bit = 2;
  // /sys/hypervisor/type (e.g. "xen"), when the kernel exposes it.
  string hypervisor_type = 3;
  // DMI/SMBIOS strings (/sys/class/dmi/id). Empty on boards that have no firmware tables.
  string sys_vendor = 4;
  string product_name = 5;
  string board_vendor = 6;
  string board_name = 7;
  string bios_vendor = 8;
  // SMBIOS chassis type number (3 desktop, 10 notebook, 17 server chassis, ...); 0 when unknown.
  int32 chassis_type = 9;
  // Device-tree model of ARM boards (e.g. "Raspberry Pi 4 Model B Rev 1.4").
  string device_tree_model = 10;
  // Physical uplinks that are up: any of "ethernet", "wifi", "cellular". Virtual interfaces are ignored.
  repeated string uplinks = 11;
  // The machine has a battery, i.e. it can run without mains power.
  bool has_battery = 12;
  // CPUID leaf 0x40000000's 12-character hypervisor vendor ID (e.g. "KVMKVMKVM\0\0\0"), read directly
  // from the CPU (amd64 only) when hypervisor_bit is set - the same signal systemd-detect-virt and
  // virt-what use to name a hypervisor. Unlike sys_vendor/product_name/bios_vendor, this cannot be blank
  // on a minimal or hardened cloud image: any hypervisor that sets the CPUID hypervisor bit is expected
  // to answer this leaf, so it is a stronger, independent corroboration of vmPlatform's DMI-string match
  // rather than a replacement for it - a hypervisor absent from the known-vendor-ID table still falls
  // back to whatever DMI names.
  string hypervisor_vendor_id = 13;
  // CPU model name from /proc/cpuinfo ("model name"), e.g. "Intel(R) Xeon(R) Platinum 8259CL CPU @
  // 2.50GHz". Empty on CPUs whose kernel driver leaves this blank (some ARM boards). Unlike NodeFacts'
  // own CPU figure (Kubernetes-visible millicore capacity, which a cgroup limit can shrink), this and
  // cpu_threads below are read straight from the machine's own /proc/cpuinfo, world-readable and the same
  // regardless of any pod/cgroup limit.
  string cpu_model = 14;
  // Logical CPUs (hardware threads): one "processor" line per entry in /proc/cpuinfo. 0 when unreadable.
  int32 cpu_threads = 15;
  // Physical network interfaces the probe found up, richer than uplinks above: one entry per interface
  // (not just which kinds are present), each with its negotiated link speed and MTU when sysfs reports
  // them. uplinks is kept, unchanged, for what already reads it.
  repeated NetworkInterface interfaces = 16;
  // Physical block devices (see the Disk message doc for exactly what is, and is not, read).
  repeated Disk disks = 17;
  // Overlay/tunnel interfaces the node has up (see the TunnelInterface message doc for exactly what is,
  // and is not, read, and what privilege this needs - none beyond what the probe already has).
  repeated TunnelInterface tunnels = 18;
  // This node's own routable network prefix(es) (e.g. "10.0.5.12/24") - taken only from whichever
  // interface currently owns the machine's default route (0.0.0.0/0 or ::/0), the same kernel-chosen
  // "real uplink" selection `ip route get 8.8.8.8` would show, never guessed by interface name. Loopback
  // and link-local addresses are never included - a default route never legitimately points at either.
  // Used server-side only to look for two onboarded clusters whose nodes sit on the very same flat
  // network segment with no tunnel involved at all - see model.ClusterLink's own doc for what that does
  // and does not establish, and why this needs the same two-way, specificity-floored corroboration
  // tunnels already get rather than being trusted from one side alone.
  repeated string host_subnets = 19;
}

// One physical network interface the node probe found up (see HostProbe.interfaces). Everything here is
// read from sysfs, world-readable, and describes the link itself - never an address (see the package doc:
// MAC addresses are never read).
message NetworkInterface {
  string name = 1; // e.g. "eth0", "wlan0"
  string kind = 2; // ethernet | wifi | cellular
  // Negotiated link speed in Mbit/s, from /sys/class/net/<name>/speed. 0 when the driver does not report
  // one - common for wifi/cellular and for some virtual-feeling NIC drivers that still count as physical
  // here (e.g. certain cloud SR-IOV NICs): 0 means "not known", not "no link".
  int32 speed_mbps = 3;
  int32 mtu = 4;
}

// One physical block device the node probe found (see HostProbe.disks). Capacity and a model name are
// read from sysfs, world-readable, the same as everything else in this file - never a serial number,
// WWN or any other per-disk identifier: the package doc's "never reads serial numbers... or disks"
// narrows, with this message, to "disk capacity and type, never a disk's own identity".
message Disk {
  string name = 1;       // kernel device name, e.g. "sda", "nvme0n1" - not a stable identifier across reboots
  string model = 2;       // from /sys/block/<name>/device/model, e.g. "Samsung SSD 970 EVO"; empty when unreported
  int64 size_bytes = 3;
  string type = 4;        // hdd | ssd | nvme | "" when not determinable
}

// One overlay/tunnel network interface the node probe found up (see HostProbe.tunnels). Identified
// generically from the kernel's own netlink IFLA_INFO_KIND for the link - the same field `ip -d link
// show` reads to print "wireguard"/"vxlan"/"gre"/... after an interface's name - rather than guessed from
// a name prefix, so a renamed interface of a recognized kind is still caught and an interface merely
// *named* "wg0" that isn't really WireGuard is not. Covers every kernel tunnel driver that registers a
// link kind this way: WireGuard, VXLAN, Geneve, GRE/GRETAP (v4 and v6), IPIP, SIT (6in4), and route-based
// IPsec (VTI/VTI6, and XFRM interfaces). Reading link kinds, addresses and routes over netlink needs no
// capability beyond what reading them over sysfs already needed (confirmed: an ordinary unprivileged
// process can open an AF_NETLINK/NETLINK_ROUTE socket and dump links/addresses/routes - the same thing
// the `ip` command does as a normal user).
//
// Deliberately not covered: plain tun/tap devices (the kernel does not register a link kind for them the
// way it does for the drivers above, so they are indistinguishable from any other anonymous link without
// guessing from the name - left out rather than guessed) and policy-based IPsec that attaches XFRM
// policies directly to an ordinary interface instead of creating a dedicated VTI/XFRM link (invisible to
// this method; only route-based IPsec, which is what creates a link, is seen). Both are documented gaps,
// not silently-wrong positives.
message TunnelInterface {
  string name = 1;
  string kind = 2; // wireguard | vxlan | geneve | gre | gretap | ip6gre | ip6gretap | ipip | sit | vti | vti6 | xfrm
  // This interface's own address(es), each "ip/prefixlen" (e.g. "10.8.0.1/24") - from the same netlink
  // address dump `ip address show dev <name>` reads. Never the other end's address: that is what Routes
  // and Routes-based cross-node correlation, not this interface's own identity, are for.
  repeated string addresses = 3;
  // Destination prefixes the node's own routing table sends out through this interface (e.g.
  // "10.8.0.0/24"), from the same netlink route dump `ip route show dev <name>` reads - a default route
  // (0.0.0.0/0 or ::/0) is never included here, since it says nothing about what is specifically reachable
  // through the tunnel. Capped at a small number, like Flow.dns_query_names. This is the one fact that
  // makes cross-node correlation possible at all: whether another node's own known address falls inside
  // one of these prefixes is what an honest confidence label (confirmed vs. one side only) is based on.
  repeated string routes = 4;
  // This tunnel interface's own MTU, from the same netlink link dump Kind is read from - 0 when
  // unreported. A tunnel with a lower MTU than the physical path underneath it is a classic overlay
  // gotcha (larger packets silently fragment, or get dropped outright where a middlebox blocks
  // fragmentation), and this is the one place that fact is visible without logging into the machine.
  int32 mtu = 5;
  // Administrative up/down state (netlink IFF_UP, the same flag `ip link set up/down` toggles) - not a
  // guarantee the tunnel is currently passing traffic, only that it has not been disabled. Deliberately
  // not the kernel's operational-state field: several common tunnel drivers (WireGuard among them) never
  // report anything but "unknown" there even while fully up and carrying traffic.
  bool up = 6;
}

message NamespaceFacts {
  string key = 1;
  string name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
}

message ContainerImage {
  string image = 1;
  string digest = 2;
}

message WorkloadFacts {
  // namespace/kind/name, relative to the cluster.
  string key = 1;
  string namespace = 2;
  string kind = 3;
  string name = 4;
  int32 replicas = 5;
  int32 ready_replicas = 6;
  repeated ContainerImage images = 7;
  // Only labels and annotations on the agent's allow-list.
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
  // Names of the nodes this workload's pods run on.
  repeated string node_names = 10;
  int64 cpu_request_millis = 11;
  int64 memory_request_bytes = 12;
  int64 cpu_limit_millis = 13;
  int64 memory_limit_bytes = 14;
  repeated int32 ports = 15;
  // internal | node-port | load-balancer | ingress
  string exposure = 16;
  repeated string hosts = 17;
  map<string, string> node_selector = 18;
  repeated string tolerations = 19;
  int32 restarts = 20;
  google.protobuf.Timestamp created_at = 21;
  // Persistent volume claims the workload's pods mount. Only claim names are read from pods; every
  // other kind of volume (Secrets, ConfigMaps, host paths) is discarded on arrival.
  repeated VolumeClaim volume_claims = 22;
  // The HorizontalPodAutoscaler that targets this workload, if any.
  Autoscaler autoscaler = 23;
  // The PodDisruptionBudget that selects this workload's pods, if any.
  Disruption disruption = 24;
  // Addresses this workload can be reached on from outside its cluster, from its Services. Used to
  // recognise traffic that crosses from one onboarded cluster into another. ClusterIPs and pod IPs are
  // never listed: they mean nothing outside the cluster and overlap between clusters.
  repeated Address reachable = 25;
  // Set when the workload is in a mesh, or is the mesh itself.
  WorkloadMesh mesh = 26;
  // Containers, across all of this workload's pods, whose most recently known termination reason is
  // OOMKilled - Kubernetes only ever keeps ONE termination reason per container (its LastTerminationState),
  // so this is a live snapshot of "is the container's last known failure an OOM kill", not a cumulative
  // historical tally: a container OOM-killed five times in a row while staying on the same pod still
  // contributes at most 1 here (never 5), and that 1 reverts to 0 the moment the container fails again for
  // any other reason, silently losing the OOM history. Still a distinct, sharper signal than restarts
  // above for the common case: a restart can be a crash, a deploy, or a liveness-probe failure, while a
  // nonzero value here means the container's last restart specifically was because it asked for more
  // memory than its limit allowed.
  int32 oom_kills = 27;
  // One entry per pod backing this workload right now - the same minimal, privacy-conscious style as
  // Disk/TunnelInterface elsewhere in this file: no pod IP is ever included here (see Address's own
  // comment just below - a pod IP means nothing outside this cluster and is never sent to the server at
  // all), only facts that are already visible to anyone who can list pods in the namespace. Lets the
  // server show a workload's actual replica distribution and recent scaling (a freshly-created pod next
  // to others that have run for days) instead of only the aggregate replicas/ready_replicas/restarts
  // counters above, which flatten exactly that into a single number.
  repeated PodFacts pods = 28;
}

// One pod backing a WorkloadFacts right now. See WorkloadFacts.pods' own comment for what this is for
// and why it deliberately carries no address.
message PodFacts {
  string name = 1;
  // Which node this pod is scheduled on - WorkloadFacts.node_names already has the set of nodes a
  // workload's pods touch; this is the one pod -> one node fact itself; empty if not yet scheduled.
  string node_name = 2;
  // Pending | Running | Succeeded | Failed | Unknown - exactly as Kubernetes reports it, never re-derived.
  string phase = 3;
  bool ready = 4;
  // This pod's own restart count (every container's RestartCount, summed) - WorkloadFacts.restarts above
  // is already this same number summed again across every pod, which is exactly what flattens one
  // unusually-crashy replica among otherwise-healthy ones into an unremarkable average.
  int32 restarts = 5;
  // When the pod was created - WorkloadFacts.created_at is the *workload's* own age (when the Deployment/
  // StatefulSet/DaemonSet object itself was created), which never changes on a routine scale-up and so
  // cannot show one. This is the one fact that actually can: a pod noticeably younger than its siblings.
  google.protobuf.Timestamp created_at = 6;
}

message Address {
  // Empty for a node port, which is reachable on every node of the cluster.
  string ip = 1;
  int32 port = 2;
  // load-balancer | external-ip | node-port
  string kind = 3;
}

message VolumeClaim {
  string name = 1;
  string storage_class = 2;
  int64 requested_bytes = 3;
  repeated string access_modes = 4;
  // Bound | Pending | Lost
  string phase = 5;
  // Nodes the data can only be used from (a local volume's node affinity). Empty when the volume
  // is network-attached and can follow the pod.
  repeated string pinned_nodes = 6;
}

message Autoscaler {
  int32 min_replicas = 1;
  int32 max_replicas = 2;
  int32 current_replicas = 3;
  // Human-readable targets, e.g. "cpu 80%".
  repeated string targets = 4;
}

message Disruption {
  // IntOrString as written on the budget: "1" or "50%".
  string min_available = 1;
  string max_unavailable = 2;
  int32 disruptions_allowed = 3;
}

message ServerMessage {
  oneof msg {
    Ack ack = 1;
    Config config = 2;
    Revoked revoked = 3;
  }
}

message Ack {
  uint64 seq = 1;
}

message Config {
  // What the server accepts from this agent (0-4). Facts above it are dropped.
  uint32 approved_access_tier = 1;
  int32 heartbeat_seconds = 2;
  // Addresses the agent is asked to time a TCP connection to (never any data), how often (0 = do not
  // measure), and how often it re-sends its full picture so the server can check its own (0 = the
  // agent's default). The server may send a new Config at any time on the open stream.
  repeated ProbeTarget probe_targets = 3;
  int32 measure_seconds = 4;
  int32 resync_seconds = 5;
  // The server's clock (Unix seconds) when this was sent, so the agent can measure its own skew.
  int64 server_time_unix = 6;
  // Overrides the server may push to NARROW what the agent does, never to widen it: the agent applies one only
  // if it narrows what the chart's owner allowed, and reports what is actually in force in its Diagnostics.
  // Optional collectors to stop (any of "probes", "flow", "measure").
  repeated string paused_collectors = 7;
  // Namespaces to leave out in addition to the ones the agent's own scope already leaves out.
  repeated string excluded_namespaces = 8;
}

// An address to time. The agent only honours it when it was started with measurements allowed, and
// refuses loopback, link-local and multicast addresses whatever the server says.
message ProbeTarget {
  string id = 1;
  string host = 2;
  uint32 port = 3;
}

// The connect times of one round of samples to one target.
message PathResult {
  string target_id = 1;
  uint32 samples = 2;
  uint32 failed = 3;
  double rtt_min_ms = 4;
  double rtt_p50_ms = 5;
  double rtt_p95_ms = 6;
}

message Measurements {
  repeated PathResult results = 1;
  // How many targets the agent refused (blocked address, over the limit).
  uint32 refused = 2;
}

message Revoked {
  string reason = 1;
}

// ---------------------------------------------------------------------------
// Observed traffic (layer 4). Counts only: no payloads, no per-connection logs.
// ---------------------------------------------------------------------------

// One aggregated observation as the node flow collector reports it to the agent. The collector sees
// addresses only; the agent, which knows the cluster's pods and Services, turns them into workloads.
message RawFlow {
  // client=true: local_ip is the caller (a pod or the node), peer_ip is what it dialed (a Service
  // cluster IP, a pod, or anything outside), port is the port it dialed. client=false: local_ip is the
  // machine that accepted the connection, peer_ip is who connected, port is the listening port.
  bool client = 1;
  string local_ip = 2;
  string peer_ip = 3;
  uint32 port = 4;
  string protocol = 5; // tcp
  uint64 connections = 6;
  // Bytes sent by the caller and by the callee. Zero when bytes_known is false on the report.
  uint64 bytes_out = 7;
  uint64 bytes_in = 8;
  // The local machine's physical network interface this traffic actually routes over (e.g. "eth0",
  // "wlan0"), read from the kernel's own resolved route for the socket - not a guess from the address,
  // and never set for a socket the kernel has not (yet) routed. Empty means not known, not "none": a
  // multi-homed edge node's route can also change over a long-lived connection's life.
  string iface = 9;
  // TCP segments retransmitted since the previous report, from the kernel's own congestion-control
  // counter (struct tcp_sock.total_retrans) - never inferred from packet timing or loss heuristics of
  // our own. Always 0 on a conntrack-derived report, which has no socket to read this from.
  uint32 retransmits = 10;
  // The subset of retransmits (above) that the RTO timer itself fired for - no ACK at all came back
  // within a full round-trip-plus-backoff, as opposed to a fast retransmit triggered by duplicate ACKs
  // recovering from ordinary packet reordering without ever stalling the connection. From the kernel's
  // own inet_connection_sock.icsk_retransmits (flow.c's struct inet_connection_sock); see Flow's own copy
  // of this field for the reset-aware counting rule it needs (icsk_retransmits is not cumulative over
  // the socket's life the way total_retrans is). Always 0 on a conntrack-derived report.
  uint32 rto_retransmits = 27;
  // The most recently sampled smoothed round-trip time, in microseconds, from the kernel's own TCP RTT
  // estimator (struct tcp_sock.srtt_us). A gauge, not a sum: 0 means no sample yet (a connection that
  // exchanged too little to measure one, or a conntrack-derived report), not "no delay".
  uint32 rtt_us = 11;
  // Connection attempts to/from this same local/peer/port that never reached ESTABLISHED - counted on
  // this same row as any successful connections, since "mostly fine, a few refused" is one fact about
  // one edge. Always 0 on a conntrack-derived report, which has no socket state machine to watch. See
  // the broken-down reasons below; failed_attempts can exceed their sum when the kernel's reason did not
  // match one of them.
  uint64 failed_attempts = 12;
  uint64 failed_refused = 13;     // ECONNREFUSED
  uint64 failed_timeout = 14;     // ETIMEDOUT
  uint64 failed_reset = 15;       // ECONNRESET
  uint64 failed_unreachable = 16; // EHOSTUNREACH / ENETUNREACH
  // The server name from a TLS ClientHello observed on this exact connection (the SNI extension) - read
  // once, from the clear-text handshake, before anything is encrypted. Never a certificate, never
  // application data: this is the one hostname the client itself puts in plain text up front. Empty
  // unless the node collector's optional name-capture is turned on (off by default); one row can set
  // this or dns_query_name, never both, since a row is either a TCP row or a UDP one.
  string sni_host = 17;
  // The question name from a DNS query observed on this exact connection - the domain a workload asked
  // its resolver about, nothing about the answer (this program never reads one). Empty unless the same
  // optional name-capture is on.
  string dns_query_name = 18;
  // The RTT estimator's own mean-deviation sample, in microseconds (struct tcp_sock.mdev_us) - the
  // variance behind rtt_us above, reported as "jitter" since that's what mean deviation of RTT actually
  // is. A gauge, same 0-means-no-sample convention as rtt_us, read at the exact same moments.
  uint32 jitter_us = 19;
  // TCP segments sent since the previous report (struct tcp_sock.segs_out) - the denominator for a real
  // loss percentage, computed downstream from retransmits above (retransmits / segs_out); never computed
  // here, since dividing by a possibly-zero counter belongs next to where the zero case is handled, not
  // baked into the wire value. Always 0 on a conntrack-derived report, like retransmits/rtt_us.
  uint32 segs_out = 20;
  // How long this one connection took to go from its first SYN to ESTABLISHED, in microseconds - a gauge
  // set exactly once, the moment the socket reached ESTABLISHED; distinct from rtt_us, which is the
  // ongoing steady-state round trip sampled throughout the connection's life. 0 means no sample (the
  // connection was already established when this collector started watching, or this is a
  // conntrack-derived report), not "instant".
  uint32 handshake_us = 21;
  // The kernel's own congestion window right now, in segments (struct tcp_sock.snd_cwnd) - a gauge, same
  // 0-means-no-sample convention as rtt_us/jitter_us, read at the same moments. Always 0 on a
  // conntrack-derived report, which has no socket to read this from.
  uint32 cwnd = 22;
  // The pacing rate TCP's own congestion control last set for this socket, bytes/sec (struct
  // sock.sk_pacing_rate) - a gauge, same treatment as cwnd right above; 0 while no pacer is active yet
  // (e.g. a very young connection), not "idle".
  uint64 pacing_bps = 23;
  // Growth in this socket's own receive-side drops since the previous report (struct sock.sk_drops) -
  // summed like retransmits/segs_out, not a gauge. A different failure mode from retransmits: the local
  // application not draining its socket fast enough, not the network dropping a packet in transit.
  // Always 0 on a conntrack-derived report.
  uint32 buffer_drops = 24;
  // How long a DNS response took to arrive after its matching query, in microseconds - a gauge, matched
  // by transaction id + 5-tuple between a query seen on egress and its answer seen on ingress (see
  // flow.c's observe_egress/observe_ingress). Only ever set on the same synthetic, zero-count row
  // dns_query_name rides on (this program never tracks TCP-style per-socket state for DNS, which is
  // UDP), and only when the same optional name-capture opt-in is on. 0 means no sample, not "instant" -
  // most often because the response hasn't arrived yet, was lost, or arrived after this report's window
  // already closed.
  uint32 dns_rtt_us = 25;
  // Outbound SYNs observed leaving this exact local/peer/port without first being redirected to a local
  // mesh sidecar proxy - read straight off the wire (flow.c's observe_egress/note_mesh_bypass), never
  // inferred from configuration. Summed like retransmits/segs_out/buffer_drops, not a gauge. Always 0 on
  // a conntrack-derived report (which has no packet-level view at all) and, even on an eBPF report, only
  // ever non-zero when the node collector's optional name-capture is turned on (observe_egress is also
  // where sni_host/dns_query_name come from) - a non-zero count here does not by itself mean this
  // workload's mesh is misconfigured; it only means a packet escaped interception, which is entirely
  // expected for a workload that was never meshed in the first place. Cross-checking that against what
  // Kubernetes says this workload's mesh membership actually is happens downstream, in Go (the server's
  // applyMeshBypassFacts), never in this collector.
  uint32 mesh_bypass_syns = 26;
  // The kernel's own current effective segment size for this socket right now (struct
  // tcp_sock.mss_cache) - the actual usable payload size after PMTU discovery, which shrinks below the
  // interface MTU when the path crosses any encapsulation (VXLAN/WireGuard/GRE overlay tunnels add their
  // own headers). A gauge, same 0-means-no-sample convention as rtt_us/cwnd, read at the same moments.
  // Always 0 on a conntrack-derived report, which has no socket to read this from.
  uint32 mss_bytes = 28;
}

message FlowReport {
  // ebpf | conntrack: how these numbers were obtained, which decides how much to trust them.
  string method = 1;
  string node = 2;
  int32 window_seconds = 3;
  bool bytes_known = 4;
  // Observations the collector had to discard (map full, events lost).
  uint64 lost = 5;
  repeated RawFlow flows = 6;
}

message FlowEndpoint {
  enum Kind {
    UNRESOLVED = 0; // an address the agent could not place (a pod that no longer exists, for example)
    WORKLOAD = 1;   // ref is the workload key
    NODE = 2;       // ref is the node name; hostNetwork pods and node services land here
    EXTERNAL = 3;   // outside this cluster; ip is what was seen
  }
  Kind kind = 1;
  string ref = 2;
  string ip = 3;
}

message Flow {
  FlowEndpoint src = 1;
  FlowEndpoint dst = 2;
  uint32 port = 3;
  string protocol = 4;
  uint64 connections = 5;
  uint64 bytes_out = 6;
  uint64 bytes_in = 7;
  string method = 8;
  bool bytes_known = 9;
  // "" | dns | system: traffic that is machinery rather than the applications' own.
  string noise = 10;
  // The caller's physical network interface, when known - see RawFlow.iface. Descriptive only: never
  // part of an edge's identity, so a route flapping between interfaces does not fork one dependency
  // into two.
  string iface = 11;
  // Retransmitted segments observed in this report - see RawFlow.retransmits. Also descriptive only.
  uint64 retransmits = 12;
  // The most recently sampled smoothed RTT, in microseconds - see RawFlow.rtt_us. A gauge: the latest
  // sample, not a sum.
  uint32 rtt_us = 13;
  // Failed connection attempts observed in this report - see RawFlow.failed_attempts. Broken-down
  // reasons are not carried past RawFlow: by the time a raw observation becomes an attributed Flow, only
  // the total matters for dependency health, and the reasons stay in the FlowReport/RawFlow for anyone
  // who wants them at that layer.
  uint64 failed_attempts = 14;
  // See RawFlow.sni_host - carried through attribution unchanged.
  string sni_host = 15;
  // A raw observation is one captured query, so this is always empty or one element as it arrives from
  // RawFlow.dns_query_name; it is plural here because the Aggregator (see aggregate.go) merges several
  // of these, from several different reports in the same window, into one held Flow before it is ever
  // sent - and a single-valued field would force it to silently keep only the last and discard the rest.
  repeated string dns_query_names = 16;
  // The RTT estimator's mean-deviation sample, in microseconds - see RawFlow.jitter_us. A gauge, same
  // treatment as rtt_us right above it.
  uint32 jitter_us = 17;
  // Segments sent observed in this report - see RawFlow.segs_out. Carried through unchanged so a real
  // loss percentage (retransmits / segs_out) can be computed downstream, next to wherever the zero-segs
  // case is already handled, rather than baked into this wire value.
  uint32 segs_out = 18;
  // How long this connection took to go from its first SYN to ESTABLISHED - see RawFlow.handshake_us. A
  // gauge set once per connection; carried through attribution unchanged.
  uint32 handshake_us = 19;
  // The congestion window observed in this report - see RawFlow.cwnd. A gauge, same treatment as rtt_us.
  uint32 cwnd = 20;
  // The pacing rate observed in this report - see RawFlow.pacing_bps. A gauge, same treatment as rtt_us.
  uint64 pacing_bps = 21;
  // Receive-side buffer drops observed in this report - see RawFlow.buffer_drops. Carried through
  // unchanged so the Aggregator can sum it the same way segs_out is summed, not a gauge.
  uint32 buffer_drops = 22;
  // DNS response latency observed in this report - see RawFlow.dns_rtt_us. A gauge, same treatment as
  // rtt_us/jitter_us: the latest sample, carried through attribution unchanged.
  uint32 dns_rtt_us = 23;
  // The actual pod name behind Src, when Src is a WORKLOAD endpoint resolved from this agent's own
  // live collector.Index (not its post-eviction "recent" memory of a pod that has since churned) - see
  // attribution.go's Index.PodNames. Empty for a Service-resolved or node-resolved Src, for an EXTERNAL
  // Src, or whenever the owning pod is no longer live enough for the agent to be sure of its name.
  // Descriptive only, like iface/sni_host: never part of an edge's identity (flow.key in aggregate.go
  // deliberately excludes it, so distinct pods of the same workload keep collapsing into one dependency
  // edge) - this field only ever rides along on FlowBatch.pod_flows, a separate, unaccumulated, "right
  // now" breakdown by pod, never on the workload-level flows this message's identity is bounded by.
  string src_pod = 24;
  // The actual pod name behind Dst, under the same rule as src_pod above.
  string dst_pod = 25;
  // See RawFlow.mesh_bypass_syns - carried through attribution and the Aggregator's own summing
  // (mergeFlowCounters) exactly like retransmits/segs_out/buffer_drops.
  uint32 mesh_bypass_syns = 26;
  // See RawFlow.rto_retransmits - carried through attribution and the Aggregator's own summing
  // (mergeFlowCounters) exactly like retransmits/segs_out/buffer_drops. Also reset-aware the same way, on
  // this same field: RawFlow.rto_retransmits already turned the kernel's own resettable
  // icsk_retransmits into an ordinary non-negative delta before this ever saw it, so plain addition here
  // and all the way through FlowEdge is exactly as safe as it is for retransmits/segs_out.
  uint32 rto_retransmits = 27;
  // See RawFlow.mss_bytes - carried through attribution unchanged, like rtt_us/cwnd: a gauge, the latest
  // sample, not summed.
  uint32 mss_bytes = 28;
}

// What the agent sends up: everything seen in one window, already attributed inside the cluster.
// A node collector the agent has heard from lately: what the dashboard shows as "observer health".
message CollectorInfo {
  string node = 1;
  string method = 2;   // ebpf | conntrack
  bool bytes_known = 3;
}

message FlowBatch {
  uint64 seq = 1;
  int32 window_seconds = 2;
  uint64 lost = 3;
  repeated Flow flows = 4;
  // Every collector that reported in the last few windows, whether or not it saw any traffic. A batch
  // with no flows is still sent while collectors are present, so silence means "no collector", not "quiet".
  repeated CollectorInfo collectors = 5;
  // This window's traffic broken down by the specific pod on at least one side (src_pod and/or dst_pod
  // set) - see aggregate.go's separate, smaller podFlows table. Unlike flows above, the server never
  // accumulates this across batches: each batch's pod_flows wholesale-replaces what the server holds for
  // this agent, so it is always "what this pod is doing right now", not a running total. This is what the
  // topology view's per-pod breakdown (shown only when a specific pod is expanded) is drawn from, kept
  // separate from flows so that per-pod cardinality never touches the bounded, historically-accumulated
  // workload-level dependency graph.
  repeated Flow pod_flows = 6;
}

// What the server keeps per agent: totals per distinct edge.
message FlowEdge {
  Flow key = 1; // the identity of the edge (counters unused)
  google.protobuf.Timestamp first_seen = 2;
  google.protobuf.Timestamp last_seen = 3;
  uint64 connections = 4;
  uint64 bytes_out = 5;
  uint64 bytes_in = 6;
  // The most recent window, for a rate.
  int32 window_seconds = 7;
  uint64 window_connections = 8;
  uint64 window_bytes = 9;
  // Cumulative retransmitted segments over the life of this edge, summed the same way bytes/connections
  // are; 0 on an edge with no eBPF-observed report yet (conntrack cannot see this).
  uint64 retransmits = 10;
  uint64 window_retransmits = 11;
  // The latest smoothed-RTT sample lives on key.rtt_us, not here - a gauge is descriptive, not part of
  // the edge's running totals, the same treatment key.iface already gets.
  // Cumulative failed connection attempts over the life of this edge - see RawFlow.failed_attempts and
  // Flow.failed_attempts for what counts as one.
  uint64 failed_attempts = 12;
  uint64 window_failed_attempts = 13;
  // Distinct domain names this edge's traffic has asked its resolver to look up, newest first, capped
  // (see the server's own bound) - only ever set on the pod<->resolver edge itself (Key.Noise == "dns"),
  // accumulated across reports rather than replaced by each one, unlike every gauge field above: a
  // resolver edge legitimately fields many different domains over its life, and which ones is the whole
  // point of keeping this at all. The latest SNI hostname, by contrast, lives on Key.sni_host: one TCP
  // edge to one peer essentially always carries one hostname, so a gauge (latest sample) already fits it
  // the same way Key.iface and Key.rtt_us fit theirs.
  repeated string dns_query_names = 14;
  // Cumulative segments sent over the life of this edge, and in the most recent window - the denominator
  // for a real loss percentage (retransmits / segs_out), summed exactly the way retransmits/
  // window_retransmits are; 0 on an edge with no eBPF-observed report yet. jitter_us and handshake_us, by
  // contrast, live on key.jitter_us/key.handshake_us, not here - gauges, the same treatment key.rtt_us
  // already gets, not running totals.
  uint64 segs_out = 15;
  uint64 window_segs_out = 16;
  // Cumulative receive-side buffer drops over the life of this edge, and in the most recent window - see
  // RawFlow.buffer_drops; summed the same way retransmits/segs_out are. cwnd and pacing_bps, by contrast,
  // live on key.cwnd/key.pacing_bps, not here - gauges, the same treatment key.rtt_us already gets.
  uint64 buffer_drops = 17;
  uint64 window_buffer_drops = 18;
  // dns_rtt_us, like jitter_us/handshake_us/cwnd/pacing_bps, lives on key.dns_rtt_us, not here - a
  // gauge, not a running total, the same treatment every other per-sample figure on this edge gets.
  // Cumulative mesh-bypass SYNs over the life of this edge, and in the most recent window - see
  // RawFlow.mesh_bypass_syns; summed the same way retransmits/segs_out/buffer_drops are.
  uint64 mesh_bypass_syns = 19;
  uint64 window_mesh_bypass_syns = 20;
  // Cumulative RTO-timer-fired retransmits over the life of this edge, and in the most recent window -
  // see RawFlow.rto_retransmits/Flow.rto_retransmits; summed the same way retransmits/segs_out are.
  uint64 rto_retransmits = 21;
  uint64 window_rto_retransmits = 22;
}

message FlowTable {
  repeated FlowEdge edges = 1;
}

// ---------------------------------------------------------------------------
// Diagnostics: the agent's account of itself. It carries no cluster data: counts, names of Kubernetes kinds it
// reads, and plain-language problems.
// ---------------------------------------------------------------------------

message Diagnostics {
  string agent_version = 1;
  string arch = 2;
  string os = 3;
  int64 uptime_seconds = 4;
  // The ceiling the cluster's owner set (the chart's access.tier) and the tier actually collected now, which is
  // the lower of that and what the server approved.
  uint32 installed_tier = 5;
  uint32 effective_tier = 6;
  // What the server approved, as the agent last heard.
  uint32 approved_tier = 7;
  // The scope in force, as counts (the same summary ScopeFacts carries). Absent: every namespace.
  ScopeFacts scope = 8;
  repeated CollectorDiag collectors = 9;
  repeated InformerDiag informers = 10;
  repeated Problem problems = 11;
  // Overrides from the server that are in force right now.
  repeated string paused_collectors = 12;
  uint32 excluded_namespaces = 13;
  // Observations the traffic aggregator discarded because it was holding too many while disconnected.
  uint64 flow_dropped = 14;
  google.protobuf.Timestamp generated_at = 15;
  // Namespaces the agent's own install leaves out by name (count only; the names stay in the cluster).
  uint32 own_excluded_namespaces = 16;
  // Telemetry signals this install's chart enables (telemetry.*.enabled in the Helm values), by name: e.g.
  // "resourceUsage", "energy", "kubernetesState", "nodeRuntime", "networkLatency", "applicationMetrics",
  // "systemLogs", "kubernetesEvents", "applicationLogs", "traces". Purely informational, exactly like
  // installed_tier above: a Helm-values-only ceiling this server can never push or change, reported so the
  // UI can show what telemetry is actually installed without a live control-plane channel for it. Empty:
  // no telemetry signal is enabled, or an agent older than this field.
  repeated string installed_telemetry_signals = 17;
}

// One optional collector: the node probe receiver ("probes"), the flow pipeline ("flow") or connection timing
// ("measure").
message CollectorDiag {
  string name = 1;
  // This install switched it on (the pod's arguments).
  bool configured = 2;
  // It is running now: configured, allowed at the effective tier and not paused by the server.
  bool enabled = 3;
  bool paused_by_server = 4;
  // Data arrived from it recently.
  bool producing = 5;
  // Nodes (probes) or collectors (flow) that reported lately, out of how many are expected (0: not known).
  uint32 reporting = 6;
  uint32 expected = 7;
  string note = 8;
  google.protobuf.Timestamp last_data = 9;
}

// One informer (a watch on one kind of Kubernetes object).
message InformerDiag {
  string name = 1;
  bool synced = 2;
  string last_error = 3;
  int64 objects = 4;
  // Which module of the Discovery page it feeds.
  string module = 5;
}

message Problem {
  enum Severity {
    INFO = 0;
    WARN = 1;
    ERROR = 2;
  }
  // Stable identifier, e.g. rbac_forbidden. See internal/agent/DIAGNOSTICS.md for all of them.
  string code = 1;
  Severity severity = 2;
  // What is wrong, in plain words, and what to do about it.
  string message = 3;
  // Since when it has been the case.
  google.protobuf.Timestamp since = 4;
}
