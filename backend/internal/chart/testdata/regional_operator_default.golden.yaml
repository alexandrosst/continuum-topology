---
# Source: continuum-regional-operator/templates/serviceaccount.yaml
# This operator needs no Kubernetes API access of its own: it only relays and re-processes telemetry that
# already arrived over OTLP, it never watches this cluster's own object graph (there is no k8sattributes
# processor here, unlike continuum-agent's telemetry collectors - see values.yaml's own comment). No
# ClusterRole or ClusterRoleBinding is rendered by this chart at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: op-regional-operator
  namespace: default
  labels:
    app.kubernetes.io/name: continuum-regional-operator
    app.kubernetes.io/instance: op
    app.kubernetes.io/part-of: continuum
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: continuum-regional-operator-0.1.0
automountServiceAccountToken: false
---
# Source: continuum-regional-operator/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: op-regional-operator-config
  namespace: default
  labels:
    app.kubernetes.io/name: continuum-regional-operator
    app.kubernetes.io/instance: op
    app.kubernetes.io/part-of: continuum
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: continuum-regional-operator-0.1.0
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            # A sender with exporter keepalive pings an idle connection (telemetry.export.keepalive.time on the agent). The
            # server's default is one ping per 5 minutes and anything faster is answered with GOAWAY "too_many_pings"; this
            # accepts one every 30s, also with no call in flight, so keepalive set to 30s or more is never refused here.
            keepalive:
              enforcement_policy:
                min_time: 30s
                permit_without_stream: true
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      memory_limiter:
        check_interval: "1s"
        limit_percentage: 80
        spike_limit_percentage: 20
      
      
      redaction:
        allow_all_keys: true
        blocked_key_patterns: [".*token.*",".*password.*",".*secret.*",".*api[_-]?key.*",".*authorization.*",".*cookie.*"]
        summary: info
      
      batch:
        timeout: "5s"
        send_batch_size: 2048
        send_batch_max_size: 4096

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      
      

    exporters:
      otlp:
        endpoint: "collector.example:4317"
        tls:
          insecure: false
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: "30m"
        sending_queue:
          enabled: true
          queue_size: 256
          block_on_overflow: true
          batch:
            sizer: bytes
            min_size: 1
            max_size: 3145728
            flush_timeout: 1s

    service:
      extensions: ["health_check"]
      
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:POD_IP}
                    port: 8888
      pipelines:
        metrics:
          receivers: [otlp]
          processors: ["memory_limiter","redaction","batch"]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: ["memory_limiter","redaction","batch"]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: ["memory_limiter","redaction","batch"]
          exporters: [otlp]
---
# Source: continuum-regional-operator/templates/service.yaml
# So a source cluster's own telemetry.export.otlp.endpoint can point at this operator without knowing its
# pod IP - the same reason continuum-agent's cluster collector gets a Service.
apiVersion: v1
kind: Service
metadata:
  name: op-regional-operator
  namespace: default
  labels:
    app.kubernetes.io/name: continuum-regional-operator
    app.kubernetes.io/instance: op
    app.kubernetes.io/part-of: continuum
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: continuum-regional-operator-0.1.0
spec:
  selector: {app.kubernetes.io/name: continuum-regional-operator, app.kubernetes.io/instance: op}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
    - {name: metrics, port: 8888, targetPort: 8888, protocol: TCP}
---
# Source: continuum-regional-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-regional-operator
  namespace: default
  labels:
    app.kubernetes.io/name: continuum-regional-operator
    app.kubernetes.io/instance: op
    app.kubernetes.io/part-of: continuum
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: continuum-regional-operator-0.1.0
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: continuum-regional-operator, app.kubernetes.io/instance: op}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: continuum-regional-operator
        app.kubernetes.io/instance: op
        app.kubernetes.io/part-of: continuum
        app.kubernetes.io/component: receiver
        sidecar.istio.io/inject: "false"
        
      annotations:
        linkerd.io/inject: disabled
        checksum/config: 61d856018e1585804d8b6e3afd55b411fcf42e5e03ff64333510092d97cbe5b4
    spec:
      serviceAccountName: op-regional-operator
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Nothing here needs a fsGroup: every volume is a ConfigMap, a Secret (mode 0644) or an emptyDir (0777).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:0.160.0"
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/otel-collector-config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            
            
            # The pod's own address, which the self-metrics reader binds to (see operator.selfMetricsYAML).
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: GOMEMLIMIT
              value: "322122547"
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
            - {name: metrics, containerPort: 8888, protocol: TCP}
          # health_check always on (see config.yaml); liveness fails only once the collector itself has
          # stopped answering, readiness the same but checked more eagerly and recovers faster - neither
          # knows whether the export destination is reachable, only that this process is alive and its
          # pipelines started. The collector cannot tell the probe more (see operator.healthCheckExtensionYAML);
          # whether it is delivering is in its self metrics (port `metrics`): otelcol_exporter_queue_size,
          # otelcol_exporter_send_failed_* and otelcol_exporter_enqueue_failed_*.
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 96Mi
      volumes:
        - name: config
          configMap: {name: op-regional-operator-config}
      nodeSelector:
        {}
