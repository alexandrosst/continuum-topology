# Where the agent reports, and how it proves it's allowed to enroll. All from the "Connect a cluster" screen, which
# prints server.address on its own (worth seeing at a glance) and folds caPin + the one-time token together into
# enrollment.key below (one value instead of two, since both only matter for enrolling this one agent).
server:
  address: ""   # host:port the agent dials, e.g. continuum.example.com:8443
  caPin: ""     # sha256 fingerprint of the server's CA; the agent trusts nothing else and pins it on every connection,
                # not just the first. Leave unset if enrollment.key carries it instead.

# What the agent is allowed to read. The server can only ever approve up to this.
#   0  registered only: reads the kube-system namespace UID (the cluster's identity)
#   1  infrastructure:  + nodes, storage classes, ingress classes
#   2  services:        + namespaces, workloads, pods, services, ingresses
# Every tier is read-only. The agent never gets access to Secrets or ConfigMaps.
access:
  tier: 2
  # Reads the "kubernetes" Service's Endpoints in "default" (a fixed, reserved name every cluster carries)
  # to report the API server's real backend address instead of the virtual ClusterIP every in-cluster client
  # is handed by default. One named resource, read-only, in one fixed namespace unrelated to rbac.mode -
  # reveals nothing an operator could not already see with `kubectl get endpoints kubernetes`. On by
  # default; off falls back to the ClusterIP address, same as before this existed.
  resolveApiEndpoint: true

# How tier 2's per-namespace resources (pods, services, workloads, ingresses, ...) are granted:
#   cluster (default)  one ClusterRole, cluster-wide read access. A namespace created after install is covered with
#                       no further action, and scope.selector / scope.exclude both work as documented.
#   namespaced          a Role + RoleBinding in each of scope.namespaces instead. The real trade-offs, not a strict
#                       upgrade: scope.namespaces must be set (an explicit list; scope.selector cannot work here,
#                       since evaluating a label selector needs to list namespaces cluster-wide); a namespace added
#                       later needs `helm upgrade` to be covered, there is no way around that; and Namespace and
#                       PersistentVolume objects are not read at all in this mode (both are cluster-scoped types, so
#                       no Role can name them) — namespace metadata (labels, creation time) is unavailable, and
#                       volumes are not shown, only claims. Tier 1 (nodes, storage classes, ingress classes) is
#                       always a ClusterRole in either mode: those are cluster-scoped types with no namespaced form.
#                       Needed on a platform that forbids ClusterRole for tenants altogether (a multi-tenant cluster
#                       or a vcluster), and worth choosing anywhere the narrower blast radius matters more than the
#                       convenience of new namespaces being covered automatically.
rbac:
  mode: cluster

enrollment:
  # One-time token, valid for one hour. Only used on first start; afterwards it does nothing,
  # so you may remove it with `helm upgrade --reuse-values --set enrollment.token=`.
  # Ignored where enrollment.key below is set (its second half is the token).
  token: ""
  # The install command's one convenience flag: server.caPin and enrollment.token above, joined as "<caPin>.<token>".
  # Splitting it back into those two values happens once, when this chart renders - nothing downstream (the agent
  # binary, the running Deployment) ever sees "enrollment.key" itself, so this is purely how the command you paste
  # stays short, not a new thing the agent has to understand. server.caPin / enrollment.token set directly always win
  # over this if both are given. Unlike enrollment.token, don't blank this later to "clean up" the spent token: the
  # CA pin lives in the same value, and the agent needs that on every restart, not just the first. It is harmless to
  # leave in place indefinitely - the token half is already spent and does nothing.
  key: ""

# Which namespaces the agent reports on. Everything empty means all of them (the default). Anything outside the scope is
# dropped inside the cluster: its workloads, services and traffic are never sent, and the server is told only how many
# namespaces were left out. The cluster's system namespaces are always read (that is how the CNI and ingress controller are
# recognised) and never shown as applications. A namespace can also opt itself out with the label continuum.io/observe=false.
# Narrowing the scope does not narrow the agent's permissions in rbac.mode=cluster (the default): it still holds the
# tier's cluster-wide read access. In rbac.mode=namespaced, namespaces IS the agent's permissions (see rbac.mode
# above) — the two are no longer independent there, and exclude/selector still only filter what an already-granted
# namespace reports, they never grant a namespace RBAC did not already name.
scope:
  namespaces: []   # report only these, e.g. [shop, payments]; rbac.mode=namespaced requires this to be set
  exclude: []      # never report these
  selector: ""     # report only namespaces with this label, e.g. "continuum.io/observe=true" (labels the agent keeps: continuum.io/*, app.kubernetes.io/*, ...); incompatible with rbac.mode=namespaced

# Service mesh (Istio, Linkerd): the agent recognises a mesh from labels, annotations and container names alone. For Istio it can
# also read PeerAuthentication objects, to say whether mutual TLS is required; that is one extra read-only permission.
mesh:
  readPolicy: true

# Secrets (in the release namespace) that let the cluster pull the image from a private registry, e.g.
#   kubectl -n continuum-system create secret docker-registry regcred --docker-server=ghcr.io --docker-username=... --docker-password=...
#   helm install ... --set 'imagePullSecrets[0].name=regcred'
imagePullSecrets: []

# ONE image runs all three roles: the agent (Deployment), the optional node probe and the optional flow collector
# (DaemonSets) are the same binary with a different first argument (`agent`, `probe`, `flow`), chosen by the pod spec's
# `args:`. There is nothing else to pull.
#   tag:    defaults to the chart's appVersion.
#   digest: when set (sha256:...), the pods pull repository@digest and the tag is ignored. A tag can be moved to another
#           image after the fact; a digest cannot. scripts/publish.sh prints the digest of what it pushed.
image:
  repository: continuum/continuum
  tag: ""
  digest: ""
  # Explicit value always wins; left empty, resolves to Always for the moving `edge` tag and IfNotPresent
  # otherwise, so a node that already cached something named edge still gets today's build instead of
  # silently running stale code.
  pullPolicy: ""

# Go runtime tuning. Measured on a 400-workload cluster: about 80 MB of memory untuned, about 60 MB with these values.
tuning:
  goMemLimit: 64MiB
  goGC: "50"

resources:
  requests: {cpu: 20m, memory: 48Mi}
  limits: {memory: 192Mi}

# Where the agent's pod may run. It is a single ordinary pod; these are the usual Kubernetes scheduling knobs.
# The default keeps Continuum's pods off Windows nodes (the image is Linux only). Your own entries are merged with it;
# to drop it, set `--set 'nodeSelector.kubernetes\.io/os=null'`.
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
podAnnotations: {}
# Extra labels for every pod this chart creates (agent, probe, flow). The labels the chart uses itself
# (app.kubernetes.io/*, helm.sh/*) cannot be overridden.
podLabels: {}
# Set to a PriorityClass to keep these pods from being evicted first under node pressure (agent, probe, flow).
priorityClassName: ""

# Extra environment variables for the AGENT container only, in the usual Kubernetes form, e.g.
#   extraEnv:
#     - {name: GODEBUG, value: "madvdontneed=1"}
extraEnv: []

# Outbound proxy for the AGENT, for clusters that reach the Internet (or your Continuum server) only through one.
# The agent's connection to the server is gRPC over mutual TLS. grpc-go honours the standard proxy variables: it asks the
# proxy for an HTTP CONNECT tunnel to the server and speaks TLS through it, so the proxy sees only the server's address,
# never the content, and never terminates TLS (a proxy that tries to would be refused: the agent trusts only the server's
# own CA, by the pin). Only httpsProxy is used for that connection (grpc-go asks for an https target). The Kubernetes API
# client in the same process reads the same variables, so noProxy MUST cover the cluster's API server, or the agent's
# cluster reads are sent to the proxy too. The chart always adds localhost, 127.0.0.1, .svc and .cluster.local; add the
# API server's address (the `kubernetes` Service's cluster IP, e.g. 10.43.0.1 on k3s, 10.96.0.1 on kubeadm, and your
# control-plane node addresses), and your pod and service CIDRs, in noProxy. Empty (the default): no proxy is used.
# Not applied to the probe and flow pods: they talk only to the agent inside the cluster.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

# Health endpoint of the agent, on this pod-network port, for the Kubernetes probes:
#   /healthz  liveness:  fails only if the agent's own main loop has stopped turning for 5 minutes (a wedged process).
#             An unreachable server, a pending approval or a revoked agent never fail it: a restart would fix none of them.
#   /readyz   readiness: true while waiting for approval (normal), while connected, and for 10 minutes after the
#             connection drops; false before the first contact with the server, after 10 minutes offline, and once revoked.
#             Readiness also decides whether the probe/flow receiver Service has this pod behind it.
# The endpoints answer with a short state word and nothing about the cluster.
health:
  enabled: true
  port: 8082

# Network policies. Both need a CNI that enforces NetworkPolicy (a cluster without one ignores them silently).
networkPolicy:
  # Egress: restrict what the AGENT pod may connect to. Off by default, because the right answer depends on your CNI and
  # your network, and a wrong egress policy silently cuts the agent off. When enabled the agent may reach ONLY:
  #   - DNS: the cluster DNS pods in kube-system (k8s-app=kube-dns), plus dnsCIDRs if you use a node-local DNS cache
  #   - the Kubernetes API server: apiServerCIDRs on apiServerPorts
  #   - the Continuum server: serverCIDRs on the port of server.address
  #   - anything you list in extraEgress (raw NetworkPolicy egress rules; e.g. the addresses connection timing
  #     may reach, if measurements.enabled)
  # apiServerCIDRs and serverCIDRs are required (a NetworkPolicy cannot match a host name). For the API server list the
  # `kubernetes` Service's cluster IP AND the control-plane node addresses behind it, because most CNIs evaluate the policy
  # after the Service address has been translated:  kubectl get endpoints kubernetes -n default
  egress:
    enabled: false
    apiServerCIDRs: []      # e.g. ["10.43.0.1/32", "192.168.1.10/32"]
    apiServerPorts: [443, 6443]
    serverCIDRs: []         # e.g. ["203.0.113.7/32"]: where server.address resolves to
    dnsCIDRs: []            # e.g. ["169.254.20.10/32"] for NodeLocal DNSCache
    extraEgress: []
  # Egress lockdown for the telemetry workloads (host/cluster collectors, Kepler, and the accelerators
  # DaemonSet when enabled) - separate from egress above, which only ever covers the agent pod (different
  # labels, and a fixed CIDR list set once for the whole cluster, unlike a telemetry export destination
  # which is whatever the operator configured under telemetry.export.otlp.endpoint). Off by default, same
  # reasoning as egress above.
  telemetryEgress:
    enabled: false
    allowedEgress: []   # e.g. [{cidr: "203.0.113.7/32", ports: [4317, 443]}] - your telemetry.export.otlp.endpoint's destination(s)
    dnsCIDRs: []
    extraEgress: []

# Optional node probe: a tiny read-only DaemonSet that tells the agent what kind of machine each node
# really is (virtual machine or bare metal, the hypervisor, the board model, how it connects). The
# Kubernetes API cannot say this; without the probe Continuum can only guess and marks the guess as
# low confidence. Off by default: it is the only part of Continuum that runs on every node.
#
# What it reads: CPU flags, DMI vendor/product strings, the device-tree model, which kinds of network
# interface are up, whether a battery exists. Never serial numbers, MAC addresses, disks or processes.
# `probe --print` shows exactly that. It reports only to the agent, over the cluster network, signed with
# a secret this chart generates. It has no Kubernetes API access and no capabilities.
nodeProbe:
  enabled: false
  # Mount the host's /sys read-only (a hostPath). This gives the board model of ARM devices and the
  # real network interfaces. Namespaces that enforce the Pod Security "baseline" or "restricted"
  # profile refuse hostPath volumes: label the namespace privileged, or set this to false and the
  # probe still tells VMs from bare metal (from DMI and CPU flags) but sees no device tree or uplinks.
  hostSys: true
  # Run in the host's network namespace. Needed for TunnelInterface/host_subnets: the netlink dump
  # that finds them is scoped to the reading process's own network namespace, so without this the
  # probe only ever sees its own pod's veth and loopback - never a physical uplink or an overlay/VPN
  # tunnel (WireGuard, Netbird, Tailscale, ...) actually up on the machine - and silently reports zero
  # tunnels everywhere, on every node, regardless of what is really running. Same trade-off as hostSys
  # just above: a namespace enforcing the Pod Security "baseline" or "restricted" profile refuses
  # hostNetwork too - label the namespace privileged, or set this to false and the probe still reports
  # everything else (CPU, DMI, virtualization) unaffected, since those come from /proc and hostSys's
  # own mount, neither of which this namespacing applies to.
  hostNetwork: true
  interval: 3m
  # Leave empty to generate one on first install and keep it across upgrades.
  secret: ""
  # Runs the same image as the agent, with the argument `probe` (see `image` above).
  # Only the probe's own pods may reach the agent's receiver port. Needs a CNI that enforces NetworkPolicy.
  networkPolicy: true
  resources:
    requests: {cpu: 5m, memory: 12Mi}
    limits: {memory: 32Mi}
  # Run on every Linux node, including tainted control-plane and edge nodes.
  tolerations:
    - operator: Exists
  nodeSelector:
    kubernetes.io/os: linux

# Optional path measurements: lets the agent time TCP connections (connect time only, no data is sent)
# to the addresses the server names, to learn how far away the other places are. The server only names
# addresses your workloads already call, or ones an administrator adds; loopback, link-local and cloud
# metadata addresses are always refused. Off by default: otherwise the agent opens no connection that
# the cluster did not already make itself.
measurements:
  enabled: false

# Optional traffic observer: counts which workloads talk to which, and how much, on every node.
# It counts TCP connections and bytes per pair of addresses. By default it never reads packets or
# payloads; flowObserver.names.enabled below is a separate, off-by-default opt-in that additionally
# captures the one hostname a DNS query or a TLS ClientHello carries in the clear - see its own comment.
# Method: eBPF where the kernel supports it (5.10+ with BTF), the kernel's connection-tracking table
# otherwise (bytes only if net.netfilter.nf_conntrack_acct=1). The dashboard shows which one each
# edge came from.
flowObserver:
  enabled: false
  # auto | ebpf | conntrack. auto tries eBPF and falls back to conntrack; forcing a method that the
  # node cannot run leaves that node unobserved instead of silently using another one.
  method: auto
  interval: 30s
  # Count the bytes of connections while they are open (eBPF only), so a database connection that lives
  # for weeks shows its traffic now and not when it finally closes. This runs the collector in the
  # host's PID namespace (hostPID), which the kernel needs in order to walk other pods' sockets. Set false
  # to keep the pod out of the host's PID namespace; bytes then arrive when connections close.
  liveBytes: true
  # Off by default. When enabled, the collector also reads just enough of a DNS query or a TLS
  # ClientHello to pull out the one hostname each carries in the clear before anything is encrypted -
  # the domain name being resolved, or the server name (SNI) being connected to - and discards the rest
  # of the packet immediately; it never inspects any other part of the traffic's content. This needs
  # CAP_NET_ADMIN in addition to BPF/PERFMON/SYS_RESOURCE, to attach the cgroup/skb program that reads
  # them (added to the pod's capabilities automatically when this is on - nothing to set separately).
  names:
    enabled: false
  # Leave empty to generate one on first install and keep it across upgrades. Separate from the probe's.
  secret: ""
  # Runs the same image as the agent, with the argument `flow` (see `image` above). It is the one part of Continuum that runs
  # as root (runAsUser: 0, set in the pod spec, not in the image): loading the eBPF program needs it.
  #
  # Receiver policy. Collectors run in the host network, so the agent sees them arriving from an address of the NODE
  # (which one depends on the CNI: on k3s/flannel, for example, traffic from a host process to a pod on the same node
  # comes from the node's pod-network gateway address, and to a pod on another node from the tunnel address, not from the
  # node's InternalIP). No default is both restrictive and safe, so this is OFF by default: the receiver port then accepts
  # connections from anywhere the network lets through, and every report is still signed with the flow secret. To restrict it,
  # set networkPolicy=true and list in nodeCIDRs every address the agent sees them from (check `kubectl -n <ns> logs`
  # of the agent after a first report, or your CNI's docs); an incomplete list silently drops reports from those nodes.
  # The probe's receiver rule (pods only, by label) is independent of this and stays on.
  networkPolicy: false
  nodeCIDRs: []
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}
  tolerations:
    - operator: Exists
  nodeSelector:
    kubernetes.io/os: linux

# Telemetry: what to actually collect and export as metrics, logs and traces, on top of the topology
# discovery above. Off by default, signal by signal. Every enabled signal is normalized to OpenTelemetry
# the moment it is collected: one embedded OpenTelemetry Collector (the Contrib distribution) receives
# from whichever sources are turned on below and forwards them, as OTLP, to telemetry.export - your own
# backend, not this server. Continuum does not ingest or store telemetry itself yet; this chart only
# collects it and hands it off in a standard, vendor-neutral shape.
#
# Each signal below names:
#   domain     application and/or infrastructure - what is being observed. Informational: the server's UI
#              uses it to group signals, it has no effect on what this chart deploys.
#   modality   metrics, logs, or traces - fixed per signal, not a choice.
#   source     off | builtin | existing | bundle-<tool>
#     off       not collected. The default for every signal.
#     builtin   this chart's own OpenTelemetry Collector receiver for the signal - preferred wherever one
#               exists (hostmetrics, kubeletstats, k8scluster, k8sobjects, filelog, otlp). No pods beyond
#               the collector itself.
#     existing  you already run something that produces this signal; the collector is pointed at it
#               instead of anything this chart would otherwise deploy (a Prometheus scrape target for a
#               metric, or this collector's own OTLP receiver for anything that already pushes OTLP).
#     bundle-*  deploy a specific well-known third-party tool alongside the collector, for the one signal
#               that has no OpenTelemetry-native receiver at all. Only energy needs this today (bundle-kepler).
telemetry:
  # The collector this chart deploys is the upstream OpenTelemetry Collector Contrib distribution, not the
  # Continuum image - it needs the community's receivers (hostmetrics, kubeletstats, k8scluster, k8sobjects,
  # filelog) that only that distribution ships. Pin collectorImage.digest the same way image.digest works
  # above, once you have picked a version to trust.
  collectorImage:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.160.0"
    digest: ""
    pullPolicy: ""

  # Where the collector sends everything it receives, regardless of signal. Required if any signal below
  # is enabled.
  export:
    otlp:
      endpoint: ""    # host:port of your OTLP receiver, e.g. an existing collector gateway or observability backend
      protocol: grpc  # grpc | http
      tls:
        insecure: false
        caFile: ""    # path to a CA bundle to mount and trust, if your endpoint's certificate isn't otherwise trusted
        # Present a client certificate on top of (or instead of) caFile above - e.g. when your destination
        # is a Continuum regional operator with receiver.tls.mtls on. Off by default in this file, but a
        # regional operator's own "point this cluster at me" reminder always sets this on with the
        # certificate it minted for exactly this purpose (see CreateOperator/IssueOperatorClientTLS) - this
        # default only matters if you hand-edit these values or mint your own certificate some other way.
        mtls:
          enabled: false
          secretName: ""   # a Secret in this release's namespace, created outside this chart, holding
                            # tls.crt, tls.key (this cluster's client certificate) and ca.crt (to verify
                            # the destination's own server certificate - takes priority over caFile above)
      # A single credential header, for backends that require one - never put its value directly in
      # values.yaml (it would render into a ConfigMap in plain text, and land in `helm get values`/git diff).
      # Instead point at a Secret you create yourself, in this release's namespace, holding just that value.
      # Leave secretName empty for a backend that needs no auth header at all.
      auth:
        headerName: Authorization   # e.g. Authorization, or X-Api-Key for a backend that expects that instead
        secretName: ""              # a Secret in this release's namespace, created outside this chart
        secretKey: token            # the key within that Secret holding the header's value, e.g. "Bearer ..."

  # Processor-level controls applied to the OTel Collector pipelines themselves, independent of which
  # signals above are enabled. memory_limiter is always rendered (baseline collector hygiene, not a
  # toggle); the rest are opt-in/opt-out as documented per field.
  processors:
    # Always on, first in every pipeline: protects the collector itself from an OOM kill when receivers
    # get more data than expected (a misbehaving app, a burst of events). Paired with a computed
    # GOMEMLIMIT env var (~80% of each collector container's own memory limit) so Go's own GC also backs
    # off before the container's hard limit is hit - see the memory_limiter processor's own README for why
    # both matter together.
    memoryLimiter:
      checkInterval: 1s
      limitPercentage: 80
      spikeLimitPercentage: 20
    # Off by default: enriches every signal with resource attributes about the environment the collector
    # itself runs in. Cloud-provider detectors (ec2/gcp/azure, ...) are NOT in the default list below -
    # they make real network calls to cloud metadata endpoints, which a locked-down
    # networkPolicy.telemetryEgress below would need to separately allow. Add them yourself if you need
    # them.
    resourceDetection:
      enabled: false
      detectors: [env, system]
      timeout: 5s
    # On by default: the one processor this chart turns on without being asked, because telemetry.receiver
    # below has no auth on by default either - anything that can reach this collector's OTLP receiver can
    # push attributes that end up in your telemetry backend. allow_all_keys: true means this is a
    # deny-list, not an allow-list - it MASKS the VALUES of keys matching blockedKeyPatterns and leaves
    # every other attribute completely untouched. The alternative, allow_all_keys: false with an empty
    # allowed_keys list, would instead silently DROP every attribute - deliberately not used here.
    redaction:
      enabled: true
      blockedKeyPatterns:
        - ".*token.*"
        - ".*password.*"
        - ".*secret.*"
        - ".*api[_-]?key.*"
        - ".*authorization.*"
        - ".*cookie.*"
    # Traces only. 100 (default) means no sampling - every span is kept, exactly today's behavior. Lower
    # it to cut trace volume/cost; the processor is omitted from the pipeline entirely at 100 rather than
    # rendering a no-op hop.
    tracesSampling:
      percentage: 100
    # Escape hatch for anything not covered above (attributes, transform, a custom filter, ...): raw
    # processor definitions merged into the collector config's top-level "processors" map, and the names
    # to actually reference (in this order) in every pipeline, right after redaction and before batch.
    # Same "give the chart raw YAML for this one case" pattern as networkPolicy.egress.extraEgress above.
    extraProcessors: {}
    extraProcessorNames: []
    # Traces-only extras (tail_sampling, or anything else that only implements the traces processor
    # interface) - kept separate from extraProcessorNames above because the OTel Collector refuses to
    # start if a traces-only processor (tail_sampling is the common one) is referenced from a metrics or
    # logs pipeline, and extraProcessorNames is inserted into every pipeline uniformly. Appended after
    # extraProcessorNames, still before batch, in the traces pipeline only (there is no traces pipeline in
    # the host collector, so this has nothing to do there).
    extraTracesProcessorNames: []

  # The inbound side: hardening for the OTLP receiver applications/other collectors push to (cluster
  # collector only - see telemetry-cluster-config.yaml; the host collector has no OTLP receiver of its
  # own). Both off by default: turning either on is new capability, not a change to any existing install's
  # behavior. Leaving both off means this receiver is unauthenticated and reachable from anywhere in the
  # cluster that can route to it - acceptable inside a single trusted namespace/team, a real gap in a
  # shared or multi-tenant cluster. telemetry.processors.redaction above is the complementary "don't trust
  # what arrives" mitigation and stays on regardless of what's configured here.
  receiver:
    auth:
      enabled: false
      secretName: ""   # a Secret in this release's namespace, created outside this chart, holding a
                        # shared bearer token every OTLP client must present in its Authorization header
      secretKey: token
    networkPolicy:
      enabled: false
      # Raw NetworkPolicy ingress "from" peer entries (namespaceSelector / podSelector / ipBlock) - the
      # same shape Kubernetes' own NetworkPolicy spec.ingress[].from uses, and the same "give the chart raw
      # YAML for this one case" pattern as networkPolicy.egress.extraEgress above.
      allowedIngress: []

  # domain: infrastructure (node-level) + application (container/pod-level)
  resourceUsage:
    metrics:
      enabled: false
      source: builtin   # builtin -> hostmetricsreceiver (node CPU/memory/filesystem/network) plus
                         #            kubeletstatsreceiver (per-container/pod CPU/memory from the kubelet)
      interval: 30s

  # domain: infrastructure
  energy:
    metrics:
      enabled: false
      source: bundle-kepler   # bundle-kepler (deploy Kepler, scoped read-only, scraped by this collector) | existing
      existing:
        prometheusEndpoint: ""   # required when source=existing: host:port/path already serving kepler-shaped metrics
      # Only used when source=bundle-kepler. Kepler needs to read RAPL energy counters and, on most
      # kernels, load an eBPF program to attribute power to individual pods - real host access this chart
      # cannot avoid by construction, the same trade-off flowObserver documents above for its own eBPF use.
      # It runs privileged, one pod per node, and only Prometheus-scrapes to this collector; nothing else in
      # this chart runs privileged. Left disabled unless bundle-kepler is actually selected.
      keplerImage:
        repository: quay.io/sustainable_computing_io/kepler
        tag: "release-0.7.12"
        digest: ""
        pullPolicy: ""
      # Scheduling overrides for the Kepler DaemonSet specifically (it needs its own: privileged and
      # hostPID, most clusters want it kept off tainted/GPU pools deliberately, unlike the host collector
      # below which usually should run everywhere). Defaults reproduce this chart's original hardcoded
      # behavior (every Linux node) plus one addition: kubernetes.io/arch=amd64, because the upstream
      # Kepler image (quay.io/sustainable_computing_io/kepler) publishes no arm64 build as of the tag
      # pinned above - without this, Kepler pods on an arm64 node (Graviton, Ampere, most edge/Arm SBCs)
      # would crash-loop on ImagePullBackOff forever instead of simply not being scheduled there. Remove
      # this line if you build or source your own arm64-capable Kepler image.
      tolerations:
        - operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      # Falls back to telemetry.resources below when left empty - override only if Kepler's actual profile
      # (one small privileged pod per node) needs something different from the shared default.
      resources: {}

  # domain: infrastructure. GPU/accelerator metrics (utilization, memory, temperature, power) via
  # NVIDIA's DCGM exporter - the standard, and currently the only practical, path into an OTel Collector
  # pipeline for this data (no purpose-built OTel-native GPU receiver exists upstream as of this chart's
  # pinned collectorImage). Scraped by the cluster collector exactly like energy/Kepler above, not RBAC-
  # gated: like Kepler, dcgm-exporter reads GPU hardware directly and needs zero Kubernetes API access.
  accelerators:
    metrics:
      enabled: false
      source: bundle-dcgm   # bundle-dcgm (deploy dcgm-exporter, scraped by this collector) | existing
      existing:
        prometheusEndpoint: ""   # required when source=existing: host:port/path already serving dcgm-shaped metrics
      interval: 30s
      # Off by default, preserving every existing install's behavior exactly. When true (and source is still
      # bundle-dcgm), enables dcgm-exporter's own Kubernetes pod-label enrichment (DCGM_EXPORTER_KUBERNETES +
      # DCGM_EXPORTER_KUBERNETES_ENABLE_POD_LABELS - no new mount needed, the pod-resources socket below is
      # already there) and lets the shared telemetry.scope below actually reach GPU metrics: without this,
      # accelerators is domain: infrastructure for RBAC/deployment-shape reasons but its data can carry
      # namespace/workload identity, and today that identity is invisible to this collector - turning this on
      # is the opt-in fix, not a default, because it's new capability (and a small resource-label overhead on
      # dcgm-exporter itself), not a correction to existing behavior.
      applyScope: false
      # Only used when source=bundle-dcgm. Needs an NVIDIA driver and the NVIDIA Container Toolkit on the
      # node already (a prerequisite this chart cannot install), runAsUser: 0 plus the SYS_ADMIN capability
      # (narrower than Kepler's full privileged: true above - dcgm-exporter's own documented requirement),
      # and a read-only mount of the kubelet's pod-resources socket to map GPUs to the pods using them.
      # Left disabled unless bundle-dcgm is actually selected, and only worth enabling on GPU node pools -
      # see tolerations/nodeSelector below.
      dcgmImage:
        repository: nvcr.io/nvidia/k8s/dcgm-exporter
        tag: "4.6.0-4.8.3"
        digest: ""
        pullPolicy: ""
      # Scheduling overrides for the dcgm-exporter DaemonSet specifically, mirroring energy.metrics above:
      # defaults keep it off every node (nvidia.com/gpu.present is the standard label GPU device plugins
      # set), since running it on non-GPU nodes would just fail to find a GPU. Point this at however your
      # cluster actually labels/taints GPU nodes if that differs.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Falls back to telemetry.resources below when left empty - override only if dcgm-exporter's actual
      # profile needs something different from the shared default.
      resources: {}

  # domain: infrastructure
  kubernetesState:
    metrics:
      enabled: false
      source: builtin   # builtin -> k8sclusterreceiver (pod/deployment/replica status and counts, cluster-wide)

  # domain: infrastructure
  nodeRuntime:
    metrics:
      enabled: false
      source: builtin   # builtin -> kubeletstatsreceiver (pod lifecycle and volume metrics from the kubelet)
      # Its own cadence, independent of resourceUsage.metrics.interval above: nodeRuntime can be enabled on
      # its own (resourceUsage off), and previously silently inherited resourceUsage's interval even then -
      # now it always has one. When resourceUsage is also on, both signals still share one kubeletstats
      # receiver instance and resourceUsage.metrics.interval wins for that receiver's actual scrape cadence
      # (see telemetry-host-config.yaml); this field only governs the case where nodeRuntime is the sole
      # reason kubeletstats is running.
      interval: 30s

  # domain: infrastructure
  networkLatency:
    metrics:
      enabled: false
      source: builtin   # builtin -> re-emits this agent's own path measurements (see "measurements" above) as OTel
                         # metrics instead of, or in addition to, reporting them to the server as topology data.
                         # Requires measurements.enabled: true; turning this on without that reports nothing.

  # domain: application
  applicationMetrics:
    metrics:
      enabled: false
      source: builtin   # builtin -> an OTLP receiver (apps push to it directly, the standard OpenTelemetry SDK
                         # pattern) plus a Prometheus receiver scraping the targets listed below
      scrapeTargets: []  # [{jobName: "", namespace: "", podLabelSelector: "", port: 0, path: /metrics}]
      # Per-signal override of the shared telemetry.scope below. Each field falls back to telemetry.scope's
      # own field independently when left empty here - same fallback idiom as hostCollector.resources below
      # falling back to telemetry.resources. Set this only if application metrics need a different namespace
      # scope than logs/traces; otherwise leave both empty and keep using the one shared scope.
      scope:
        namespaces: []
        exclude: []

  # domain: infrastructure. "systemLogs" means the node's own operating system and container runtime, never
  # application output (see applicationLogs below for that).
  systemLogs:
    logs:
      enabled: false
      source: builtin
      journaling: journald  # journald | none - how the node OS itself logs. Kubelet's own container log
                             # directory (where every distro's container stdout/stderr actually lands) is
                             # always read when this signal is enabled, regardless of this setting; this only
                             # controls whether the systemd journal is additionally read, since not every
                             # distribution runs one (journald fails closed with a clear error on a node that
                             # has no journal, rather than silently reading nothing).

  # domain: infrastructure
  kubernetesEvents:
    logs:
      enabled: false
      source: builtin   # builtin -> k8sobjectsreceiver watching Events cluster-wide

  # domain: application
  applicationLogs:
    logs:
      enabled: false
      source: builtin   # builtin -> the same OTLP receiver as applicationMetrics (apps push logs directly)
      # Per-signal override of the shared telemetry.scope below - see applicationMetrics.metrics.scope above
      # for the exact fallback rule.
      scope:
        namespaces: []
        exclude: []

  # domain: application
  traces:
    traces:
      enabled: false
      source: builtin   # builtin -> the same OTLP receiver again; there is no scrape-based source for traces
      # Per-signal override of the shared telemetry.scope below - see applicationMetrics.metrics.scope above
      # for the exact fallback rule.
      scope:
        namespaces: []
        exclude: []

  # Which namespaces application-scoped signals (applicationMetrics, applicationLogs, traces) are collected
  # from. Reuses the same shape as "scope" above rather than inventing new vocabulary; empty means every
  # namespace already covered by "scope" above. Has no effect on infrastructure-scoped signals (resourceUsage,
  # energy, kubernetesState, nodeRuntime, systemLogs, kubernetesEvents), which are node- or cluster-wide by
  # nature and always unfiltered by this.
  #   - namespaces: keep only these (drop everything else app-scoped)
  #   - exclude: drop these specifically (keep everything else app-scoped)
  #   - selector is NOT implemented: filtering already-received telemetry by an arbitrary Kubernetes label
  #     selector isn't something the collector can do cleanly after the fact (it only has the resource
  #     attributes k8sattributes extracted, not a live label-selector evaluation against the API) - setting
  #     it fails the release rather than being silently ignored. Use namespaces/exclude instead.
  #   - networkLatency shares its OTLP receiver with applicationMetrics/traces (see telemetry-cluster-
  #     config.yaml), but is structurally exempt from this filter (and any per-signal override above): the
  #     collector config carries a standing condition excluding resource.attributes["service.name"] ==
  #     "continuum-network-latency" from every scope filter it renders. That's a reserved identifier this
  #     agent's own path-measurement OTLP output must set once it exists (it doesn't yet - see
  #     telemetry-intent.md) - documented here so the contract is visible before the emitter is built, not
  #     discovered by a namespace scope silently dropping data later.
  #   - accelerators (GPU metrics) ignores this block entirely unless telemetry.accelerators.metrics.applyScope
  #     is also turned on - see that field's own comment above for why it's opt-in rather than automatic.
  scope:
    namespaces: []
    exclude: []
    selector: ""

  # Per-workload scheduling and sizing for the host DaemonSet (see telemetry.yaml). Kepler's own equivalent
  # knobs live under energy.metrics above, next to its image, rather than a third top-level block; the
  # cluster Deployment only needs resources (it isn't a DaemonSet, so tolerations/nodeSelector don't apply
  # the same way - use a normal deployment-level scheduling override if you ever need one).
  hostCollector:
    tolerations:
      - operator: Exists
    nodeSelector:
      kubernetes.io/os: linux
    resources: {}   # falls back to telemetry.resources below when empty
  clusterCollector:
    resources: {}   # falls back to telemetry.resources below when empty

  # Off by default. When enabled, adds the OpenTelemetry Collector Contrib "opamp" extension (ALPHA status
  # upstream as of this chart's pinned collectorImage - the schema may still change) to both collector
  # ConfigMaps: it reports this collector's health, effective config, and available components to an OpAMP
  # server, if one is actually listening at server.endpoint. This is report-only and forward-compatible with
  # a future Continuum-side OpAMP server / control-plane component - it does NOT accept remote config push
  # itself (that needs the separate OpAMP "Supervisor" process pattern wrapping the collector, which this
  # chart does not implement). Safe to leave off; nothing here works without a server to report to.
  opamp:
    enabled: false
    server:
      endpoint: ""   # e.g. wss://opamp.example.com:4320/v1/opamp
      tls:
        insecure: false
        caFile: ""
      headers: {}    # extra headers sent on the WebSocket handshake, e.g. for a bearer token - map[string]string

  # Shared default for every telemetry workload's resource requests/limits (host collector, cluster
  # collector, Kepler); override per-workload above when one of them needs something different.
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
