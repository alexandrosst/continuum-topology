{{- if .Values.nodeProbe.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.probeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ include "agent.probeSecret" . | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: continuum-node-probe
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-probe
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: continuum-node-probe, app.kubernetes.io/instance: {{ .Release.Name }}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 10%}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: continuum-node-probe
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: continuum
        {{- include "agent.podLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include "agent.probeSecretRevision" . }}   # a new secret rolls the pods: they read it at start
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false   # the probe never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532   # lets the non-root probe read the mounted secret
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: {{ include "agent.image" . | quote }}
          imagePullPolicy: {{ include "agent.imagePullPolicy" . }}
          args: ["probe", "--interval={{ .Values.nodeProbe.interval }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: CONTINUUM_PROBE_URL, value: "http://continuum-agent-probe.{{ .Release.Namespace }}.svc:8081"}
            - {name: CONTINUUM_PROBE_SECRET_FILE, value: /secret/secret}
            {{- if .Values.nodeProbe.hostSys }}
            - {name: CONTINUUM_PROBE_SYS, value: /host/sys}
            {{- end }}
          volumeMounts:
            - {name: secret, mountPath: /secret, readOnly: true}
            {{- if .Values.nodeProbe.hostSys }}
            - {name: host-sys, mountPath: /host/sys, readOnly: true}
            {{- end }}
          resources: {{- toYaml .Values.nodeProbe.resources | nindent 12 }}
      volumes:
        - name: secret
          secret: {secretName: {{ include "agent.probeSecretName" . }}, defaultMode: 0440}
        {{- if .Values.nodeProbe.hostSys }}
        - name: host-sys
          hostPath: {path: /sys, type: Directory}
        {{- end }}
      {{- with .Values.nodeProbe.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeProbe.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
