{{- if include "agent.telemetryClusterEnabled" . }}
{{/* Infra pipelines: cluster-wide object watching and anything inherently node/cluster-scoped (Kepler,
     an existing energy endpoint). Never filtered by telemetry.scope - that only ever applies to genuinely
     application-scoped data, see the app pipelines below. */}}
{{- $cMetricsInfra := list }}
{{- if .Values.telemetry.kubernetesState.metrics.enabled }}{{ $cMetricsInfra = append $cMetricsInfra "k8s_cluster" }}{{ end }}
{{- if .Values.telemetry.energy.metrics.enabled }}{{ $cMetricsInfra = append $cMetricsInfra "prometheus/infra" }}{{ end }}
{{- $cLogsInfra := list }}
{{- if .Values.telemetry.kubernetesEvents.logs.enabled }}{{ $cLogsInfra = append $cLogsInfra "k8sobjects" }}{{ end }}

{{/* App pipelines: whatever applications push over OTLP or expose for this collector to scrape - the only
     data telemetry.scope's namespace filtering actually applies to (see the "known limitation" note in
     values.yaml about networkLatency sharing the same otlp receiver with no distinguishing tag of its own). */}}
{{- $cMetricsApp := list }}
{{- if .Values.telemetry.applicationMetrics.metrics.enabled }}{{ $cMetricsApp = append $cMetricsApp "prometheus/app" }}{{ end }}
{{- if or .Values.telemetry.networkLatency.metrics.enabled .Values.telemetry.applicationMetrics.metrics.enabled }}{{ $cMetricsApp = append $cMetricsApp "otlp" }}{{ end }}
{{- $cLogsApp := list }}
{{- if .Values.telemetry.applicationLogs.logs.enabled }}{{ $cLogsApp = append $cLogsApp "otlp" }}{{ end }}

{{- $keplerName := printf "%s-kepler" (include "agent.telemetryName" .) }}

{{/* telemetry.scope, turned into filterprocessor OTTL conditions. The processor DROPS whatever matches a
     condition and ORs the list together, so: "namespaces" (keep only these) becomes "drop anything that
     does NOT match the allow-list regex", and "exclude" (drop these specifically) becomes "drop anything
     that DOES match the deny-list regex" - both can be set at once, and either resolves the same way for
     every signal because Kubernetes namespace names are DNS-1123 labels (lowercase alphanumeric and
     hyphens only), so building a regex alternation directly from them needs no escaping. */}}
{{- $scopeConditions := list }}
{{- if .Values.telemetry.scope.namespaces }}
{{- $scopeConditions = append $scopeConditions (printf "not IsMatch(resource.attributes[\"k8s.namespace.name\"], \"^(%s)$\")" (join "|" .Values.telemetry.scope.namespaces)) }}
{{- end }}
{{- if .Values.telemetry.scope.exclude }}
{{- $scopeConditions = append $scopeConditions (printf "IsMatch(resource.attributes[\"k8s.namespace.name\"], \"^(%s)$\")" (join "|" .Values.telemetry.scope.exclude)) }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.telemetryName" . }}-cluster-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    receivers:
      {{- if .Values.telemetry.kubernetesState.metrics.enabled }}
      k8s_cluster:
        collection_interval: 30s
        auth_type: serviceAccount
        allocatable_types_to_report: [cpu, memory]
      {{- end }}
      {{- if .Values.telemetry.kubernetesEvents.logs.enabled }}
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
      {{- end }}
      {{- if include "agent.telemetryOtlpReceiverEnabled" . }}
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
          http: {endpoint: "0.0.0.0:4318"}
      {{- end }}
      {{- if .Values.telemetry.energy.metrics.enabled }}
      # Infra-scoped: Kepler (this collector's own bundled DaemonSet) and/or an existing energy endpoint.
      # Kept separate from prometheus/app below so telemetry.scope's namespace filter, which only ever
      # applies to application-scoped data, can never accidentally touch either of these.
      prometheus/infra:
        config:
          scrape_configs:
            {{- if eq .Values.telemetry.energy.metrics.source "bundle-kepler" }}
            - job_name: kepler
              kubernetes_sd_configs: [{role: pod}]
              relabel_configs:
                - {source_labels: ["__meta_kubernetes_pod_label_app_kubernetes_io_name"], regex: {{ $keplerName | quote }}, action: keep}
                - {source_labels: ["__meta_kubernetes_pod_node_name"], target_label: node}
            {{- end }}
            {{- if eq .Values.telemetry.energy.metrics.source "existing" }}
            - job_name: energy-existing
              static_configs: [{targets: [{{ .Values.telemetry.energy.metrics.existing.prometheusEndpoint | quote }}]}]
            {{- end }}
      {{- end }}
      {{- if .Values.telemetry.applicationMetrics.metrics.enabled }}
      # App-scoped: only the operator's own explicit scrapeTargets, never Kepler or an energy endpoint -
      # this is the one telemetry.scope's namespace filter is allowed to reach.
      prometheus/app:
        config:
          scrape_configs:
            {{- range $t := .Values.telemetry.applicationMetrics.metrics.scrapeTargets }}
            - job_name: {{ $t.jobName | quote }}
              # podLabelSelector is a standard Kubernetes label selector (e.g. "app=myapp" or
              # "app=myapp,tier=frontend"), evaluated by the Kubernetes API itself via the discovery
              # config's own "selectors" field - not reimplemented here as relabel_configs, which would
              # only support a single "key=value" pair and silently mismatch anything else.
              kubernetes_sd_configs:
                - role: pod
                  namespaces: {names: [{{ $t.namespace | quote }}]}
                  selectors:
                    - {role: pod, label: {{ $t.podLabelSelector | quote }}}
              relabel_configs:
                - {source_labels: ["__address__"], target_label: "__address__", replacement: "${1}:{{ $t.port }}", regex: "([^:]+)(?::\\d+)?"}
              metrics_path: {{ $t.path | default "/metrics" | quote }}
            {{- end }}
      {{- end }}

    processors:
      batch: {}
      # Unlike the host collector, this one has a real inbound OTLP receiver apps connect to directly (the
      # standard k8sattributes recipe for that is connection-based association), alongside receivers that
      # already set their own k8s.pod.uid (kubeletstats-style attribution doesn't apply here, but Prometheus-
      # scraped app targets get resource identity from k8sattributes rather than carrying their own).
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name]
      {{- if and .Values.telemetry.energy.metrics.enabled (eq .Values.telemetry.energy.metrics.source "bundle-kepler") }}
      # Kepler's own Prometheus scrape only carries a raw "node" metric label (see the relabel_configs
      # above) - promote it to the semconv k8s.node.name resource attribute so per-node energy data can
      # actually be correlated with the host collector's per-node metrics on node identity, the way OTel's
      # own conventions intend. Without this, Kepler's data has no resource-level node identity at all.
      transform/kepler_node:
        metric_statements:
          - context: datapoint
            statements:
              - set(resource.attributes["k8s.node.name"], datapoint.attributes["node"]) where datapoint.attributes["node"] != nil
      {{- end }}
      {{- if $scopeConditions }}
      # Applied only to the app pipelines below (metrics/app, logs/app, traces) - never to the infra ones,
      # which have no k8s.namespace.name to begin with. See telemetry.scope in values.yaml for exactly what
      # namespaces/exclude mean and the one known gap (networkLatency sharing otlp with no tag of its own).
      filter/scope:
        error_mode: ignore
        metric_conditions: {{ $scopeConditions | toJson }}
        log_conditions: {{ $scopeConditions | toJson }}
        trace_conditions: {{ $scopeConditions | toJson }}
      {{- end }}

    {{- if .Values.telemetry.opamp.enabled }}
    extensions:
      {{- include "agent.telemetryOpampExtensionYAML" . | nindent 6 }}
    {{- end }}

    exporters:
      {{- include "agent.telemetryExporterYAML" . | nindent 6 }}

    service:
      {{- if .Values.telemetry.opamp.enabled }}
      extensions: [opamp]
      {{- end }}
      pipelines:
        {{- if $cMetricsInfra }}
        metrics/infra:
          receivers: {{ $cMetricsInfra | toJson }}
          processors: [k8sattributes{{ if and .Values.telemetry.energy.metrics.enabled (eq .Values.telemetry.energy.metrics.source "bundle-kepler") }}, transform/kepler_node{{ end }}, batch]
          exporters: [otlp]
        {{- end }}
        {{- if $cMetricsApp }}
        metrics/app:
          receivers: {{ $cMetricsApp | toJson }}
          processors: [k8sattributes{{ if $scopeConditions }}, filter/scope{{ end }}, batch]
          exporters: [otlp]
        {{- end }}
        {{- if $cLogsInfra }}
        logs/infra:
          receivers: {{ $cLogsInfra | toJson }}
          processors: [k8sattributes, batch]
          exporters: [otlp]
        {{- end }}
        {{- if $cLogsApp }}
        logs/app:
          receivers: {{ $cLogsApp | toJson }}
          processors: [k8sattributes{{ if $scopeConditions }}, filter/scope{{ end }}, batch]
          exporters: [otlp]
        {{- end }}
        {{- if .Values.telemetry.traces.traces.enabled }}
        traces:
          receivers: [otlp]
          processors: [k8sattributes{{ if $scopeConditions }}, filter/scope{{ end }}, batch]
          exporters: [otlp]
        {{- end }}
{{- end }}
