{{- /* Optional: restrict what the agent pod may connect to. Off by default; see networkPolicy.egress in values.yaml. */ -}}
{{- $np := dig "networkPolicy" "egress" (dict) .Values.AsMap }}
{{- if $np.enabled }}
{{- if not $np.apiServerCIDRs }}{{ fail "networkPolicy.egress.enabled needs networkPolicy.egress.apiServerCIDRs: the Kubernetes API server's address(es), e.g. [\"10.43.0.1/32\", \"192.168.1.10/32\"] (see: kubectl get endpoints kubernetes -n default)" }}{{ end }}
{{- if not $np.serverCIDRs }}{{ fail "networkPolicy.egress.enabled needs networkPolicy.egress.serverCIDRs: the address(es) that server.address resolves to. A NetworkPolicy cannot match a host name." }}{{ end }}
# The agent may connect only to DNS, the Kubernetes API and the Ikhnos server (plus what extraEgress adds). A policy that
# selects a pod denies everything it does not list, so anything not named here is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: continuum-agent-egress
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: continuum-agent, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Egress]
  egress:
    # DNS: kube-dns/CoreDNS and NodeLocal DNSCache (169.254.20.10), see agent.dnsEgressRule
    {{- include "agent.dnsEgressRule" (dict "dnsCIDRs" $np.dnsCIDRs) | nindent 4 }}
    # The Kubernetes API server
    - to:
        {{- range $np.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range ($np.apiServerPorts | default (list 443 6443)) }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    # The Ikhnos server (server.address: {{ .Values.server.address }})
    - to:
        {{- range $np.serverCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: {{ include "agent.serverPort" . }}, protocol: TCP}
    {{- if include "agent.telemetryHealthEnabled" . }}
    # The telemetry collectors' own export counters (telemetry.health), which the agent reads to report whether
    # each destination is receiving data.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [continuum-telemetry-host, continuum-telemetry-cluster]
              - key: app.kubernetes.io/instance
                operator: In
                values: [{{ .Release.Name | quote }}]
      ports:
        - {port: {{ .Values.telemetry.health.port | int }}, protocol: TCP}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
