{{- include "agent.preflightPodSecurity" . -}}
{{- if not .Values.server.address }}{{- fail "server.address is required (host:port)" }}{{- end }}
{{- if not (include "agent.caPin" .) }}{{- fail "server.caPin is required (or enrollment.key, which carries it together with the enrollment token)" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: 1   # exactly one: the agent is not built to run as several (see strategy)
  # Recreate, not RollingUpdate: a rolling update starts the new pod before the old one stops, and for a while two agents would
  # hold the SAME identity (one Secret, one certificate). The server keeps one stream per agent, so they would displace each
  # other in a loop, and both would try to renew and store the certificate. Recreate stops the old pod first; the price
  # is a few seconds without reports at each upgrade, which the dashboard never notices.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ikhnos-agent, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {{- include "agent.labels" . | nindent 8 }}
        {{- include "agent.podLabels" . | nindent 8 }}
      annotations:
        # A change to one of these Secrets rolls the pod (helm upgrade alone would not: env and files are read at start).
        checksum/enrollment: {{ include (print $.Template.BasePath "/enrollment.yaml") . | sha256sum }}
        {{- if .Values.nodeProbe.enabled }}
        checksum/probe-secret: {{ include "agent.probeSecretRevision" . }}
        {{- end }}
        {{- if .Values.flowObserver.enabled }}
        checksum/flow-secret: {{ include "agent.flowSecretRevision" . }}
        {{- end }}
        {{- if include "agent.linkIperf" . }}
        checksum/link-iperf-secret: {{ include "agent.linkIperfSecretRevision" . }}
        {{- end }}
        {{- if include "agent.linkPeers" . }}
        checksum/link-peers-secret: {{ include "agent.linkPeersSecretRevision" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent.name" . }}
      # fsGroup lets the non-root agent read the mounted probe/flow secrets.
      securityContext: {{- include "agent.nonRootPodSecurityContext" (dict "root" . "fsGroup" true) | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "agent.image" . | quote }}
          imagePullPolicy: {{ include "agent.imagePullPolicy" . }}
          args: ["agent"]   # the role: one image, `ikhnos agent|probe|flow`; the settings below come in as environment variables
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: IKHNOS_SERVER, value: {{ .Values.server.address | quote }}}
            - {name: IKHNOS_CA_PIN, value: {{ include "agent.caPin" . | quote }}}
            - {name: IKHNOS_TIER, value: {{ include "agent.tier" . | quote }}}
            {{- with include "agent.telemetrySignalNames" . }}
            # Which telemetry.*.enabled signals this install's chart turned on - purely informational, the
            # agent only ever reports this back in its own Diagnostics (self-report, the same way it already
            # self-reports IKHNOS_TIER above), it never interprets or enforces it. Absent entirely rather
            # than present-and-empty when no signal is enabled.
            - {name: IKHNOS_TELEMETRY_SIGNALS, value: {{ . | quote }}}
            {{- end }}
            {{- if include "agent.telemetryEnabled" . }}
            # Effective telemetry configuration, not just which signals are on - the chart's own answer to
            # "how" rather than just "which" (see telemetry-intent.md's "Where this doesn't reach yet").
            # Reported in Diagnostics alongside IKHNOS_TELEMETRY_SIGNALS above, same self-report
            # mechanism, same "absent entirely rather than present-and-empty" rule: this whole block is
            # gated on telemetry being enabled at all, and the traces/energy/accelerators-specific entries
            # below are each further gated on that one signal actually being on.
            - {name: IKHNOS_TELEMETRY_DESTINATION, value: {{ include "agent.telemetryEffectiveDestination" . | quote }}}
            {{- if include "agent.telemetryHealthEnabled" . }}
            # Where the agent reads each collector's own export counters (telemetry.health): one headless
            # Service name per collector, resolved to every pod. Absent: the agent reports no export health.
            - {name: IKHNOS_TELEMETRY_HEALTH_TARGETS, value: {{ include "agent.telemetryHealthTargets" . | quote }}}
            {{- end }}
            - {name: IKHNOS_TELEMETRY_REDACTION, value: {{ include "agent.telemetryEffectiveRedactionEnabled" . | quote }}}
            - {name: IKHNOS_TELEMETRY_RESOURCE_DETECTION, value: {{ include "agent.telemetryEffectiveResourceDetectionEnabled" . | quote }}}
            {{- if .Values.telemetry.traces.traces.enabled }}
            - {name: IKHNOS_TELEMETRY_TRACES_SAMPLING, value: {{ .Values.telemetry.processors.tracesSampling.percentage | quote }}}
            {{- end }}
            {{- if .Values.telemetry.energy.metrics.enabled }}
            - {name: IKHNOS_TELEMETRY_ENERGY_SOURCE, value: {{ .Values.telemetry.energy.metrics.source | quote }}}
            {{- end }}
            {{- if .Values.telemetry.accelerators.metrics.enabled }}
            - {name: IKHNOS_TELEMETRY_ACCELERATORS_SOURCE, value: {{ .Values.telemetry.accelerators.metrics.source | quote }}}
            {{- end }}
            {{- end }}
            {{- if .Values.telemetry.clusterLinks.metrics.enabled }}
            # What this install can do for the cluster-link telemetry, reported by the agent in every heartbeat (purely informational:
            # the Sites screen uses it to say which step of setting a pair up is missing). Whether the probe is on is already
            # IKHNOS_LINK_SERVE_PEERS above.
            {{- if and (include "agent.linkPeers" .) .Values.telemetry.clusterLinks.probe.capacity.enabled }}
            - {name: IKHNOS_LINK_CAPACITY, value: "true"}
            {{- end }}
            {{- if include "agent.linkTelemetryExport" . }}
            - {name: IKHNOS_LINK_TELEMETRY_EXPORT, value: "true"}
            {{- end }}
            {{- end }}
            {{- if eq .Values.rbac.mode "namespaced" }}
            # Tells the collector that tier 2's RBAC is a Role per namespace (rbac.yaml), not one cluster-wide
            # ClusterRole: it watches each of IKHNOS_SCOPE_NAMESPACES individually instead of the whole cluster,
            # and never attempts to read Namespaces or PersistentVolumes (no Role, in any namespace, can grant either).
            - {name: IKHNOS_RBAC_MODE, value: "namespaced"}
            {{- end }}
            - {name: IKHNOS_IDENTITY_SECRET, value: {{ include "agent.identitySecret" . | quote }}}
            {{- with include "agent.renewSecretNames" . | fromJsonArray }}
            - {name: IKHNOS_RENEW_SECRETS, value: {{ join "," . | quote }}}
            {{- end }}
            - {name: GOMEMLIMIT, value: {{ .Values.tuning.goMemLimit | quote }}}
            - {name: GOGC, value: {{ .Values.tuning.goGC | quote }}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Helm does not expose the release name to a running pod any other way (it is not a downward-API field), so
            # it is templated in here. The server uses it to print `helm upgrade`/`helm uninstall` commands against the
            # release that is actually running, instead of guessing "ikhnos-agent".
            - {name: IKHNOS_RELEASE_NAME, value: {{ .Release.Name | quote }}}
            - name: IKHNOS_TOKEN
              valueFrom: {secretKeyRef: {name: ikhnos-agent-enrollment, key: token, optional: true}}
            {{- if .Values.measurements.enabled }}
            - {name: IKHNOS_MEASURE, value: "true"}
            {{- end }}
            {{- with .Values.scope.namespaces }}
            - {name: IKHNOS_SCOPE_NAMESPACES, value: {{ join "," . | quote }}}
            {{- end }}
            {{- with .Values.scope.exclude }}
            - {name: IKHNOS_SCOPE_EXCLUDE, value: {{ join "," . | quote }}}
            {{- end }}
            {{- with .Values.scope.selector }}
            - {name: IKHNOS_SCOPE_LABEL, value: {{ . | quote }}}
            {{- end }}
            {{- if include "agent.healthEnabled" . }}
            - {name: IKHNOS_HEALTH_LISTEN, value: ":{{ include "agent.healthPort" . }}"}
            {{- end }}
            {{- if include "agent.receiver" . }}
            - {name: IKHNOS_PROBE_LISTEN, value: ":8081"}
            {{- end }}
            {{- if .Values.nodeProbe.enabled }}
            - {name: IKHNOS_PROBE_SECRET_FILE, value: /probe/secret}
            # How often the probes were told to report, so the agent can tell a quiet one from one that cannot reach it.
            - {name: IKHNOS_PROBE_INTERVAL, value: {{ .Values.nodeProbe.interval | quote }}}
            {{- end }}
            {{- if .Values.telemetry.clusterLinks.metrics.enabled }}
            - {name: IKHNOS_LINK_METRICS_LISTEN, value: ":9104"}
            # The agent's own addresses: its connections (the targets it tests, its stream to the server) are not the traffic between clusters.
            - name: IKHNOS_LINK_OWN_ADDRESSES
              valueFrom: {fieldRef: {fieldPath: status.podIPs}}
            {{- if .Values.telemetry.clusterLinks.probe.enabled }}
            - {name: IKHNOS_LINK_SERVE_PEERS, value: "true"}
            - {name: IKHNOS_LINK_PEERS_SECRET_FILE, value: /link-peers/secret}
            {{- if include "agent.linkIperf" . }}
            # The iperf3 credentials the Ikhnos server issues: held in memory, handed to the prober (client side, with the peer list) and to
            # the responder's iperf3 pods (server side, signed with the secret below), never written anywhere.
            - {name: IKHNOS_LINK_SERVE_IPERF, value: "true"}
            - {name: IKHNOS_LINK_IPERF_SECRET_FILE, value: /link-iperf/secret}
            {{- end }}
            {{- $lp := .Values.telemetry.clusterLinks.probe }}
            # The prober's own ports (OWAMP control and test packets, iperf3), so the link metrics and the load the throughput tests
            # wait on do not count the prober's traffic as the link's.
            - {name: IKHNOS_LINK_PROBER_PORTS, value: "{{ int $lp.responder.port }},{{ $lp.responder.testPorts }}{{ if $lp.capacity.enabled }},{{ int $lp.capacity.port }}{{ end }}"}
            {{- end }}
            {{- end }}
            {{- if .Values.flowObserver.enabled }}
            - {name: IKHNOS_FLOW_SECRET_FILE, value: /flows/secret}
            - {name: IKHNOS_FLOW_INTERVAL, value: {{ .Values.flowObserver.interval | quote }}}
            - {name: IKHNOS_FLOW_WINDOW, value: {{ .Values.flowObserver.window | quote }}}
            {{- end }}
            {{- with .Values.proxy }}
            {{- if or .httpProxy .httpsProxy }}
            {{- with .httpProxy }}
            - {name: HTTP_PROXY, value: {{ . | quote }}}
            {{- end }}
            {{- with .httpsProxy }}
            - {name: HTTPS_PROXY, value: {{ . | quote }}}
            {{- end }}
            {{- /* the in-cluster names are always exempt: the probe and flow reports and the API server must not go through a proxy */}}
            {{- $no := "localhost,127.0.0.1,.svc,.cluster.local" }}
            {{- if .noProxy }}{{ $no = printf "%s,%s" $no .noProxy }}{{ end }}
            - {name: NO_PROXY, value: {{ $no | quote }}}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (include "agent.receiver" .) (include "agent.healthEnabled" .) .Values.telemetry.clusterLinks.metrics.enabled }}
          ports:
            {{- if include "agent.receiver" . }}
            - {name: probe, containerPort: 8081, protocol: TCP}
            {{- end }}
            {{- if include "agent.healthEnabled" . }}
            - {name: health, containerPort: {{ include "agent.healthPort" . }}, protocol: TCP}
            {{- end }}
            {{- if .Values.telemetry.clusterLinks.metrics.enabled }}
            - {name: link-metrics, containerPort: 9104, protocol: TCP}
            {{- end }}
          {{- end }}
          {{- if include "agent.healthEnabled" . }}
          # Liveness fails only when the agent's own loop has stopped for 5 minutes; readiness says whether it is connected (or
          # waiting for approval, which is normal). See `health` in values.yaml. Being generous here on purpose: a probe that
          # restarts the agent for a slow server would only make things worse.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          {{- end }}
          {{- if or (include "agent.receiver" .) (include "agent.linkPeers" .) }}
          volumeMounts:
            {{- if .Values.nodeProbe.enabled }}
            - {name: probe-secret, mountPath: /probe, readOnly: true}
            {{- end }}
            {{- if .Values.flowObserver.enabled }}
            - {name: flow-secret, mountPath: /flows, readOnly: true}
            {{- end }}
            {{- if include "agent.linkPeers" . }}
            - {name: link-peers-secret, mountPath: /link-peers, readOnly: true}
            {{- end }}
            {{- if include "agent.linkIperf" . }}
            - {name: link-iperf-secret, mountPath: /link-iperf, readOnly: true}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if or (include "agent.receiver" .) (include "agent.linkPeers" .) }}
      volumes:
        {{- if .Values.nodeProbe.enabled }}
        - name: probe-secret
          secret: {secretName: {{ include "agent.probeSecretName" . }}, defaultMode: 0440}
        {{- end }}
        {{- if .Values.flowObserver.enabled }}
        - name: flow-secret
          secret: {secretName: {{ include "agent.flowSecretName" . }}, defaultMode: 0440}
        {{- end }}
        {{- if include "agent.linkPeers" . }}
        - name: link-peers-secret
          secret: {secretName: {{ include "agent.linkPeersSecretName" . }}, defaultMode: 0440}
        {{- end }}
        {{- if include "agent.linkIperf" . }}
        - name: link-iperf-secret
          secret: {secretName: {{ include "agent.linkIperfSecretName" . }}, defaultMode: 0440}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
