# FUSION: the default place a regional operator saves what it receives. One pod per signal type, each with its
# own durable volume and its own Service:
#
#   metrics -> Prometheus   (its native OTLP receiver; <name>-prometheus:9090, path /api/v1/otlp)
#   logs    -> Loki         (its native OTLP endpoint;  <name>-loki:3100,       path /otlp)
#   traces  -> Tempo        (OTLP gRPC 4317 / HTTP 4318; <name>-tempo)
#
# <name> is the release name, with "-fusion" added unless it already contains "fusion". A regional operator in the
# same cluster reaches each store by that Service name; nothing here needs an Ingress.
#
# SIZING. Rough figures to start from, not promises; measure your own data and adjust `storage` (the volume) and
# `resources.limits.memory` of each store. Prometheus is derived from them: its size limit is 85% of `storage`.
#
#   Prometheus  about 2 bytes per sample on disk, 3-4 KB of memory per active series. A series sampled every 30 s is
#               2880 samples a day, so 15 days of one series is about 85 KB.
#                 active series   disk for 15 days   prometheus.storage   memory limit
#                 20 000          1.7 GB             5Gi                  1Gi
#                 100 000         8.6 GB             10Gi (the default)   2Gi (the default)
#                 500 000         43 GB              50Gi                 4Gi
#   Loki        compresses logs about 8 to 1 on disk. 2 GB of raw logs a day is about 0.25 GB a day stored, so the 7 day
#               default needs under 2 GB and the default 10Gi suits up to roughly 10 GB of raw logs a day.
#   Tempo       about 400 bytes per span on disk. 100 spans a second is about 3.5 GB a day, so the 72 hour default needs
#               about 10 GB: the default 10Gi suits up to roughly 80 spans a second.
#   central     the gateway holds its sending queue and one batch per signal, nothing else: raise its memory limit
#               together with central.queue.size.
#
# SECURITY: none of the three stores authenticates anything. They are ClusterIP only and meant to be reached from
# inside the cluster. Turn on networkPolicy to limit who inside the cluster can write to or read from them.

imagePullSecrets: []
podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# Who turns FUSION on and off. Off (the default) is a plain install: everything runs. With managed on, the
# Ikhnos server owns the switch - it scales the stores and the central gateway between 0 and 1 itself - so a
# `helm upgrade` keeps whatever the server last decided (the live replica count) instead of resetting it, and
# initialReplicas (0 = standing by, nothing running, volumes kept) only applies to the very first install.
switch:
  managed: false
  initialReplicas: 1

# The central gateway: one OpenTelemetry Collector that is the ONLY way into FUSION. It requires a client
# certificate (mTLS) from whatever sends to it - regional operators, which the server issues one to - and
# fans each signal type out to its store. The stores themselves stay ClusterIP-only and unauthenticated; the
# gateway is the thing that may be exposed (an Ingress or LoadBalancer is outside this chart).
central:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.160.0"
    digest: ""
    pullPolicy: IfNotPresent
  # How the gateway's Service is exposed. ClusterIP (default) = inside this cluster only. LoadBalancer or NodePort lets
  # regional operators in other clusters reach it; every sender still needs a client certificate from this server. The
  # stores' own Services are always ClusterIP.
  # Exposed (LoadBalancer or NodePort), only the OTLP/gRPC port (4317) is published. annotations and
  # loadBalancerSourceRanges keep it private (an internal load balancer is an annotation your cloud defines).
  service:
    type: ClusterIP
    # NodePort only: pins the port the Service listens on, inside the cluster's node-port range (30000-32767 unless it was
    # started with another), so the address recorded as "Reachable at" does not change when the Service is recreated.
    # 0 = Kubernetes picks one (see it with `kubectl get svc <name>-central`). A NodePort never listens on 4317: the
    # address operators dial is <node address>:<this port>. A node's address is often a private one; put a load balancer
    # or a DNS name over the nodes for anything lasting.
    nodePort: 0
    annotations: {}
    loadBalancerSourceRanges: []   # LoadBalancer only
  # What each exporter does while its store is unreachable (Prometheus, Loki or Tempo restarting, a volume not yet
  # bound): retry for retryMaxElapsedTime, holding up to `size` requests meanwhile. A full queue blocks the batch
  # processor (block_on_overflow), memory_limiter then refuses at the receiver and the backpressure reaches the senders,
  # whose own queues hold the data, so nothing here is dropped silently and nothing grows without bound. One entry is
  # one request of at most maxRequestBytes: raise `size` together with the memory limit.
  # maxRequestBytes cuts a request into pieces of at most that many serialized bytes, because the batch processor only
  # counts items and 4096 log records of 2 KiB are 8 MiB, past the 4 MiB Loki and Tempo accept (such a batch is refused
  # whole and dropped). 0 turns the cut off.
  # `persistent` also writes the queue to an emptyDir, so it survives a container restart (not a rescheduled pod; it
  # counts against the node's ephemeral storage up to sizeLimit). Off by default, and only worth it once the gateway
  # is the thing whose restart you cannot afford to lose a minute of data across.
  queue:
    size: 256
    retryMaxElapsedTime: 30m
    maxRequestBytes: 3145728
    persistent:
      enabled: false
      sizeLimit: 1Gi
  # Explicit batch sizes: the collector's default leaves the maximum unbounded, and a batch past a store's request
  # limit (4 MiB on Loki and Tempo by default) is rejected whole and retried until it is dropped.
  batch:
    timeout: 5s
    sendBatchSize: 2048
    sendBatchMaxSize: 4096
  # Senders that export DELTA metrics (some SDKs, statsd-style sources) lose them otherwise: Prometheus ingests
  # cumulative series only and refuses or drops delta ones, depending on its version. This accumulates deltas into cumulative series in the gateway's memory,
  # ahead of the batch processor. It is stateful, so it relies on the gateway being ONE replica (it is); after a restart
  # the running totals start over. A series silent for maxStale is forgotten; series past maxStreams are dropped
  # (the collector counts them in its own metrics). Cumulative metrics pass through untouched. Turn it off to
  # skip the one extra in-memory hop if nothing sends deltas.
  deltaToCumulative:
    enabled: true
    maxStale: 5m
    maxStreams: 100000
  # The gateway's TLS Secret (tls.crt, tls.key: its own server certificate; ca.crt: the CA every sender's client
  # certificate must chain to) is "<name>-central-receiver-tls" and is not a value: this chart creates it empty and the
  # Ikhnos server fills it in by that name, so a different name would leave the gateway with no certificate. A gateway
  # with none does not start, which is why a fresh managed install stands by at 0 replicas.
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 384Mi}

# Durable volumes. Off means each store keeps its data in an emptyDir: everything is lost when its pod is
# rescheduled, which is only right for a demo.
persistence:
  enabled: true
  storageClass: ""    # "" = the cluster's default StorageClass

prometheus:
  enabled: true
  image:
    repository: quay.io/prometheus/prometheus
    tag: v3.5.0
    digest: ""        # sha256:..., pins the image and ignores tag
    pullPolicy: IfNotPresent
  retention: 15d      # how long samples are kept: a number and a unit (y, w, d, h, m, s)
  # The most disk the stored blocks may use before the oldest are deleted, as Prometheus writes it: 0 (no limit) or a
  # number and a unit (B, KB, MB, GB, TB, PB; powers of 1024) like 8GB. Empty (the default) takes 85% of `storage` when
  # the volume is durable: the time limit alone lets a busy install fill the volume, and a full volume stops ingestion
  # altogether. The 15% left is room for the write-ahead log, the head and compaction, which are written outside the
  # blocks the limit counts. Whichever of retention and this is hit first wins.
  retentionSize: ""
  # The path the Ikhnos server serves Prometheus's own page under ("Open Prometheus" in the UI); the server strips it
  # before the request arrives. Empty = Prometheus believes it lives at the root, which is right only when you reach it
  # some other way.
  webPrefix: /fusion/prometheus/
  storage: 10Gi
  # Resource attributes Prometheus turns into labels on every series. The first ones are what lets a metric be joined to a
  # span or a log line later (same cluster, namespace, pod). The rest are what tells apart the things one sender reports on:
  # a series is identified by its labels alone, so two resources that differ only in an attribute that is not listed here
  # become ONE series, and their samples overwrite each other (the container, the volume, the StatefulSet, DaemonSet, Job and
  # ReplicaSet that kubelet and cluster-state metrics are about). An attribute not listed is not kept in target_info
  # either: Prometheus writes that series only for a resource that has a service.name or service.instance.id, and the
  # infrastructure metrics have neither. Add an attribute here before relying on it to separate or find anything.
  promoteResourceAttributes:
    - service.name
    - service.namespace
    - k8s.cluster.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.node.name
    - k8s.deployment.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - k8s.daemonset.name
    - k8s.job.name
    - k8s.cronjob.name
    - k8s.hpa.name
    - k8s.resourcequota.name
    - k8s.container.name
    - k8s.volume.name
    - k8s.persistentvolumeclaim.name
    - continuum.org.id
    - continuum.cluster.id
    - continuum.operator.id
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

loki:
  enabled: true
  image:
    repository: docker.io/grafana/loki
    tag: 3.5.0
    digest: ""
    pullPolicy: IfNotPresent
  retention: 168h     # whole days, in hours (24h, 48h, ...): Loki deletes by day
  storage: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

tempo:
  enabled: true
  image:
    repository: docker.io/grafana/tempo
    tag: 2.8.0
    digest: ""
    pullPolicy: IfNotPresent
  retention: 72h      # hours
  storage: 10Gi
  # Charts of traces over time (request rate, errors, duration, per service) in Grafana's Drilldown > Traces: they are TraceQL
  # metrics queries, which Tempo only answers with its metrics-generator "local-blocks" processor on. A little more memory and
  # disk on the same volume. Off: searching and opening a trace still work, the Drilldown charts show an error.
  traceqlMetrics: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Grafana, already connected to the stores: Prometheus, Loki and Tempo are its provisioned data sources (a log line links
# to its trace, a trace to its logs) and one starter dashboard shows what is arriving. It has no login page and no
# anonymous access: it is reached only through the Ikhnos server (an administrator, at /fusion/grafana/), which signs the
# person in to it (basic auth is off; its built-in admin has a random password in a Secret this chart generates and keeps
# across upgrades). Off here means no Grafana at all; the three stores are unaffected.
grafana:
  enabled: true
  image:
    repository: docker.io/grafana/grafana
    tag: 12.2.0
    digest: ""
    pullPolicy: IfNotPresent
  # What a person signed in through the server may do in Grafana: Viewer (look), Editor (also build dashboards and use
  # Explore freely) or Admin. Data sources are provisioned read-only whatever the role.
  role: Editor
  storage: 2Gi        # Grafana's own database: dashboards a person saves, preferences
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# Isolates the stores' pods. On by default: the stores authenticate nothing, so this is the only thing between them and
# every other pod in the cluster. Allowed in: the other pods of this release (the central gateway, Grafana and, when
# installed with the Ikhnos server, the server itself) and whatever allowedIngress names - nothing by default, so no pod of
# another release or namespace reaches a store, whatever labels it carries. Regional operators send to the central gateway,
# which is in this release; only one routed straight to a store (an export route pointing at Prometheus, Loki or Tempo)
# needs an entry, and it should name the operator's own namespace. A cluster whose network plugin does not enforce
# NetworkPolicy ignores this; nothing then restricts the stores but their being internal.
networkPolicy:
  enabled: true
  # [{namespaceSelector: {matchLabels: {...}}, podSelector: {matchLabels: {...}}}] - the same shape as a NetworkPolicy
  # "from" entry. For an operator routed straight to a store, name its namespace and its pod label, for example:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: operators}}
  #     podSelector: {matchLabels: {app.kubernetes.io/name: continuum-regional-operator}}
  allowedIngress: []
