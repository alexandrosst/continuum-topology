{{- if .Values.grafana.enabled }}
{{- $g := .Values.grafana }}
{{- $name := printf "%s-grafana" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "grafana") }}
{{- $admin := printf "%s-admin" $name }}
# The password of Grafana's built-in `admin`. Nobody is meant to use it: the Ikhnos server signs people in through the
# proxy header and basic auth is off below. It is random so that the account is not admin:admin if that is ever
# reached some other way, and it is carried forward on upgrade (as the central gateway's Secret is) so a `helm upgrade`
# does not change what the Grafana database was seeded with. Under `helm template`, where `lookup` answers nothing, it is
# drawn again on each render; that is harmless because Grafana reads it only when it first creates its database.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $admin }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
{{- $live := lookup "v1" "Secret" .Release.Namespace $admin }}
data:
  {{- if and $live $live.data (hasKey $live.data "admin-password") }}
  admin-password: {{ index $live.data "admin-password" }}
  {{- else }}
  admin-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector: {{- $sel | nindent 4 }}
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ include "fusion.replicas" (dict "root" . "kind" "StatefulSet" "name" $name) }}
  serviceName: {{ $name }}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- $sel | nindent 8 }}
        app.kubernetes.io/part-of: continuum
        {{- include "fusion.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (include (print $.Template.BasePath "/grafana-config.yaml") .) (include "fusion.arrivingDashboard" .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "fusion.podCommon" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ include "fusion.image" (dict "image" $g.image "component" "grafana") | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy | default "IfNotPresent" }}
          env:
            # Reached only through the Ikhnos server, which has already signed the person in and says who they are in
            # X-WEBAUTH-USER; there is no login page and no anonymous access. The NetworkPolicy keeps every other pod away.
            # Basic auth is off because Grafana's built-in admin would otherwise answer to it from any pod that reaches the
            # Service; with it off, a request is accepted only on the proxy header. The server sends that header as
            # `ikhnos-<username>`, so no signed-in person can ever be Grafana's own `admin` (the proxy would take the
            # header's value as that account). Nothing here names a user for that reason: auto sign-up creates them.
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $admin }}, key: admin-password}
            - {name: GF_AUTH_PROXY_ENABLED, value: "true"}
            - {name: GF_AUTH_PROXY_HEADER_NAME, value: X-WEBAUTH-USER}
            - {name: GF_AUTH_PROXY_HEADER_PROPERTY, value: username}
            - {name: GF_AUTH_PROXY_AUTO_SIGN_UP, value: "true"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_AUTO_ASSIGN_ORG_ROLE, value: {{ $g.role | quote }}}
            # Served under the server's own address, at /fusion/grafana/.
            - {name: GF_SERVER_ROOT_URL, value: "http://localhost:3000/fusion/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_SECURITY_CONTENT_SECURITY_POLICY, value: "true"}
            - {name: GF_SECURITY_COOKIE_SAMESITE, value: lax}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "false"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
            # Nothing phones home, nothing is published, nothing is installed from the internet.
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PUBLIC_DASHBOARDS_ENABLED, value: "false"}
            - {name: GF_SNAPSHOTS_EXTERNAL_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
            - {name: GF_LIVE_MAX_CONNECTIONS, value: "0"}
            - {name: GF_LOG_MODE, value: console}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/{{ ternary "clusters" "arriving" .Values.prometheus.enabled }}.json}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap: {name: {{ $name }}-provisioning}
        - name: dashboards
          configMap: {name: {{ $name }}-dashboards}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ $g.storage | quote }}}
  {{- end }}
{{- end }}
