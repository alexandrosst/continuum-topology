{{- if .Values.loki.enabled }}
{{- $l := .Values.loki }}
{{- $name := printf "%s-loki" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "loki") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
data:
  loki.yaml: |
    # One process, one volume. Logs arrive pushed, over OTLP, on /otlp (a regional operator's OTLP/HTTP exporter
    # writes to /otlp/v1/logs).
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # OTLP carries most of a log's context as structured metadata; this must be on for the OTLP endpoint.
      allow_structured_metadata: true
      retention_period: {{ $l.retention }}
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
{{- end }}
