{{- if .Values.central.enabled }}
{{- $name := include "fusion.central" . }}
{{- $base := include "fusion.name" . }}
{{- $q := .Values.central.queue }}
{{- $d2c := .Values.central.deltaToCumulative }}
{{- /* Metrics only reach Prometheus, so without it there is no metrics pipeline for the processor to sit in. */ -}}
{{- $d2cOn := and $d2c.enabled .Values.prometheus.enabled }}
{{- $metricsProcessors := list "memory_limiter" "transform/provenance" }}
{{- if $d2cOn }}{{ $metricsProcessors = append $metricsProcessors "delta_to_cumulative" }}{{ end }}
{{- $metricsProcessors = append $metricsProcessors "batch" }}
# The central gateway: mTLS in, three stores out. It is a plain OpenTelemetry Collector - no Kubernetes API
# access, no state of its own - so turning it off loses nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: central
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      {{- if $q.persistent.enabled }}
      file_storage/queue:
        directory: /queue
      {{- end }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            tls: &tls
              cert_file: /receiver-tls/tls.crt
              key_file: /receiver-tls/tls.key
              client_ca_file: /receiver-tls/ca.crt
              # The server renews the gateway's certificate in place (see FusionControl.Renew); this is how a running
              # gateway picks the new one up without a restart.
              reload_interval: 1h
          http:
            endpoint: "0.0.0.0:4318"
            tls: *tls
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Where the data came from (continuum.org.id, continuum.cluster.id, continuum.operator.id, ...) is stamped as a
      # RESOURCE attribute by the agent and the regional operator, and that is the only place the stores and the
      # dashboards read it from. A sender that also writes a continuum.* attribute on a data point, a log record or a
      # span would otherwise land next to it as a second, conflicting value (a Prometheus label of the same name, a
      # second Loki structured-metadata entry), so those are dropped here. This does NOT authenticate the resource
      # level: any sender holding a certificate this gateway trusts can still claim any cluster there.
      transform/provenance:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_matching_keys(attributes, "^continuum\\..*")
        log_statements:
          - context: log
            statements:
              - delete_matching_keys(attributes, "^continuum\\..*")
        trace_statements:
          - context: span
            statements:
              - delete_matching_keys(attributes, "^continuum\\..*")
      {{- if $d2cOn }}
      # Prometheus ingests cumulative metrics only (a delta one is refused or dropped, depending on the version),
      # and a sender that exports delta temporality (some SDKs and statsd-style sources do) would otherwise lose its
      # metrics with nothing visible on the sending side. This adds the deltas up into cumulative series, in memory. It is stateful: every sample of a series
      # must reach the same instance, which holds because this gateway runs as ONE replica (central.yaml). A series
      # that stops arriving is forgotten after maxStale; a restart starts its running totals over. Cumulative metrics
      # pass through untouched. delta_to_cumulative is this processor's name in the pinned collector (0.160.0);
      # the older deltatocumulative is only a deprecated alias.
      delta_to_cumulative:
        max_stale: {{ $d2c.maxStale | quote }}
        max_streams: {{ $d2c.maxStreams }}
      {{- end }}
      # Explicit sizes: the default leaves a batch's maximum unbounded, and a batch past a store's request limit
      # (Loki and Tempo take 4 MiB by default) is rejected whole and retried until it is dropped.
      batch:
        timeout: {{ .Values.central.batch.timeout | quote }}
        send_batch_size: {{ .Values.central.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.central.batch.sendBatchMaxSize }}
    exporters:
      {{- if .Values.prometheus.enabled }}
      otlphttp/metrics:
        endpoint: {{ printf "http://%s-prometheus.%s.svc:9090/api/v1/otlp" $base .Release.Namespace | quote }}
        {{- include "fusion.centralExporterResilience" . | nindent 8 }}
      {{- end }}
      {{- if .Values.loki.enabled }}
      otlphttp/logs:
        endpoint: {{ printf "http://%s-loki.%s.svc:3100/otlp" $base .Release.Namespace | quote }}
        {{- include "fusion.centralExporterResilience" . | nindent 8 }}
      {{- end }}
      {{- if .Values.tempo.enabled }}
      otlp/traces:
        endpoint: {{ printf "%s-tempo.%s.svc:4317" $base .Release.Namespace | quote }}
        tls:
          insecure: true
        {{- include "fusion.centralExporterResilience" . | nindent 8 }}
      {{- end }}
    service:
      extensions: {{ ternary (list "health_check" "file_storage/queue") (list "health_check") $q.persistent.enabled | toJson }}
      pipelines:
        {{- if .Values.prometheus.enabled }}
        metrics:
          receivers: [otlp]
          processors: {{ $metricsProcessors | toJson }}
          exporters: [otlphttp/metrics]
        {{- end }}
        {{- if .Values.loki.enabled }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/provenance, batch]
          exporters: [otlphttp/logs]
        {{- end }}
        {{- if .Values.tempo.enabled }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/provenance, batch]
          exporters: [otlp/traces]
        {{- end }}
{{- end }}
