{{- if .Values.tempo.enabled }}
{{- $t := .Values.tempo }}
{{- $name := printf "%s-tempo" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "tempo") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  selector: {{- $sel | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: otlp-http, protocol: TCP}
    - {name: http, port: 3200, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: {{ include "fusion.replicas" (dict "root" . "kind" "StatefulSet" "name" $name) }}
  serviceName: {{ $name }}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- $sel | nindent 8 }}
        app.kubernetes.io/part-of: continuum
        {{- include "fusion.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/tempo-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "fusion.podCommon" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tempo
          image: {{ include "fusion.image" (dict "image" $t.image "component" "tempo") | quote }}
          imagePullPolicy: {{ $t.image.pullPolicy | default "IfNotPresent" }}
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: http, containerPort: 3200, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          # /ready goes red while the ingester starts or replays its log, which is not a reason to kill the pod.
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml $t.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ $t.storage | quote }}}
  {{- end }}
{{- end }}
