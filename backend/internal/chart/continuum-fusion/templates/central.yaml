{{- if .Values.central.enabled }}
{{- $c := .Values.central }}
{{- $name := include "fusion.central" . }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "central") }}
{{- $tls := include "fusion.centralTLSSecret" . }}
# Created empty and kept as it is found: the Ikhnos server puts the certificates in (by this exact name, which is why it
# is not configurable), and a later `helm upgrade` carries what is there forward instead of wiping it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: central
type: Opaque
{{- $live := lookup "v1" "Secret" .Release.Namespace $tls }}
{{- if and $live $live.data }}
data: {{- toYaml $live.data | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: central
  {{- with $c.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  {{- if and (eq $c.service.type "LoadBalancer") $c.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml $c.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector: {{- $sel | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, protocol: TCP}
    {{- if eq $c.service.type "ClusterIP" }}
    # Exposed, only the gRPC port is published: it is the one other clusters' operators use.
    - {name: otlp-http, port: 4318, targetPort: otlp-http, protocol: TCP}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: central
spec:
  replicas: {{ include "fusion.replicas" (dict "root" . "kind" "Deployment" "name" $name) }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- $sel | nindent 8 }}
        app.kubernetes.io/part-of: continuum
        {{- include "fusion.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/central-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "fusion.podCommon" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: {{ include "fusion.image" (dict "image" $c.image "component" "central") | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy | default "IfNotPresent" }}
          args: ["--config=/conf/otel-collector-config.yaml"]
          {{- $gml := include "fusion.gomemlimit" $c.resources }}
          {{- if $gml }}
          # 80% of the memory limit, so the Go runtime collects harder before the container is killed
          # (memory_limiter in the config is the other half of that).
          env:
            - name: GOMEMLIMIT
              value: {{ $gml | quote }}
          {{- end }}
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          resources: {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: receiver-tls, mountPath: /receiver-tls, readOnly: true}
            {{- if $c.queue.persistent.enabled }}
            - {name: queue, mountPath: /queue}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: receiver-tls
          secret: {secretName: {{ $tls }}}
        {{- if $c.queue.persistent.enabled }}
        # The root filesystem is read-only, so the persistent sending queue lives here: it survives a container
        # restart, not a rescheduled pod, and counts against the node's ephemeral storage.
        - name: queue
          emptyDir: {sizeLimit: {{ $c.queue.persistent.sizeLimit | quote }}}
        {{- end }}
{{- end }}
