{{- if .Values.prometheus.enabled }}
{{- $p := .Values.prometheus }}
{{- $name := printf "%s-prometheus" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "prometheus") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector: {{- $sel | nindent 4 }}
  ports:
    - {name: http, port: 9090, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ include "fusion.replicas" (dict "root" . "kind" "StatefulSet" "name" $name) }}
  serviceName: {{ $name }}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- $sel | nindent 8 }}
        app.kubernetes.io/part-of: continuum
        {{- include "fusion.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "fusion.podCommon" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ include "fusion.image" (dict "image" $p.image "component" "prometheus") | quote }}
          imagePullPolicy: {{ $p.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention }}
            {{- with include "fusion.prometheusRetentionSize" . }}
            # Whichever limit is reached first deletes the oldest blocks: the time above, or this size, which by
            # default is 85% of the volume (see fusion.prometheusRetentionSize) so a busy install cannot fill it.
            - --storage.tsdb.retention.size={{ . }}
            {{- end }}
            - --web.listen-address=:9090
            {{- with $p.webPrefix }}
            # Opened from the Ikhnos server at <server>/fusion/prometheus/, which strips that prefix before it reaches here:
            # the page must know the prefix to write its own links (external-url), and serve from the root (route-prefix).
            - --web.external-url=http://localhost:9090{{ . }}
            - --web.route-prefix=/
            {{- end }}
            # The receiver a regional operator's OTLP/HTTP exporter writes to: /api/v1/otlp/v1/metrics.
            - --web.enable-otlp-receiver
          ports:
            - {name: http, containerPort: 9090, protocol: TCP}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ $p.storage | quote }}}
  {{- end }}
{{- end }}
