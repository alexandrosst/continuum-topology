{{- if .Values.networkPolicy.enabled }}
# The stores are unauthenticated, so who may reach them is the only protection they have: this is on by default.
#
# One policy over the three stores of this release. Ingress only: a store's own egress needs nothing but its volume.
# Allowed in: the other pods of this release (the central gateway, Grafana, and - because it is installed in the same
# release - the Ikhnos server reading the shared API) and whatever allowedIngress names. The default allowedIngress is the
# regional operators, which can be pointed straight at a store; they are matched by the chart's own pod label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fusion.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: continuum-fusion
      app.kubernetes.io/instance: {{ .Release.Name }}
    # The stores only: the central gateway is the door in (it takes its callers from outside this release), and Grafana
    # has a policy of its own below.
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [prometheus, loki, tempo]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.allowedIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.grafana.enabled }}
---
# Grafana trusts whoever the Ikhnos server says is signed in (it has no login page of its own), so only this release's own
# pods - the server among them - may reach it. Nothing in allowedIngress applies here: a regional operator has no reason to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fusion.name" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: continuum-fusion
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.grafana.allowedIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
