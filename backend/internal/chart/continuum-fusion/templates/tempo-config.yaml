{{- if .Values.tempo.enabled }}
{{- $t := .Values.tempo }}
{{- $name := printf "%s-tempo" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "tempo") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    # One process, one volume. Spans arrive pushed, over OTLP.
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: {{ $t.retention }}
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
{{- end }}
