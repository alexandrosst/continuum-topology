{{- if .Values.tempo.enabled }}
{{- $t := .Values.tempo }}
{{- $name := printf "%s-tempo" (include "fusion.name" .) }}
{{- $sel := include "fusion.selector" (dict "root" . "component" "tempo") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fusion.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    # One process, one volume. Spans arrive pushed, over OTLP.
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        {{- if .Values.switch.managed }}
        block_retention: ${TEMPO_RETENTION}
        {{- else }}
        block_retention: {{ $t.retention }}
        {{- end }}
    # The API accepts ranges of up to 31 days (744h); a Tempo search stops at 7 days (168h) unless told otherwise.
    query_frontend:
      search:
        max_duration: 744h
{{- if $t.traceqlMetrics }}
    # What Grafana's Drilldown > Traces needs: rate, error and duration charts are TraceQL metrics queries, and Tempo answers
    # those from the metrics-generator's "local-blocks" processor. Without it every one of them fails with
    # "error finding generators in Querier.queryRangeRecent: empty ring". It keeps recent traces in a second, small store on
    # the same volume (flushed to the normal blocks, so older ranges are answered from there). Nothing is sent anywhere.
    # A TraceQL metrics query may span 3h by default; the dashboards and Drilldown ask for 6h, 24h and wider.
      metrics:
        max_duration: 24h
    metrics_generator:
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces
      processor:
        local_blocks:
          filter_server_spans: false
          flush_to_storage: true
    overrides:
      defaults:
        metrics_generator:
          processors: [local-blocks]
{{- end }}
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
{{- end }}
