{{- include "operator.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: continuum-regional-operator, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: continuum-regional-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: continuum
        {{- include "operator.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "operator.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: {{ include "operator.image" . | quote }}
          imagePullPolicy: {{ include "operator.imagePullPolicy" . }}
          args: ["--config=/conf/otel-collector-config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            {{- include "operator.exporterEnv" . | nindent 12 }}
            {{- include "operator.receiverAuthEnv" . | nindent 12 }}
            {{- if .Values.heartbeat.enabled }}
            {{- include "operator.heartbeatEnv" . | nindent 12 }}
            {{- end }}
            {{- $gml := include "operator.gomemlimit" .Values.resources }}
            {{- if $gml }}
            - name: GOMEMLIMIT
              value: {{ $gml | quote }}
            {{- end }}
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: {{ include "operator.healthPort" . }}, protocol: TCP}
            {{- if .Values.selfMetrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.selfMetrics.port }}, protocol: TCP}
            {{- end }}
          # health_check always on (see config.yaml); liveness fails only once the collector itself has
          # stopped answering, readiness the same but checked more eagerly and recovers faster - neither
          # knows whether the export destination is reachable, only that this process is alive and its
          # pipelines started.
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: {{ .Values.health.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.health.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.health.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: {{ .Values.health.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.health.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.health.readinessProbe.failureThreshold }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            {{- if .Values.receiver.tls.enabled }}
            - {name: receiver-tls, mountPath: /receiver-tls, readOnly: true}
            {{- end }}
            {{- with include "operator.exporterMtlsMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if and .Values.heartbeat.enabled .Values.heartbeat.tls.caSecretName }}
            - {name: heartbeat-ca, mountPath: /heartbeat-ca, readOnly: true}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: {{ include "operator.name" . }}-config}
        {{- if .Values.receiver.tls.enabled }}
        - name: receiver-tls
          secret: {secretName: {{ .Values.receiver.tls.secretName }}}
        {{- end }}
        {{- with include "operator.exporterMtlsVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if and .Values.heartbeat.enabled .Values.heartbeat.tls.caSecretName }}
        - name: heartbeat-ca
          secret: {secretName: {{ .Values.heartbeat.tls.caSecretName }}}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
