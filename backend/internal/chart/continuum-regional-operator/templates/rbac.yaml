{{- if include "operator.renewOn" . }}
# The cert-renew sidecar may get and update exactly the Secrets it renews (named, in this namespace): it cannot read any
# other Secret, list them, or create new ones. No ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.name" . }}-cert-renew
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ include "operator.renewSecretNames" . }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.name" . }}-cert-renew
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "operator.name" . }}-cert-renew}
subjects: [{kind: ServiceAccount, name: {{ include "operator.name" . }}, namespace: {{ .Release.Namespace }}}]
{{- end }}
