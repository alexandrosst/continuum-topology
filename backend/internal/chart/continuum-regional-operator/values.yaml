# continuum-regional-operator: a standalone OTel Collector that aggregates telemetry a set of Continuum
# agents' clusters already export (each cluster's own telemetry.export.otlp.endpoint is pointed at this
# operator's receiver, separately - see the operator's own install command for the exact command to run
# against each source cluster) and re-exports it to one destination below.
#
# Unlike continuum-agent, this chart does not dial the Continuum server by default: there is no
# server.address or enrollment here at all. Its only credential is the receiver bearer token it is
# installed with (minted once, when the operator is created) - checked when something exports into it,
# never on startup. The one exception is the opt-in `heartbeat` block below: with heartbeat.enabled true
# it sends a periodic, content-free "I am alive" request to the Continuum server, authenticated with a
# second, separate secret (never the receiver token). It is off unless you turn it on. It also
# needs no Kubernetes API access of its own (see serviceaccount.yaml): it only relays and re-processes
# telemetry that already arrived over OTLP, it never watches this cluster's own object graph the way
# continuum-agent's k8sattributes processor does.

replicaCount: 1

# The upstream OpenTelemetry Collector Contrib distribution - the same image continuum-agent's telemetry
# collectors run, for the same reason (this chart needs nothing beyond OTLP receive/process/export, which
# the community "contrib" distribution already covers).
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.160.0"
  digest: ""
  pullPolicy: ""

# Secrets (in the release namespace) that let the cluster pull the image from a private registry.
imagePullSecrets: []

# Where this operator sends whatever it aggregates: another regional operator's own receiver, or an
# observability backend directly. Required.
export:
  otlp:
    endpoint: ""    # host:port of the next hop, e.g. an observability backend's OTLP endpoint
    protocol: grpc  # grpc | http
    tls:
      insecure: false
      caFile: ""    # path to a CA bundle to mount and trust, if the destination's certificate isn't otherwise trusted
    # Same "point at a Secret you create yourself" convention as continuum-agent's telemetry.export.otlp.auth -
    # never put the header's value directly in values.yaml.
    auth:
      headerName: Authorization
      secretName: ""
      secretKey: token

# The inbound side: what each source cluster's own telemetry.export.otlp.endpoint is pointed at. Off by
# default in this file, but the operator's own install command always sets receiver.auth.enabled=true and
# points secretName at the token minted when the operator was created - every regional operator this
# server creates is installed with auth on, this default only matters if you hand-edit these values.
receiver:
  auth:
    enabled: false
    secretName: ""   # a Secret in this release's namespace, created outside this chart, holding the shared
                      # bearer token minted for this operator
    secretKey: token
  # TLS on the receiver itself - additive to receiver.auth above, not a replacement (defense in depth: one
  # proves the connection is encrypted and who signed the cert, the other proves a bearer token). Off by
  # default in this file, but the operator's own install command always sets this on with the certificate
  # minted alongside the operator (see CreateOperator/IssueOperatorReceiverTLS) - this default only
  # matters if you hand-edit these values or mint your own certificate some other way.
  tls:
    enabled: false
    secretName: ""   # a Secret in this release's namespace, created outside this chart, holding tls.crt,
                      # tls.key (this receiver's own server certificate) and ca.crt (the CA that signed
                      # both this certificate and, if mtls is on, whatever client certificate is presented)
    mtls: true        # when tls.enabled, also require and verify the exporting client's certificate
                       # against ca.crt in the same Secret - off (tls.enabled with mtls: false) accepts any
                       # client, encrypted but not authenticated by certificate, still checked by
                       # receiver.auth's bearer token if that is also on
  networkPolicy:
    enabled: false
    # Raw NetworkPolicy ingress "from" peer entries (namespaceSelector / podSelector / ipBlock) - the same
    # shape continuum-agent's telemetry.receiver.networkPolicy.allowedIngress uses.
    allowedIngress: []

# Processor-level controls, deliberately the same shape as continuum-agent's telemetry.processors so the
# same configuration UI works for both charts unmodified. memory_limiter is always rendered; the rest are
# opt-in/opt-out as documented per field. There is no telemetry.scope or k8sattributes equivalent here -
# this chart only relays and re-processes what already arrived, it does not interpret a Kubernetes object
# graph of its own.
processors:
  memoryLimiter:
    checkInterval: 1s
    limitPercentage: 80
    spikeLimitPercentage: 20
  resourceDetection:
    enabled: false
    detectors: [env, system]
    timeout: 5s
  redaction:
    enabled: true
    blockedKeyPatterns:
      - ".*token.*"
      - ".*password.*"
      - ".*secret.*"
      - ".*api[_-]?key.*"
      - ".*authorization.*"
      - ".*cookie.*"
  # Traces only. 100 (default) means no sampling.
  tracesSampling:
    percentage: 100
  # Escape hatch for anything not covered above: raw processor definitions merged into the collector
  # config's top-level "processors" map, and the names to reference (in this order) in every pipeline,
  # right after redaction and before batch. The same src/lib/processorCatalog.ts-driven editor that builds
  # these values for continuum-agent builds them for this chart too - see the values shape note above.
  extraProcessors: {}
  extraProcessorNames: []
  # Traces-only extras (tail_sampling, or anything else that only implements the traces processor
  # interface) - appended after extraProcessorNames, still before batch, in the traces pipeline only.
  extraTracesProcessorNames: []

# Health check for the collector process itself, independent of whatever it is relaying - the upstream
# otel/opentelemetry-collector-contrib image already ships the health_check extension for this (always
# wired into the generated config, see _telemetry.tpl). livenessProbe/readinessProbe below read from it.
health:
  port: 13133
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 4
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 2

# The collector's own metrics about itself (queue depth, dropped items, process memory) - separate from
# whatever telemetry this operator relays. A standard OTel Collector service.telemetry.metrics Prometheus
# reader. Off by default: it is one more open port on every operator pod, worth turning on once something
# is actually set up to scrape it.
selfMetrics:
  enabled: false
  port: 8888

# Heartbeat: OPT-IN, off by default. Everything above and below this block is unchanged by it - with
# heartbeat.enabled false this chart never contacts the Continuum server at all, exactly as before.
#
# When on, the collector probes its OWN health_check endpoint (the same one the liveness probe reads, on
# 127.0.0.1 inside the pod) every intervalSeconds with the httpcheck receiver, and a separate metrics
# pipeline - which nothing else feeds - POSTs that one result to heartbeat.url with its own otlphttp
# exporter. That is the entire message: the collector's own "httpcheck.status" (is my health endpoint
# answering 200), carrying no telemetry you relay, no logs, no traces, no cluster or workload data, and
# nothing from the export.* or receiver.* settings. The Continuum server throws the body away; all it
# records is that an authenticated request arrived, and when - which is what turns an operator's status
# in the UI into online/offline/last-seen. The existing receive-process-export pipelines are not touched.
#
# It uses its OWN credential (a heartbeat secret, minted separately in Continuum from the receiver bearer
# token and shown once), never the receiver token: that one authenticates traffic coming INTO this
# operator and must not be reused for a call going OUT. Continuum prints the exact `kubectl create secret`
# and `helm` flags to apply when you create the operator, or on demand from its heartbeat action.
heartbeat:
  enabled: false
  # The Continuum server's heartbeat address, e.g. https://continuum.example.com/api/v1/operator-heartbeat.
  # Required when enabled, and must be https:// (the secret is sent with every request) unless
  # allowPlainHTTP is set.
  url: ""
  # How often to report. The server counts an operator as online for three intervals after its last
  # heartbeat, calibrated to 60s, so this may be lowered (down to 10) but not raised above 60.
  intervalSeconds: 60
  # A Secret in this release's namespace, created outside this chart, holding the heartbeat secret as-is
  # (no "Bearer " prefix) - the same "point at a Secret you create yourself" convention as export.otlp.auth.
  auth:
    secretName: ""
    secretKey: token
  # The server's certificate is verified against the image's normal trust roots by default. If it is signed
  # by a private CA, put that CA's certificate in a Secret (key ca.crt by default - the same key name
  # continuum-agent's telemetry.export.otlp.tls.mtls.secretName and this chart's receiver.tls.secretName
  # use) and name it here; it is mounted read-only and used as the only trusted root for this one
  # connection. Verification is never turned off by anything in this chart.
  tls:
    caSecretName: ""
    caSecretKey: ca.crt
  # Permit a plain http:// url (a throwaway test server on a trusted network). The heartbeat secret then
  # crosses the network unencrypted; leave this false for anything real.
  allowPlainHTTP: false
  # If networkPolicy.egress.enabled is on, the heartbeat url's address and port must be in
  # networkPolicy.egress.allowedEgress as well - egress for the heartbeat is NOT added for you.

resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 384Mi}

tolerations: []
nodeSelector: {}
affinity: {}
podAnnotations: {}
podLabels: {}
priorityClassName: ""

# Egress lockdown for this operator's pod. Off by default: the right answer depends on your CNI and
# network, and a wrong policy silently cuts export off - same reasoning as continuum-agent's
# networkPolicy.telemetryEgress.
networkPolicy:
  egress:
    enabled: false
    allowedEgress: []   # [{cidr, ports}] matching where export.otlp.endpoint actually resolves to
    dnsCIDRs: []
    extraEgress: []
