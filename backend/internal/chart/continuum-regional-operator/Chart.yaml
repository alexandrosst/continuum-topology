apiVersion: v2
name: continuum-regional-operator
description: Standalone OTel Collector that aggregates telemetry already exported by a set of Ikhnos agents' clusters and re-exports it to one destination. By default it never dials the Ikhnos server. What it checks is inbound only, namely the mTLS client certificate, signed by this operator's own private CA, that each source cluster presents (the only gate for operators Ikhnos creates today) or, for older operators, a receiver bearer token. With the opt-in heartbeat.enabled it also sends a periodic liveness check (its own health endpoint's result, no telemetry) to the Ikhnos server, authenticated by a separate heartbeat secret.
type: application
version: 0.1.0
appVersion: "0.1.0-dev"
