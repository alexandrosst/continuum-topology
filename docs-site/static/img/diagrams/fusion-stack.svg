<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" font-family="Inter, 'Segoe UI', ui-sans-serif, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="marker-f68330" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f68330"/>
    </marker>
    <marker id="marker-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="marker-8a97a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="670" fill="#16181a"/>

  <!-- Left: other clusters -->
  <rect x="20" y="60" width="210" height="370" rx="14" fill="#25282c" stroke="#3f444b" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#e4e7e9">Other clusters</text>
  <text x="40" y="104" font-size="9" fill="#59636c">each already fans in its own nodes</text>

  <rect x="40" y="124" width="170" height="92" rx="10" fill="#1f2124" stroke="#f68330" stroke-width="1.3"/>
  <text x="125" y="148" font-size="11" font-weight="700" fill="#e4e7e9" text-anchor="middle">regional operator</text>
  <text x="125" y="166" font-size="9" fill="#8a97a2" text-anchor="middle">destination: FUSION</text>
  <text x="125" y="184" font-size="8.4" fill="#59636c" text-anchor="middle">client certificate from</text>
  <text x="125" y="197" font-size="8.4" fill="#59636c" text-anchor="middle">the operator's own CA</text>

  <rect x="40" y="250" width="170" height="92" rx="10" fill="#1f2124" stroke="#f68330" stroke-width="1.3"/>
  <text x="125" y="274" font-size="11" font-weight="700" fill="#e4e7e9" text-anchor="middle">regional operator</text>
  <text x="125" y="292" font-size="9" fill="#8a97a2" text-anchor="middle">destination: FUSION</text>
  <text x="125" y="310" font-size="8.4" fill="#59636c" text-anchor="middle">client certificate from</text>
  <text x="125" y="323" font-size="8.4" fill="#59636c" text-anchor="middle">the operator's own CA</text>

  <!-- Left bottom: API consumer -->
  <rect x="20" y="450" width="210" height="150" rx="14" fill="#25282c" stroke="#3f444b" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="40" y="478" font-size="13" font-weight="700" fill="#e4e7e9">A reader</text>
  <text x="40" y="494" font-size="9" fill="#59636c">another system, or an administrator</text>
  <rect x="40" y="508" width="170" height="52" rx="10" fill="#1f2124" stroke="#34d399" stroke-width="1.3"/>
  <text x="125" y="530" font-size="10" font-weight="700" fill="#e4e7e9" text-anchor="middle">decision engine, script</text>
  <text x="125" y="546" font-size="8.4" fill="#59636c" text-anchor="middle">holds a cnf_… token</text>

  <!-- Server cluster panel -->
  <rect x="290" y="60" width="690" height="540" rx="14" fill="#25282c" stroke="#3f444b" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="314" y="88" font-size="13" font-weight="700" fill="#e4e7e9">The server's cluster: one Helm release (continuum-server)</text>
  <text x="314" y="104" font-size="9" fill="#59636c">the FUSION workloads ship in that release, switched off (0 replicas) until FUSION is enabled</text>

  <!-- central operator -->
  <rect x="330" y="150" width="220" height="130" rx="12" fill="#1f2124" stroke="#f68330" stroke-width="1.5"/>
  <text x="440" y="176" font-size="12" font-weight="700" fill="#e4e7e9" text-anchor="middle">central operator</text>
  <text x="440" y="192" font-size="8.6" fill="#59636c" text-anchor="middle">the one door into FUSION</text>
  <rect x="348" y="206" width="184" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="440" y="223" font-size="8.8" font-weight="600" fill="#f68330" text-anchor="middle">OTLP/gRPC receiver · :4317</text>
  <rect x="348" y="240" width="184" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="440" y="257" font-size="8.8" font-weight="600" fill="#f68330" text-anchor="middle">mTLS: trusts the org CA only</text>

  <!-- stores -->
  <rect x="640" y="124" width="310" height="290" rx="12" fill="#1f2124" stroke="#f68330" stroke-width="1.5"/>
  <text x="795" y="150" font-size="12" font-weight="700" fill="#e4e7e9" text-anchor="middle">FUSION stores</text>
  <text x="795" y="166" font-size="8.6" fill="#59636c" text-anchor="middle">ClusterIP only · volumes kept when switched off</text>
  <rect x="660" y="184" width="270" height="62" rx="8" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="795" y="208" font-size="10" font-weight="700" fill="#f68330" text-anchor="middle">Prometheus · metrics</text>
  <text x="795" y="226" font-size="8.6" fill="#59636c" text-anchor="middle">:9090</text>
  <rect x="660" y="258" width="270" height="62" rx="8" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="795" y="282" font-size="10" font-weight="700" fill="#f68330" text-anchor="middle">Loki · logs</text>
  <text x="795" y="300" font-size="8.6" fill="#59636c" text-anchor="middle">:3100</text>
  <rect x="660" y="332" width="270" height="62" rx="8" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="795" y="356" font-size="10" font-weight="700" fill="#f68330" text-anchor="middle">Tempo · traces</text>
  <text x="795" y="374" font-size="8.6" fill="#59636c" text-anchor="middle">:3200</text>

  <!-- server -->
  <rect x="330" y="440" width="220" height="130" rx="12" fill="#1f2124" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="466" font-size="12" font-weight="700" fill="#e4e7e9" text-anchor="middle">Ikhnos server</text>
  <text x="440" y="486" font-size="8.8" fill="#8a97a2" text-anchor="middle">FUSION switch (scale up / down)</text>
  <text x="440" y="504" font-size="8.8" fill="#8a97a2" text-anchor="middle">shared API  /api/v1/fusion/*</text>
  <text x="440" y="522" font-size="8.8" fill="#8a97a2" text-anchor="middle">tokens: signals · namespaces · clusters</text>
  <text x="440" y="546" font-size="8.2" fill="#59636c" text-anchor="middle">never sees telemetry in transit</text>

  <!-- arrows: regional operators -> central operator (mTLS) -->
  <path d="M210,170 C260,170 280,200 330,205" fill="none" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
  <path d="M210,296 C260,296 280,250 330,245" fill="none" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
  <text x="125" y="372" font-size="8.8" font-weight="600" fill="#f68330" text-anchor="middle">gRPC over mutual TLS to an</text>
  <text x="125" y="385" font-size="8.8" font-weight="600" fill="#f68330" text-anchor="middle">address you expose:</text>
  <text x="125" y="400" font-size="8.2" fill="#59636c" text-anchor="middle">LoadBalancer, NodePort or your Ingress</text>

  <!-- central operator -> stores -->
  <line x1="550" y1="215" x2="638" y2="215" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
  <text x="594" y="205" font-size="8.6" fill="#59636c" text-anchor="middle">writes</text>

  <!-- server -> stores (reads) -->
  <path d="M550,500 C720,500 795,470 795,416" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
  <text x="700" y="520" font-size="8.8" font-weight="600" fill="#34d399" text-anchor="middle">reads over HTTP, inside the cluster</text>
  <text x="700" y="534" font-size="8.2" fill="#59636c" text-anchor="middle">network policy: only :9090 · :3100 · :3200</text>

  <!-- server -> central operator (control) -->
  <line x1="440" y1="438" x2="440" y2="284" stroke="#8a97a2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#marker-8a97a2)"/>
  <text x="452" y="350" font-size="8.8" font-weight="600" fill="#8a97a2">Enable / Disable</text>
  <text x="452" y="363" font-size="8.2" fill="#59636c">scales all four workloads 0 ↔ 1</text>
  <text x="452" y="376" font-size="8.2" fill="#59636c">(a namespaced Role, nothing more)</text>

  <!-- reader -> server -->
  <line x1="210" y1="534" x2="328" y2="510" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
  <text x="125" y="578" font-size="8.4" fill="#59636c" text-anchor="middle">Authorization: Bearer cnf_…</text>
  <text x="125" y="591" font-size="8.4" fill="#59636c" text-anchor="middle">read-only, scoped, server to server</text>

  <!-- legend -->
  <line x1="300" y1="632" x2="330" y2="632" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
  <text x="338" y="635" font-size="9" fill="#8a97a2">telemetry going in</text>
  <line x1="450" y1="632" x2="480" y2="632" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
  <text x="488" y="635" font-size="9" fill="#8a97a2">reading it back</text>
  <line x1="590" y1="632" x2="620" y2="632" stroke="#8a97a2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#marker-8a97a2)"/>
  <text x="628" y="635" font-size="9" fill="#8a97a2">control: switching it on or off</text>
</svg>
