<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" font-family="Inter, 'Segoe UI', ui-sans-serif, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="accent-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f68330" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f68330" stop-opacity="0.25"/>
    </linearGradient>
    
    <marker id="marker-f68330" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f68330"/>
    </marker>
    <marker id="marker-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="marker-c084fc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="650" fill="#16181a"/>
  <text x="490.0" y="34" font-size="16" font-weight="700" fill="#e4e7e9" text-anchor="middle">Exposing the agent port (:8443, mutual TLS)</text>
<text x="490.0" y="54" font-size="11.5" font-weight="400" fill="#8a97a2" text-anchor="middle">the TLS handshake must reach the pod untouched — never terminate it at a proxy</text>
<rect x="22.0" y="84" width="296" height="430" rx="14" fill="#1f2124" stroke="#f68330" stroke-width="1.6" filter="url(#soft-shadow)"/>
<rect x="40.0" y="102" width="73" height="22" rx="11.0" fill="none" stroke="#f68330" stroke-width="1.2"/>
<text x="76.5" y="116.85" font-size="11" font-weight="700" fill="#f68330" text-anchor="middle">Default</text>
<text x="40.0" y="146" font-size="12.5" font-weight="700" fill="#e4e7e9" text-anchor="start">agent.service.type: LoadBalancer</text>
<text x="40.0" y="164" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">Cloud gives you an external IP</text>
<text x="40.0" y="179" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">or hostname automatically.</text>
<g transform="translate(162.125,207.075) scale(1.05)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
      <path d="M4.8,8.2 6.6,10 10.2,6"/></g>
<text x="170.0" y="244" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">agent</text>
<rect x="52.0" y="267.0" width="236" height="54" rx="10" fill="#25282c" stroke="#f68330" stroke-width="1.3"/>
<text x="170.0" y="298" font-size="10.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">cloud load balancer</text>
<g transform="translate(160.8,361.65) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="14" height="6" rx="1.3"/><rect x="1" y="11" width="14" height="6" rx="1.3"/>
      <circle cx="4.2" cy="4" r="0.9" fill="#f68330" stroke="none"/><circle cx="4.2" cy="14" r="0.9" fill="#f68330" stroke="none"/></g>
<text x="170.0" y="398" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">server pod :8443</text>
<line x1="170.0" y1="228" x2="170.0" y2="267.0" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
<line x1="170.0" y1="321.0" x2="170.0" y2="358" stroke="#f68330" stroke-width="1.8" marker-end="url(#marker-f68330)"/>
<text x="216.0" y="245.5" font-size="9.5" font-weight="700" fill="#f68330" text-anchor="middle">TLS</text>
<text x="216.0" y="343.5" font-size="9.5" font-weight="700" fill="#f68330" text-anchor="middle">unbroken</text>
<line x1="40.0" y1="412" x2="300.0" y2="412" stroke="#2b2f33" stroke-width="1"/>
<text x="40.0" y="430" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">Best on a managed cloud cluster (EKS,</text>
<text x="40.0" y="444" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">GKE, AKS, ...). Stuck on &lt;pending&gt;? No</text>
<text x="40.0" y="458" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">load-balancer controller — use NodePort</text>
<text x="40.0" y="472" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">or install MetalLB.</text>
<rect x="342.0" y="84" width="296" height="430" rx="14" fill="#1f2124" stroke="#34d399" stroke-width="1.6" filter="url(#soft-shadow)"/>
<rect x="360.0" y="102" width="122" height="22" rx="11.0" fill="none" stroke="#34d399" stroke-width="1.2"/>
<text x="421.0" y="116.85" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Works anywhere</text>
<text x="360.0" y="146" font-size="12.5" font-weight="700" fill="#e4e7e9" text-anchor="start">agent.service.type: NodePort</text>
<text x="360.0" y="164" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">Reachable on every node,</text>
<text x="360.0" y="179" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">at a fixed port you choose.</text>
<g transform="translate(482.125,207.075) scale(1.05)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
      <path d="M4.8,8.2 6.6,10 10.2,6"/></g>
<text x="490.0" y="244" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">agent</text>
<rect x="372.0" y="267.0" width="236" height="54" rx="10" fill="#25282c" stroke="#34d399" stroke-width="1.3"/>
<text x="490.0" y="298" font-size="10.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">NodePort on every node</text>
<g transform="translate(480.8,361.65) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="14" height="6" rx="1.3"/><rect x="1" y="11" width="14" height="6" rx="1.3"/>
      <circle cx="4.2" cy="4" r="0.9" fill="#f68330" stroke="none"/><circle cx="4.2" cy="14" r="0.9" fill="#f68330" stroke="none"/></g>
<text x="490.0" y="398" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">server pod :8443</text>
<line x1="490.0" y1="228" x2="490.0" y2="267.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
<line x1="490.0" y1="321.0" x2="490.0" y2="358" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
<text x="536.0" y="245.5" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">TLS</text>
<text x="536.0" y="343.5" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">unbroken</text>
<line x1="360.0" y1="412" x2="620.0" y2="412" stroke="#2b2f33" stroke-width="1"/>
<text x="360.0" y="430" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">Best for a local trial (k3s, kind,</text>
<text x="360.0" y="444" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">minikube) or any cluster without a load</text>
<text x="360.0" y="458" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">balancer. Point agents at a node's IP.</text>
<rect x="662.0" y="84" width="296" height="430" rx="14" fill="#1f2124" stroke="#c084fc" stroke-width="1.6" filter="url(#soft-shadow)"/>
<rect x="680.0" y="102" width="80" height="22" rx="11.0" fill="none" stroke="#c084fc" stroke-width="1.2"/>
<text x="720.0" y="116.85" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Advanced</text>
<text x="680.0" y="146" font-size="12.5" font-weight="700" fill="#e4e7e9" text-anchor="start">agent.tlsRoute (TLS passthrough)</text>
<text x="680.0" y="164" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">Shares port 443 with other</text>
<text x="680.0" y="179" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">apps behind one Gateway.</text>
<g transform="translate(802.125,207.075) scale(1.05)" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
      <path d="M4.8,8.2 6.6,10 10.2,6"/></g>
<text x="810.0" y="244" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">agent</text>
<rect x="692.0" y="267.0" width="236" height="54" rx="10" fill="#25282c" stroke="#c084fc" stroke-width="1.3"/>
<text x="810.0" y="298" font-size="10.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">Gateway (TLSRoute)</text>
<g transform="translate(800.8,361.65) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="14" height="6" rx="1.3"/><rect x="1" y="11" width="14" height="6" rx="1.3"/>
      <circle cx="4.2" cy="4" r="0.9" fill="#f68330" stroke="none"/><circle cx="4.2" cy="14" r="0.9" fill="#f68330" stroke="none"/></g>
<text x="810.0" y="398" font-size="10.5" font-weight="600" fill="#8a97a2" text-anchor="middle">server pod :8443</text>
<line x1="810.0" y1="228" x2="810.0" y2="267.0" stroke="#c084fc" stroke-width="1.8" marker-end="url(#marker-c084fc)"/>
<line x1="810.0" y1="321.0" x2="810.0" y2="358" stroke="#c084fc" stroke-width="1.8" marker-end="url(#marker-c084fc)"/>
<text x="856.0" y="245.5" font-size="9.5" font-weight="700" fill="#c084fc" text-anchor="middle">TLS</text>
<text x="856.0" y="343.5" font-size="9.5" font-weight="700" fill="#c084fc" text-anchor="middle">unbroken</text>
<line x1="680.0" y1="412" x2="940.0" y2="412" stroke="#2b2f33" stroke-width="1"/>
<text x="680.0" y="430" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">Requires the Gateway's listener to be</text>
<text x="680.0" y="444" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">in Passthrough mode. Skipping that</text>
<text x="680.0" y="458" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">silently breaks the handshake — easy to</text>
<text x="680.0" y="472" font-size="9.8" font-weight="400" fill="#59636c" text-anchor="start">miss.</text>
<rect x="22.0" y="544" width="936" height="66" rx="10" fill="#25282c" stroke="#2b2f33" stroke-width="1"/>
<g transform="translate(45.2,567.4) scale(1.2)" fill="none" stroke="#8a97a2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="16" height="11" rx="1.5"/><path d="M6 16h6M9 12v4"/></g>
<text x="84.0" y="570" font-size="12" font-weight="700" fill="#e4e7e9" text-anchor="start">Meanwhile, the admin port (UI + API, :8080) is a separate concern.</text>
<text x="84.0" y="588" font-size="10.5" font-weight="400" fill="#8a97a2" text-anchor="start">Plain HTTP inside the pod — put it behind a Gateway that terminates TLS, or set admin.tls yourself.</text>
</svg>