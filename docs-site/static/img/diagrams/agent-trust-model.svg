<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Inter, 'Segoe UI', ui-sans-serif, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="accent-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f68330" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f68330" stop-opacity="0.25"/>
    </linearGradient>
    
    <marker id="marker-8a97a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a2"/>
    </marker>
    <marker id="marker-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#16181a"/>
  <rect x="40" y="90" width="272" height="178" rx="14" fill="#1f2124" stroke="#f68330" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="66" cy="116" r="15" fill="#25282c" stroke="#f68330" stroke-width="1.6"/>
<text x="66" y="121" font-size="13" font-weight="700" fill="#f68330" text-anchor="middle">1</text>
<g transform="translate(271.65,108.8) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="16" height="11" rx="1.5"/><path d="M6 16h6M9 12v4"/></g>
<text x="60" y="152" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">You click “Connect a cluster”</text>
<text x="60" y="174" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">In the Continuum UI. Nothing</text>
<text x="60" y="191" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">on the cluster side exists yet.</text>
<rect x="354" y="90" width="272" height="178" rx="14" fill="#1f2124" stroke="#f68330" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="380" cy="116" r="15" fill="#25282c" stroke="#f68330" stroke-width="1.6"/>
<text x="380" y="121" font-size="13" font-weight="700" fill="#f68330" text-anchor="middle">2</text>
<g transform="translate(585.65,109.95) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1,5 a2,2 0 0 0 0,4 v3 a1.4,1.4 0 0 0 1.4,1.4 h13.2 A1.4,1.4 0 0 0 17,12 V9 a2,2 0 0 1 0,-4 V2.4 A1.4,1.4 0 0 0 15.6,1 H2.4 A1.4,1.4 0 0 0 1,2.4 Z"/>
      <path d="M7,1 v13" stroke-dasharray="2 2"/></g>
<text x="374" y="152" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">Server mints a one-time token</text>
<text x="374" y="174" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">...and prints a ready-to-run</text>
<text x="374" y="191" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">helm install command with its</text>
<text x="374" y="208" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">CA pin already baked in.</text>
<rect x="668" y="90" width="272" height="178" rx="14" fill="#1f2124" stroke="#8a97a2" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="694" cy="116" r="15" fill="#25282c" stroke="#8a97a2" stroke-width="1.6"/>
<text x="694" y="121" font-size="13" font-weight="700" fill="#8a97a2" text-anchor="middle">3</text>
<g transform="translate(899.65,108.8) scale(1.15)" fill="none" stroke="#8a97a2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="16" height="14" rx="1.6"/><path d="M4.2,6 7,8.5 4.2,11 M9.5,11 h4.5"/></g>
<text x="688" y="152" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">You run the printed command</text>
<text x="688" y="174" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">helm install continuum-agent</text>
<text x="688" y="191" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">in the target cluster. Nothing</text>
<text x="688" y="208" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">to fill in by hand.</text>
<rect x="668" y="320" width="272" height="178" rx="14" fill="#1f2124" stroke="#34d399" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="694" cy="346" r="15" fill="#25282c" stroke="#34d399" stroke-width="1.6"/>
<text x="694" y="351" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">4</text>
<g transform="translate(901.375,338.225) scale(1.15)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
      <path d="M4.8,8.2 6.6,10 10.2,6"/></g>
<text x="688" y="382" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">Agent dials out, checks the pin</text>
<text x="688" y="404" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">The agent connects to :8443</text>
<text x="688" y="421" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">and verifies the server's cert</text>
<text x="688" y="438" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">against the pinned CA hash.</text>
<rect x="354" y="320" width="272" height="178" rx="14" fill="#1f2124" stroke="#34d399" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="380" cy="346" r="15" fill="#25282c" stroke="#34d399" stroke-width="1.6"/>
<text x="380" y="351" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">5</text>
<g transform="translate(587.95,338.8) scale(1.15)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="7" width="12" height="8" rx="1.6"/><path d="M3.5,7 V4.5 a3.5,3.5 0 0 1 7,0 V7"/></g>
<text x="374" y="382" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">Server signs the agent a cert</text>
<text x="374" y="404" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">The one-time token is redeemed</text>
<text x="374" y="421" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">once, then invalidated. The CA</text>
<text x="374" y="438" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">issues a real client certificate.</text>
<rect x="40" y="320" width="272" height="178" rx="14" fill="#1f2124" stroke="#f68330" stroke-width="1.6" filter="url(#soft-shadow)"/>
<circle cx="66" cy="346" r="15" fill="#25282c" stroke="#f68330" stroke-width="1.6"/>
<text x="66" y="351" font-size="13" font-weight="700" fill="#f68330" text-anchor="middle">6</text>
<g transform="translate(273.375,338.225) scale(1.15)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
      <path d="M4.8,8.2 6.6,10 10.2,6"/></g>
<text x="60" y="382" font-size="13" font-weight="700" fill="#e4e7e9" text-anchor="start">Every connection after: mutual TLS</text>
<text x="60" y="404" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">Both sides present certificates.</text>
<text x="60" y="421" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">No shared secret sits on disk,</text>
<text x="60" y="438" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">no inbound rule on your firewall.</text>
<line x1="312" y1="179.0" x2="354" y2="179.0" stroke="#8a97a2" stroke-width="1.8" marker-end="url(#marker-8a97a2)"/>
<line x1="626" y1="179.0" x2="668" y2="179.0" stroke="#8a97a2" stroke-width="1.8" marker-end="url(#marker-8a97a2)"/>
<line x1="804.0" y1="268" x2="804.0" y2="320" stroke="#8a97a2" stroke-width="1.8" marker-end="url(#marker-8a97a2)"/>
<line x1="668" y1="409.0" x2="626" y2="409.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
<line x1="354" y1="409.0" x2="312" y2="409.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#marker-34d399)"/>
<text x="490.0" y="538" font-size="11.5" font-weight="500" fill="#59636c" text-anchor="middle">read left → right, then wrap down and read right → left</text>
</svg>