<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Inter, 'Segoe UI', ui-sans-serif, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="marker-8a97a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a2"/>
    </marker>
    <marker id="marker-f68330" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f68330"/>
    </marker>
    <marker id="marker-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="marker-59636c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="760" fill="#16181a"/>

  <!-- Panel: two clusters already fanning in on their own, feeding one regional operator -->
  <rect x="20" y="20" width="940" height="430" rx="14" fill="#25282c" stroke="#3f444b" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="44" y="52" font-size="14" font-weight="700" fill="#e4e7e9" text-anchor="start">A second, explicit fan-in above the first</text>
  <text x="44" y="70" font-size="9.5" font-weight="400" fill="#59636c" text-anchor="start">each cluster's own DaemonSet + Deployment fan-in already exists — this is the new tier above it</text>

  <!-- cluster A -->
  <g>
    <rect x="60" y="96" width="260" height="120" rx="12" fill="#1f2124" stroke="#34d399" stroke-width="1.3"/>
    <text x="190" y="118" font-size="11.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">cluster-a</text>
    <text x="190" y="136" font-size="8.6" font-weight="400" fill="#59636c" text-anchor="middle">approved agent · telemetry.* on</text>
    <rect x="78" y="150" width="224" height="46" rx="8" fill="none" stroke="#34d399" stroke-width="1.1"/>
    <text x="190" y="168" font-size="8.8" font-weight="600" fill="#34d399" text-anchor="middle">cluster collector (Deployment)</text>
    <text x="190" y="184" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">already the fan-in point for every node</text>
  </g>

  <!-- cluster B -->
  <g>
    <rect x="60" y="234" width="260" height="120" rx="12" fill="#1f2124" stroke="#34d399" stroke-width="1.3"/>
    <text x="190" y="256" font-size="11.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">cluster-b</text>
    <text x="190" y="274" font-size="8.6" font-weight="400" fill="#59636c" text-anchor="middle">approved agent · telemetry.* on</text>
    <rect x="78" y="288" width="224" height="46" rx="8" fill="none" stroke="#34d399" stroke-width="1.1"/>
    <text x="190" y="306" font-size="8.8" font-weight="600" fill="#34d399" text-anchor="middle">cluster collector (Deployment)</text>
    <text x="190" y="322" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">already the fan-in point for every node</text>
  </g>

  <text x="190" y="392" font-size="9" font-weight="400" fill="#59636c" text-anchor="middle">SourceClusterIDs: named by hand,</text>
  <text x="190" y="406" font-size="9" font-weight="400" fill="#59636c" text-anchor="middle">re-checked against currently-approved agents</text>

  <!-- arrows from clusters into regional operator -->
  <path d="M320,156 C420,156 420,270 508,270" fill="none" stroke="#f68330" stroke-width="1.6" marker-end="url(#marker-f68330)"/>
  <path d="M320,294 C420,294 420,282 508,282" fill="none" stroke="#f68330" stroke-width="1.6" marker-end="url(#marker-f68330)"/>

  <!-- regional operator box -->
  <rect x="510" y="140" width="260" height="270" rx="12" fill="#1f2124" stroke="#f68330" stroke-width="1.6"/>
  <text x="640" y="164" font-size="12" font-weight="700" fill="#e4e7e9" text-anchor="middle">regional operator</text>
  <text x="640" y="180" font-size="8.4" font-weight="400" fill="#59636c" text-anchor="middle">no RBAC · no server channel · new this release</text>

  <rect x="528" y="196" width="224" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="640" y="213" font-size="8.6" font-weight="600" fill="#f68330" text-anchor="middle">otlp receiver (bearer token)</text>
  <rect x="528" y="228" width="224" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="640" y="245" font-size="8.6" font-weight="600" fill="#f68330" text-anchor="middle">memory_limiter</text>
  <rect x="528" y="260" width="224" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="640" y="277" font-size="8.6" font-weight="600" fill="#f68330" text-anchor="middle">resourcedetection / redaction</text>
  <rect x="528" y="292" width="224" height="26" rx="6" fill="none" stroke="#f68330" stroke-width="1.1"/>
  <text x="640" y="309" font-size="8.6" font-weight="600" fill="#f68330" text-anchor="middle">batch</text>
  <text x="640" y="336" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">same processor ordering as</text>
  <text x="640" y="349" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">continuum-agent's own collectors</text>
  <text x="640" y="366" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">— no k8sattributes, nothing to</text>
  <text x="640" y="379" font-size="7.8" font-weight="400" fill="#59636c" text-anchor="middle">attach identity from here</text>

  <!-- arrow onward to destination -->
  <line x1="770" y1="230" x2="908" y2="230" stroke="#f68330" stroke-width="1.6" marker-end="url(#marker-f68330)"/>
  <rect x="800" y="140" width="140" height="60" rx="10" fill="#1f2124" stroke="#f68330" stroke-width="1.4"/>
  <text x="870" y="164" font-size="10.5" font-weight="700" fill="#e4e7e9" text-anchor="middle">destination</text>
  <text x="870" y="182" font-size="8.2" font-weight="400" fill="#59636c" text-anchor="middle">external OTLP endpoint</text>

  <!-- ghost chained operator, dashed -->
  <line x1="770" y1="330" x2="800" y2="360" stroke="#59636c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#marker-59636c)"/>
  <rect x="800" y="340" width="140" height="80" rx="10" fill="none" stroke="#59636c" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="870" y="366" font-size="9.5" font-weight="700" fill="#8a97a2" text-anchor="middle">another regional</text>
  <text x="870" y="380" font-size="9.5" font-weight="700" fill="#8a97a2" text-anchor="middle">operator</text>
  <text x="870" y="400" font-size="7.6" font-weight="400" fill="#59636c" text-anchor="middle">not supported</text>
  <text x="870" y="412" font-size="7.6" font-weight="400" fill="#59636c" text-anchor="middle">in this release</text>

  <!-- bottom strip: mechanism only -->
  <rect x="20" y="474" width="940" height="130" rx="14" fill="#1f2124" stroke="#f68330" stroke-width="2" filter="url(#soft-shadow)"/>
  <g transform="translate(44,496) scale(1.5)" fill="none" stroke="#f68330" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5,1 13.5,3.2 V8 C13.5,12 10.7,14.7 7.5,16 C4.3,14.7 1.5,12 1.5,8 V3.2 Z"/>
    <path d="M4.8,8.2 6.6,10 10.2,6"/>
  </g>
  <text x="80" y="508" font-size="15" font-weight="700" fill="#e4e7e9" text-anchor="start">Mechanism only, not decision-making</text>
  <text x="80" y="528" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">Creating an operator returns an install command, a receiver-secret command, and one reminder line per</text>
  <text x="80" y="546" font-size="11" font-weight="400" fill="#8a97a2" text-anchor="start">source cluster — nothing is applied to any cluster on the caller's behalf, and nothing reassigns itself later.</text>
  <text x="80" y="564" font-size="10" font-weight="400" fill="#59636c" text-anchor="start" font-style="italic">Deciding which operator a cluster should feed, or moving that assignment, is a future decision-making layer's job.</text>
  <text x="80" y="584" font-size="9.5" font-weight="700" fill="#f68330" text-anchor="start">→ which is why chaining is modeled but rejected today: the mechanism exists so that layer has somewhere to plug in.</text>

  <!-- legend -->
  <rect x="20" y="620" width="940" height="58" rx="10" fill="#25282c" stroke="#2b2f33" stroke-width="1"/>
  <text x="34" y="640" font-size="11.5" font-weight="700" fill="#e4e7e9" text-anchor="start">How to read this</text>
  <line x1="34" y1="664" x2="62" y2="664" stroke="#34d399" stroke-width="2.2"/>
  <text x="70" y="668" font-size="11" font-weight="500" fill="#8a97a2" text-anchor="start">running now, existing fan-in</text>
  <line x1="290" y1="664" x2="318" y2="664" stroke="#f68330" stroke-width="2.2"/>
  <text x="326" y="668" font-size="11" font-weight="500" fill="#8a97a2" text-anchor="start">new this release</text>
  <line x1="500" y1="664" x2="528" y2="664" stroke="#59636c" stroke-width="2.2" stroke-dasharray="4 3"/>
  <text x="536" y="668" font-size="11" font-weight="500" fill="#8a97a2" text-anchor="start">named on purpose, deliberately not supported yet</text>
</svg>
