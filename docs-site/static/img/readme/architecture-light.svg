<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d"><title id="t">How Ikhnos fits together</title><desc id="d">Agents in cloud, edge and far-edge clusters dial out over mutual TLS to the Ikhnos server. A browser reads the server over HTTPS. Optional FUSION stores telemetry, and an optional decider webhook answers placement questions.</desc><defs><marker id="m047857" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m1f2328" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m7e22ce" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker><marker id="mc2410c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect width="980" height="470" rx="14" fill="#ffffff"/><text x="30" y="38" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Your clusters</text><text x="30" y="54" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one read-only agent each</text><rect x="30" y="72" width="230" height="100" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="30" y="72" width="5" height="100" rx="2" fill="#2563eb"/><text x="52" y="98" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Cloud</text><text x="52" y="116" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">managed Kubernetes</text><rect x="52" y="130" width="186" height="28" rx="8" fill="#eef1f4" stroke="#2563eb" stroke-width="1.2"/><text x="145" y="148.5" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><path d="M260,144 L408,144" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m2563eb)"/><rect x="30" y="192" width="230" height="100" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="30" y="192" width="5" height="100" rx="2" fill="#047857"/><text x="52" y="218" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Edge</text><text x="52" y="236" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">regional racks</text><rect x="52" y="250" width="186" height="28" rx="8" fill="#eef1f4" stroke="#047857" stroke-width="1.2"/><text x="145" y="268.5" font-size="12" font-weight="600" fill="#047857" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><path d="M260,264 L408,264" fill="none" stroke="#047857" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m047857)"/><rect x="30" y="312" width="230" height="100" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="30" y="312" width="5" height="100" rx="2" fill="#7e22ce"/><text x="52" y="338" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Far edge</text><text x="52" y="356" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">sites with weak links</text><rect x="52" y="370" width="186" height="28" rx="8" fill="#eef1f4" stroke="#7e22ce" stroke-width="1.2"/><text x="145" y="388.5" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><path d="M260,384 L408,384" fill="none" stroke="#7e22ce" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m7e22ce)"/><text x="334" y="236" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">agents dial out</text><text x="334" y="254" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mTLS 1.3 · :8443</text><rect x="410" y="72" width="330" height="336" rx="14" fill="#f6f8fa" stroke="#c2410c" stroke-width="2"/><text x="432" y="104" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Ikhnos server</text><text x="432" y="124" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one replica · one SQLite writer · no kubeconfig</text><rect x="432" y="142" width="286" height="46" rx="9" fill="#eef1f4" stroke="#d0d7de" stroke-width="1"/><text x="446" y="162" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">:8443</text><text x="498" y="162" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">agent port</text><text x="446" y="179" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gRPC, mutual TLS, passes through untouched</text><rect x="432" y="196" width="286" height="46" rx="9" fill="#eef1f4" stroke="#d0d7de" stroke-width="1"/><text x="446" y="216" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">:8080</text><text x="498" y="216" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">admin port</text><text x="446" y="233" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">web UI + JSON API, sign-in, roles, audit trail</text><text x="432" y="266" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Inside</text><rect x="432" y="274" width="97.19999999999999" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="432" y="274" width="97.19999999999999" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="480.6" y="288" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Digital twin</text><rect x="537.2" y="274" width="64.19999999999999" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="537.2" y="274" width="64.19999999999999" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="569.3000000000001" y="288" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">History</text><rect x="609.4000000000001" y="274" width="123.6" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="609.4000000000001" y="274" width="123.6" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="671.2" y="288" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Placement advice</text><text x="432" y="318" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Optional, from the same Helm release</text><rect x="432" y="326" width="51.0" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="432" y="326" width="51.0" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="457.5" y="340" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Neo4j</text><rect x="491.0" y="326" width="57.599999999999994" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="491.0" y="326" width="57.599999999999994" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="519.8" y="340" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">FUSION</text><text x="432" y="372" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">FUSION = Prometheus · Loki · Tempo · Grafana</text><text x="432" y="390" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">for the metrics, logs and traces your clusters export</text><rect x="800" y="184" width="150" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="818" y="212" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">You</text><text x="818" y="231" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">browser · HTTPS</text><path d="M800,219 L740,219" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1f2328)"/><rect x="800" y="272" width="150" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/><text x="818" y="300" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Your decider</text><text x="818" y="319" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">optional webhook</text><text x="818" y="337" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">your policy, scored</text><text x="818" y="353" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">fairly</text><path d="M740,318 L800,318" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mc2410c)"/><text x="30" y="446" font-size="12" font-weight="500" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Nothing connects into a cluster. The agent opens every connection, outward, for the life of the connection.</text></svg>
