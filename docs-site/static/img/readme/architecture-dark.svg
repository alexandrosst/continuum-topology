<svg viewBox="0 0 760 524" role="img" aria-label="Agents in clusters dial out to one Ikhnos server; a browser reads the server; optional FUSION stores telemetry; an optional decider answers placement questions" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="glance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a97a2"></path></marker><marker id="glance-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f68330"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6e9ec">The parts of Ikhnos, and who starts each connection</text><text x="24" y="48" font-size="11.5" fill="#9ba6b1">Solid arrows start where they begin. Dashed parts are optional.</text><rect x="24" y="64" width="200" height="420" rx="8" fill="none" fill-opacity="1" stroke="#3a4047" stroke-width="1.25"></rect><text x="40" y="84" font-weight="600" fill="#e6e9ec">Your clusters</text><g><rect x="40" y="92" width="168" height="110" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="2"></rect><g><rect x="52" y="104" width="62" height="20" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.25"></rect><text x="83" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#e6e9ec">Cloud</text></g><rect x="52" y="134" width="144" height="30" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="124" y="153" font-weight="600" fill="#e6e9ec" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><text x="52" y="186" font-size="11.5" fill="#9ba6b1">read-only, one per cluster</text></g><g><rect x="40" y="214" width="168" height="110" rx="8" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="2"></rect><g><rect x="52" y="226" width="62" height="20" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.25"></rect><text x="83" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#e6e9ec">Edge</text></g><rect x="52" y="256" width="144" height="30" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="124" y="275" font-weight="600" fill="#e6e9ec" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><text x="52" y="308" font-size="11.5" fill="#9ba6b1">read-only, one per cluster</text></g><g><rect x="40" y="336" width="168" height="110" rx="8" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="2"></rect><g><rect x="52" y="348" width="72" height="20" rx="10" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="1.25"></rect><text x="88" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#e6e9ec">Far edge</text></g><rect x="52" y="378" width="144" height="30" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="124" y="397" font-weight="600" fill="#e6e9ec" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ikhnos-agent</text><text x="52" y="430" font-size="11.5" fill="#9ba6b1">read-only, one per cluster</text></g><rect x="288" y="64" width="248" height="336" rx="8" fill="#f68330" fill-opacity="0.12" stroke="#f68330" stroke-width="2"></rect><text x="304" y="90" font-weight="600" fill="#e6e9ec">Ikhnos server</text><text x="304" y="107" font-size="11.5" fill="#9ba6b1">one replica, one SQLite writer</text><rect x="304" y="122" width="216" height="44" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="316" y="142" font-weight="600" fill="#f68330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">:8443</text><text x="366" y="142" font-weight="600" fill="#e6e9ec">agent port</text><text x="316" y="158" font-size="11.5" fill="#9ba6b1">gRPC, mutual TLS</text><rect x="304" y="174" width="216" height="44" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="316" y="194" font-weight="600" fill="#f68330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">:8080</text><text x="366" y="194" font-weight="600" fill="#e6e9ec">admin port</text><text x="316" y="210" font-size="11.5" fill="#9ba6b1">web UI and JSON API</text><text x="304" y="246" font-size="11.5" font-weight="600" fill="#e6e9ec">Inside</text><text x="304" y="268" font-size="11.5" fill="#9ba6b1">Agent hub and per-cluster views</text><text x="304" y="292" font-size="11.5" fill="#9ba6b1">Digital twin: declared plus observed</text><text x="304" y="316" font-size="11.5" fill="#9ba6b1">History and audit trail</text><text x="304" y="340" font-size="11.5" fill="#9ba6b1">Placement advice</text><text x="304" y="364" font-size="11.5" fill="#9ba6b1">Accounts, roles, two-factor</text><rect x="288" y="416" width="248" height="68" rx="8" fill="none" fill-opacity="1" stroke="#3a4047" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="304" y="438" font-weight="600" fill="#e6e9ec">Regional operator</text><text x="304" y="456" font-size="11.5" fill="#9ba6b1">optional fan-in for telemetry</text><text x="304" y="472" font-size="11.5" fill="#9ba6b1">sits in a cluster you choose</text><rect x="576" y="64" width="160" height="60" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="592" y="90" font-weight="600" fill="#e6e9ec">You</text><text x="592" y="108" font-size="11.5" fill="#9ba6b1">browser, HTTPS</text><rect x="576" y="140" width="160" height="70" rx="8" fill="none" fill-opacity="1" stroke="#3a4047" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="592" y="164" font-weight="600" fill="#e6e9ec">Your decider</text><text x="592" y="182" font-size="11.5" fill="#9ba6b1">optional webhook</text><text x="592" y="198" font-size="11.5" fill="#9ba6b1">your placement policy</text><rect x="576" y="232" width="160" height="252" rx="8" fill="none" fill-opacity="1" stroke="#3a4047" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="592" y="254" font-weight="600" fill="#e6e9ec">FUSION</text><text x="592" y="270" font-size="11.5" fill="#9ba6b1">optional, same release</text><g><rect x="592" y="286" width="128" height="28" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="656" y="305" font-size="11.5" fill="#e6e9ec" text-anchor="middle">Grafana</text></g><g><rect x="592" y="324" width="128" height="28" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="656" y="343" font-size="11.5" fill="#e6e9ec" text-anchor="middle">Prometheus</text></g><g><rect x="592" y="362" width="128" height="28" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="656" y="381" font-size="11.5" fill="#e6e9ec" text-anchor="middle">Loki</text></g><g><rect x="592" y="400" width="128" height="28" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="656" y="419" font-size="11.5" fill="#e6e9ec" text-anchor="middle">Tempo</text></g><g><rect x="592" y="438" width="128" height="28" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="656" y="457" font-size="11.5" fill="#e6e9ec" text-anchor="middle">Central operator</text></g><path d="M208 147H288" fill="none" stroke="#f68330" stroke-width="1.75" marker-end="url(#glance-arrow-accent)"></path><path d="M208 269H288" fill="none" stroke="#f68330" stroke-width="1.75" marker-end="url(#glance-arrow-accent)"></path><path d="M208 391H288" fill="none" stroke="#f68330" stroke-width="1.75" marker-end="url(#glance-arrow-accent)"></path><text x="248" y="137" font-size="11.5" fill="#f68330" text-anchor="middle">dial out</text><path d="M576 94H536" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#glance-arrow)" marker-start="url(#glance-arrow)"></path><path d="M536 175H576" fill="none" stroke="#8a97a2" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#glance-arrow)"></path><path d="M536 338H576" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#glance-arrow)"></path><text x="556" y="330" font-size="11.5" fill="#9ba6b1" text-anchor="middle">reads</text><path d="M224 450H288" fill="none" stroke="#8a97a2" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#glance-arrow)"></path><path d="M536 451H592" fill="none" stroke="#8a97a2" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#glance-arrow)"></path><text x="412" y="508" font-size="11.5" fill="#9ba6b1" text-anchor="middle">telemetry over OTLP, only if you turn it on</text></svg>
