<svg viewBox="0 0 760 548" role="img" aria-label="Facts go through hard constraints, a three-valued fit, a cost in points, a confidence taken from the weakest fact, and evidence; a person decides" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="place-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7682"></path></marker><marker id="place-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">How a recommendation is made</text><text x="24" y="48" font-size="11.5" fill="#5b6672">Read-only. Every step keeps the source, the confidence and the age of what it used.</text><rect x="24" y="64" width="712" height="50" rx="8" fill="rgba(31, 35, 40, 0.045)" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="40" y="86" font-weight="600" fill="#1f2328">The estate</text><text x="40" y="103" font-size="11.5" fill="#5b6672">services and what they need, clusters and what is free, links and their round trips, each fact with its source, class and age</text><rect x="24" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><g><circle cx="24" cy="140" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="24" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">1</text></g><text x="44" y="164" font-weight="600" fill="#1f2328">Hard constraints</text><text x="44" y="184" font-size="11.5" fill="#5b6672">Local volumes, node pinning,</text><text x="44" y="200" font-size="11.5" fill="#5b6672">data residency, trust zones,</text><text x="44" y="216" font-size="11.5" fill="#5b6672">tier policy, room for CPU and memory.</text><text x="44" y="232" font-size="11.5" fill="#5b6672">Fail one and it is not a candidate.</text><rect x="270" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><g><circle cx="270" cy="140" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="270" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">2</text></g><text x="290" y="164" font-weight="600" fill="#1f2328">Three-valued fit</text><text x="290" y="184" font-size="11.5" fill="#5b6672">fits, does not fit, can’t tell.</text><text x="290" y="200" font-size="11.5" fill="#5b6672">Free capacity is an interval.</text><text x="290" y="216" font-size="11.5" fill="#5b6672">An unknown is not a zero.</text><text x="290" y="232" font-size="11.5" fill="#5b6672">A guess is not a fact.</text><rect x="516" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><g><circle cx="516" cy="140" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="516" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">3</text></g><text x="536" y="164" font-weight="600" fill="#1f2328">Cost, in points</text><text x="536" y="184" font-size="11.5" fill="#5b6672">Round trips, weighted by traffic;</text><text x="536" y="200" font-size="11.5" fill="#5b6672">traffic that newly crosses sites;</text><text x="536" y="216" font-size="11.5" fill="#5b6672">a penalty near full; data to copy.</text><text x="536" y="232" font-size="11.5" fill="#5b6672">1 point is 1 ms of round trip.</text><path d="M244 196H270" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M490 196H516" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><rect x="24" y="284" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><g><circle cx="24" cy="284" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="24" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">4</text></g><text x="44" y="308" font-weight="600" fill="#1f2328">Confidence</text><text x="44" y="328" font-size="11.5" fill="#5b6672">measured, reported, inferred,</text><text x="44" y="344" font-size="11.5" fill="#5b6672">guess, unknown. The weakest</text><text x="44" y="360" font-size="11.5" fill="#5b6672">deciding fact sets the level,</text><text x="44" y="376" font-size="11.5" fill="#5b6672">never an average.</text><rect x="270" y="284" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><g><circle cx="270" cy="284" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="270" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">5</text></g><text x="290" y="308" font-weight="600" fill="#1f2328">Evidence</text><text x="290" y="328" font-size="11.5" fill="#5b6672">Each input with its source and</text><text x="290" y="344" font-size="11.5" fill="#5b6672">age, and the smallest change</text><text x="290" y="360" font-size="11.5" fill="#5b6672">that would flip the answer,</text><text x="290" y="376" font-size="11.5" fill="#5b6672">checked by the tests.</text><rect x="516" y="284" width="220" height="112" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2"></rect><g><circle cx="516" cy="284" r="10" fill="none" stroke="#c2410c" stroke-width="1.5"></circle><text x="516" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">6</text></g><text x="536" y="308" font-weight="600" fill="#1f2328">Recommendation</text><text x="536" y="328" font-size="11.5" fill="#1f2328">Where, what it would save,</text><text x="536" y="344" font-size="11.5" fill="#1f2328">how sure, and why. Or: not</text><text x="536" y="360" font-size="11.5" fill="#1f2328">enough evidence to recommend,</text><text x="536" y="376" font-size="11.5" fill="#1f2328">with the missing fact named.</text><path d="M134 252V284" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M380 252V284" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M626 252V284" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M244 340H270" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M490 340H516" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#place-arrow)"></path><rect x="24" y="420" width="712" height="50" rx="8" fill="none" fill-opacity="1" stroke="#cfd6dd" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="40" y="442" font-weight="600" fill="#1f2328">Deciders, side by side</text><text x="40" y="460" font-size="11.5" fill="#5b6672">Baseline, Follow the heaviest talker, and your own webhook all see the same estate and are scored on the same answer.</text><path d="M560 420V396" fill="none" stroke="#6b7682" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#place-arrow)"></path><rect x="24" y="490" width="712" height="40" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2"></rect><text x="380" y="515" font-weight="600" fill="#1f2328" text-anchor="middle">A person decides. Nothing is moved by Ikhnos.</text></svg>
