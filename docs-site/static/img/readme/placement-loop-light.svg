<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d"><title id="t">How placement advice is produced</title><desc id="d">Agents, probes and traffic observers feed one model. Hard constraints filter candidates, a cost function scores them, and every answer carries a confidence class and its evidence. Built-in and external deciders are compared on the same estate. A person approves; nothing is moved automatically.</desc><defs><marker id="m59636e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="mc2410c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect width="980" height="400" rx="14" fill="#ffffff"/><rect x="30" y="70" width="215" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="30" y="70" width="215" height="5" rx="2" fill="#2563eb"/><text x="50" y="104" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Observe</text><text x="50" y="134" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">agents</text><rect x="44" y="125" width="3" height="12" rx="1.5" fill="#2563eb"/><text x="50" y="161" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">node probes</text><rect x="44" y="152" width="3" height="12" rx="1.5" fill="#2563eb"/><text x="50" y="188" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">traffic observer</text><rect x="44" y="179" width="3" height="12" rx="1.5" fill="#2563eb"/><text x="50" y="215" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">link measurements</text><rect x="44" y="206" width="3" height="12" rx="1.5" fill="#2563eb"/><path d="M245,170 L265,170" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m59636e)"/><rect x="265" y="70" width="215" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="265" y="70" width="215" height="5" rx="2" fill="#047857"/><text x="285" y="104" font-size="16" font-weight="700" fill="#047857" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Model</text><text x="285" y="134" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">a digital twin of the estate</text><rect x="279" y="125" width="3" height="12" rx="1.5" fill="#047857"/><text x="285" y="161" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">two views, one model</text><rect x="279" y="152" width="3" height="12" rx="1.5" fill="#047857"/><text x="285" y="188" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">versioned history</text><rect x="279" y="179" width="3" height="12" rx="1.5" fill="#047857"/><path d="M480,170 L500,170" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m59636e)"/><rect x="500" y="70" width="215" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="500" y="70" width="215" height="5" rx="2" fill="#c2410c"/><text x="520" y="104" font-size="16" font-weight="700" fill="#c2410c" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Advise</text><text x="520" y="134" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">hard constraints</text><rect x="514" y="125" width="3" height="12" rx="1.5" fill="#c2410c"/><text x="520" y="161" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">cost in points (1 pt = 1 ms)</text><rect x="514" y="152" width="3" height="12" rx="1.5" fill="#c2410c"/><text x="520" y="188" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">fits · does not fit · can’t tell</text><rect x="514" y="179" width="3" height="12" rx="1.5" fill="#c2410c"/><text x="520" y="215" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">confidence + evidence</text><rect x="514" y="206" width="3" height="12" rx="1.5" fill="#c2410c"/><path d="M715,170 L735,170" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m59636e)"/><rect x="735" y="70" width="215" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><rect x="735" y="70" width="215" height="5" rx="2" fill="#7e22ce"/><text x="755" y="104" font-size="16" font-weight="700" fill="#7e22ce" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Decide</text><text x="755" y="134" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">a person reads the evidence</text><rect x="749" y="125" width="3" height="12" rx="1.5" fill="#7e22ce"/><text x="755" y="161" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">approves, or does not</text><rect x="749" y="152" width="3" height="12" rx="1.5" fill="#7e22ce"/><text x="755" y="188" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">nothing moves on its own</text><rect x="749" y="179" width="3" height="12" rx="1.5" fill="#7e22ce"/><text x="30" y="40" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Advice with its evidence, never an action</text><rect x="500" y="296" width="450" height="74" rx="12" fill="#f6f8fa" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="5 4"/><text x="520" y="322" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Deciders compared side by side on the same estate</text><rect x="520" y="336" width="70.8" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="520" y="336" width="70.8" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="555.4" y="350" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Baseline</text><rect x="598.8" y="336" width="189.6" height="20" rx="10" fill="#1f2328" opacity="0.14"/><rect x="598.8" y="336" width="189.6" height="20" rx="10" fill="none" stroke="#1f2328" stroke-width="1"/><text x="693.5999999999999" y="350" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Follow the heaviest talker</text><rect x="796.4" y="336" width="97.19999999999999" height="20" rx="10" fill="#c2410c" opacity="0.14"/><rect x="796.4" y="336" width="97.19999999999999" height="20" rx="10" fill="none" stroke="#c2410c" stroke-width="1"/><text x="845.0" y="350" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Your webhook</text><path d="M607,296 L607,270" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mc2410c)"/><text x="30" y="328" font-size="12.5" font-weight="600" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Every answer says how sure it is,</text><text x="30" y="347" font-size="12.5" font-weight="600" fill="#59636e" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">and what would change it.</text></svg>
