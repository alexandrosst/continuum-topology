<svg viewBox="0 0 760 424" role="img" aria-label="Ceiling, approved and effective: each at or below the one before, and what tiers zero, one and two can see" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7682"></path></marker><marker id="chain-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">What an agent reports is a chain that only narrows</text><text x="24" y="48" font-size="11.5" fill="#5b6672">Checked in this order, by the agent as well as by the server. The server can narrow it, never widen it.</text><g><rect x="24" y="66" width="444" height="52" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2"></rect><text x="40" y="88" font-weight="600" fill="#1f2328">1  Ceiling</text><text x="40" y="106" font-size="11.5" fill="#5b6672">what the agent’s RBAC lets it read</text><text x="486" y="88" font-size="11.5" font-weight="600" fill="#1f2328">Set by the cluster’s owner</text><text x="486" y="106" font-size="11.5" fill="#5b6672">helm install, access.tier</text></g><g><rect x="24" y="130" width="336" height="52" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="40" y="152" font-weight="600" fill="#1f2328">2  Approved</text><text x="40" y="170" font-size="11.5" fill="#5b6672">what an administrator agreed to receive</text><text x="378" y="152" font-size="11.5" font-weight="600" fill="#1f2328">Set by an administrator</text><text x="378" y="170" font-size="11.5" fill="#5b6672">the UI; never above the ceiling</text></g><g><rect x="24" y="194" width="228" height="52" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="40" y="216" font-weight="600" fill="#1f2328">3  Effective</text><text x="40" y="234" font-size="11.5" fill="#5b6672">what the agent is sending right now</text><text x="270" y="216" font-size="11.5" font-weight="600" fill="#1f2328">Narrowed by the agent</text><text x="270" y="234" font-size="11.5" fill="#5b6672">collectors paused, namespaces left out</text></g><text x="24" y="284" font-weight="600" fill="#1f2328">What each access tier can see</text><g><rect x="24" y="298" width="228" height="100" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="40" y="320" font-weight="600" fill="#1f2328">Tier 0</text><text x="92" y="320" font-size="11.5" fill="#5b6672">registered only</text><text x="40" y="342" font-size="11.5" fill="#5b6672">The UID of the kube-system</text><text x="40" y="358" font-size="11.5" fill="#5b6672">namespace, to tell clusters apart.</text><text x="40" y="374" font-size="11.5" fill="#5b6672">Nothing else.</text></g><g><rect x="266" y="298" width="228" height="100" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="282" y="320" font-weight="600" fill="#1f2328">Tier 1</text><text x="334" y="320" font-size="11.5" fill="#5b6672">infrastructure</text><text x="282" y="342" font-size="11.5" fill="#5b6672">Tier 0, plus nodes, storage</text><text x="282" y="358" font-size="11.5" fill="#5b6672">classes and ingress classes.</text><text x="282" y="374" font-size="11.5" fill="#5b6672">No namespaces or workloads.</text></g><g><rect x="508" y="298" width="228" height="100" rx="8" fill="none" fill-opacity="1" stroke="#6b7682" stroke-width="1.25"></rect><text x="524" y="320" font-weight="600" fill="#1f2328">Tier 2</text><text x="576" y="320" font-size="11.5" fill="#5b6672">services (the default)</text><text x="524" y="342" font-size="11.5" fill="#5b6672">Tier 1, plus namespaces,</text><text x="524" y="358" font-size="11.5" fill="#5b6672">workloads, pods, services</text><text x="524" y="374" font-size="11.5" fill="#5b6672">and ingresses.</text></g><text x="24" y="414" font-size="11.5" fill="#5b6672">Read-only at every tier. Secrets and ConfigMaps are never read. Tiers 3 and 4 are reserved and refused.</text></svg>
