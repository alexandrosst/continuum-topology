<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-labelledby="t d"><title id="t">Three tiers of what an agent reports</title><desc id="d">The access tier set by Helm is the ceiling. The tier an administrator approves can only sit at or below it. What the agent actually sends can only sit at or below the approved tier. The server can narrow this chain but never widen it.</desc><defs></defs><rect width="980" height="380" rx="14" fill="#16181a"/><text x="30" y="40" font-size="16" font-weight="700" fill="#e4e7e9" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">What an agent may report is a chain that only ever narrows</text><text x="30" y="60" font-size="12.5" font-weight="400" fill="#9aa5ae" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Checked in this order, by the agent itself as well as by the server.</text><rect x="30" y="84" width="920" height="70" rx="12" fill="#212428" stroke="#3f444b" stroke-width="1"/><rect x="30" y="84" width="900" height="70" rx="12" fill="#60a5fa" opacity="0.13"/><rect x="30" y="84" width="900" height="70" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.6"/><text x="54" y="114" font-size="20" font-weight="800" fill="#60a5fa" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><text x="84" y="114" font-size="16" font-weight="700" fill="#e4e7e9" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Ceiling</text><text x="84" y="135" font-size="12" font-weight="400" fill="#9aa5ae" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">what the agent’s RBAC lets it read</text><text x="914" y="114" font-size="11.5" font-weight="600" fill="#60a5fa" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">helm install · access.tier</text><text x="914" y="135" font-size="11.5" font-weight="400" fill="#9aa5ae" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">only a helm upgrade on the cluster’s side raises it</text><rect x="30" y="168" width="920" height="70" rx="12" fill="#212428" stroke="#3f444b" stroke-width="1"/><rect x="30" y="168" width="680" height="70" rx="12" fill="#34d399" opacity="0.13"/><rect x="30" y="168" width="680" height="70" rx="12" fill="none" stroke="#34d399" stroke-width="1.6"/><text x="54" y="198" font-size="20" font-weight="800" fill="#34d399" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">2</text><text x="84" y="198" font-size="16" font-weight="700" fill="#e4e7e9" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Approved</text><text x="84" y="219" font-size="12" font-weight="400" fill="#9aa5ae" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">what an administrator agreed to receive</text><text x="694" y="198" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the UI · approval code</text><text x="694" y="219" font-size="11.5" font-weight="400" fill="#9aa5ae" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">at or below the ceiling, never above</text><rect x="30" y="252" width="920" height="70" rx="12" fill="#212428" stroke="#3f444b" stroke-width="1"/><rect x="30" y="252" width="460" height="70" rx="12" fill="#c084fc" opacity="0.13"/><rect x="30" y="252" width="460" height="70" rx="12" fill="none" stroke="#c084fc" stroke-width="1.6"/><text x="54" y="282" font-size="20" font-weight="800" fill="#c084fc" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">3</text><text x="84" y="282" font-size="16" font-weight="700" fill="#e4e7e9" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Effective</text><text x="84" y="303" font-size="12" font-weight="400" fill="#9aa5ae" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">what the agent is sending right now</text><text x="474" y="282" font-size="11.5" font-weight="600" fill="#c084fc" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent · collectors · namespaces</text><text x="474" y="303" font-size="11.5" font-weight="400" fill="#9aa5ae" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">at or below what is approved</text><rect x="30" y="340" width="920" height="30" rx="8" fill="#2a2e33"/><text x="46" y="364" font-size="11.5" font-weight="500" fill="#9aa5ae" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Tier 0 registered only  ·  Tier 1 + nodes  ·  Tier 2 + namespaces, workloads, services (default). Read-only at every tier; Secrets and ConfigMaps are never read.</text></svg>
