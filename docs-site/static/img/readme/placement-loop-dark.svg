<svg viewBox="0 0 760 548" role="img" aria-label="Facts go through hard constraints, a three-valued fit, a cost in points, a confidence taken from the weakest fact, and evidence; a person decides" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="place-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a97a2"></path></marker><marker id="place-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f68330"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6e9ec">How a recommendation is made</text><text x="24" y="48" font-size="11.5" fill="#9ba6b1">Read-only. Every step keeps the source, the confidence and the age of what it used.</text><rect x="24" y="64" width="712" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><text x="40" y="86" font-weight="600" fill="#e6e9ec">The estate</text><text x="40" y="103" font-size="11.5" fill="#9ba6b1">services and what they need, clusters and what is free, links and their round trips, each fact with its source, class and age</text><rect x="24" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><g><circle cx="24" cy="140" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="24" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">1</text></g><text x="44" y="164" font-weight="600" fill="#e6e9ec">Hard constraints</text><text x="44" y="184" font-size="11.5" fill="#9ba6b1">Local volumes, node pinning,</text><text x="44" y="200" font-size="11.5" fill="#9ba6b1">data residency, trust zones,</text><text x="44" y="216" font-size="11.5" fill="#9ba6b1">tier policy, room for CPU and memory.</text><text x="44" y="232" font-size="11.5" fill="#9ba6b1">Fail one and it is not a candidate.</text><rect x="270" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><g><circle cx="270" cy="140" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="270" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">2</text></g><text x="290" y="164" font-weight="600" fill="#e6e9ec">Three-valued fit</text><text x="290" y="184" font-size="11.5" fill="#9ba6b1">fits, does not fit, can’t tell.</text><text x="290" y="200" font-size="11.5" fill="#9ba6b1">Free capacity is an interval.</text><text x="290" y="216" font-size="11.5" fill="#9ba6b1">An unknown is not a zero.</text><text x="290" y="232" font-size="11.5" fill="#9ba6b1">A guess is not a fact.</text><rect x="516" y="140" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><g><circle cx="516" cy="140" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="516" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">3</text></g><text x="536" y="164" font-weight="600" fill="#e6e9ec">Cost, in points</text><text x="536" y="184" font-size="11.5" fill="#9ba6b1">Round trips, weighted by traffic;</text><text x="536" y="200" font-size="11.5" fill="#9ba6b1">traffic that newly crosses sites;</text><text x="536" y="216" font-size="11.5" fill="#9ba6b1">a penalty near full; data to copy.</text><text x="536" y="232" font-size="11.5" fill="#9ba6b1">1 point is 1 ms of round trip.</text><path d="M244 196H270" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M490 196H516" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><rect x="24" y="284" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><g><circle cx="24" cy="284" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="24" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">4</text></g><text x="44" y="308" font-weight="600" fill="#e6e9ec">Confidence</text><text x="44" y="328" font-size="11.5" fill="#9ba6b1">measured, reported, inferred,</text><text x="44" y="344" font-size="11.5" fill="#9ba6b1">guess, unknown. The weakest</text><text x="44" y="360" font-size="11.5" fill="#9ba6b1">deciding fact sets the level,</text><text x="44" y="376" font-size="11.5" fill="#9ba6b1">never an average.</text><rect x="270" y="284" width="220" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8a97a2" stroke-width="1.25"></rect><g><circle cx="270" cy="284" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="270" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">5</text></g><text x="290" y="308" font-weight="600" fill="#e6e9ec">Evidence</text><text x="290" y="328" font-size="11.5" fill="#9ba6b1">Each input with its source and</text><text x="290" y="344" font-size="11.5" fill="#9ba6b1">age, and the smallest change</text><text x="290" y="360" font-size="11.5" fill="#9ba6b1">that would flip the answer,</text><text x="290" y="376" font-size="11.5" fill="#9ba6b1">checked by the tests.</text><rect x="516" y="284" width="220" height="112" rx="8" fill="#f68330" fill-opacity="0.12" stroke="#f68330" stroke-width="2"></rect><g><circle cx="516" cy="284" r="10" fill="none" stroke="#f68330" stroke-width="1.5"></circle><text x="516" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6e9ec">6</text></g><text x="536" y="308" font-weight="600" fill="#e6e9ec">Recommendation</text><text x="536" y="328" font-size="11.5" fill="#e6e9ec">Where, what it would save,</text><text x="536" y="344" font-size="11.5" fill="#e6e9ec">how sure, and why. Or: not</text><text x="536" y="360" font-size="11.5" fill="#e6e9ec">enough evidence to recommend,</text><text x="536" y="376" font-size="11.5" fill="#e6e9ec">with the missing fact named.</text><path d="M134 252V284" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M380 252V284" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M626 252V284" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M244 340H270" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><path d="M490 340H516" fill="none" stroke="#8a97a2" stroke-width="1.25" marker-end="url(#place-arrow)"></path><rect x="24" y="420" width="712" height="50" rx="8" fill="none" fill-opacity="1" stroke="#3a4047" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="40" y="442" font-weight="600" fill="#e6e9ec">Deciders, side by side</text><text x="40" y="460" font-size="11.5" fill="#9ba6b1">Baseline, Follow the heaviest talker, and your own webhook all see the same estate and are scored on the same answer.</text><path d="M560 420V396" fill="none" stroke="#8a97a2" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#place-arrow)"></path><rect x="24" y="490" width="712" height="40" rx="8" fill="#f68330" fill-opacity="0.12" stroke="#f68330" stroke-width="2"></rect><text x="380" y="515" font-weight="600" fill="#e6e9ec" text-anchor="middle">A person decides. Nothing is moved by Ikhnos.</text></svg>
