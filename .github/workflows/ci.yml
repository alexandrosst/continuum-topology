name: CI

# The checks every push and pull request gets, with no registry credentials and no publishing: build, vet and
# test the Go backend, and lint, type-check, build and unit-test the frontend. This is what gives the repo's
# commits and PRs a green check - the actual image/chart publishing is a separate workflow (release.yml) that only
# runs on a push to main or a version tag, since that's the only case where GHCR credentials are involved.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    env:
      # The password of the Neo4j service below. It guards a database that lives for this job only.
      NEO4J_PASSWORD: ci-only-not-a-secret
    services:
      # A real Neo4j for the graph's tests (internal/graph, and the server's graph rig). It is the image the server chart bundles
      # (neo4j.image.tag in deploy/helm/ikhnos-server/values.yaml); the tests reach it over HTTP on the loopback address.
      neo4j:
        image: neo4j:5.26.30-community
        env:
          NEO4J_AUTH: neo4j/ci-only-not-a-secret
        ports:
          - 7474:7474
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go-version-file respects backend/go.mod's own `toolchain` line (currently pinned to go1.26.8 for the
          # standard-library CVE fixes it carries - see backend/go.mod's comment and deploy/README.md's
          # "Dependency scanning" section), so this always builds with at least that patch version without
          # needing to also update this workflow file every time that line changes.
          go-version-file: backend/go.mod
          # go.sum is in backend/, not at the root where the action looks by default (it warned that the cache could not be restored).
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Three tools that tests use when they are there and skip when they are not. A skip is a green check for something that was not
      # run, so CI provides them and sets IKHNOS_REQUIRE_TOOLS=1: TestTheToolsTheSkippedTestsNeedAreHereWhenCIRequiresThem
      # (internal/chart) then fails, naming what is missing, if any of them is not here.
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: The collector the chart pins (otelcol-contrib)
        run: |
          set -euo pipefail
          want=0.160.0
          sum=7bb60c584c241c86261c2b8697cd3725dd8c56691f5ad5d98454eaa005b47b0c
          have=$(awk '/collectorImage:/{f=1} f&&/tag:/{gsub(/"/,"",$2); print $2; exit}' backend/internal/chart/ikhnos-agent/values.yaml)
          if [ "$have" != "$want" ]; then
            echo "the agent chart pins collector $have and this step downloads $want: change the version and the checksum here together" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/otelcol"
          curl -fsSL -o "$RUNNER_TEMP/otelcol.tgz" "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${want}/otelcol-contrib_${want}_linux_amd64.tar.gz"
          echo "${sum}  $RUNNER_TEMP/otelcol.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/otelcol.tgz" -C "$RUNNER_TEMP/otelcol" otelcol-contrib
          echo "IKHNOS_OTELCOL=$RUNNER_TEMP/otelcol/otelcol-contrib" >> "$GITHUB_ENV"

      - name: The pod identity the collector's kubelet receiver reads
        # The Kubernetes client looks for these two files at a fixed path, so the tests that ask the real collector to validate a
        # rendered host config cannot move them (everything else they need they move under their own directory).
        run: |
          d=/var/run/secrets/kubernetes.io/serviceaccount
          sudo mkdir -p "$d"
          echo ci-token | sudo tee "$d/token" > /dev/null
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /dev/null -out "$d/ca.crt" -subj "/CN=ci" -days 2

      - name: Test (race)
        working-directory: backend
        # Root, via sudo: the eBPF integration tests in internal/flow/ebpf (observer_test.go) load a real
        # program into the kernel and only run when os.Geteuid() == 0, skipping quietly otherwise - which is
        # exactly what a plain `go test` here did, silently giving every push a green check without ever
        # exercising the CO-RE struct layout, counter diffing, or concurrency those tests cover. ubuntu-latest
        # runners have passwordless sudo for the default user, and BTF (/sys/kernel/btf/vmlinux) is present on
        # the image's kernel, so plain `sudo` is enough to satisfy openWith's root check. `env "PATH=$PATH"` is
        # required alongside it: sudo's default secure_path would otherwise drop the go toolchain that
        # actions/setup-go put earlier on PATH, and env_reset/always_set_home would otherwise just mean a
        # fresh (root-owned) build cache for this step, not a missing `go` binary.
        run: |
          sudo env "PATH=$PATH" \
            IKHNOS_REQUIRE_TOOLS=1 \
            IKHNOS_OTELCOL="$IKHNOS_OTELCOL" OTELCOL_CONTRIB="$IKHNOS_OTELCOL" \
            IKHNOS_TEST_NEO4J=http://127.0.0.1:7474 IKHNOS_TEST_NEO4J_PASSWORD="$NEO4J_PASSWORD" \
            go test ./... -race -count=1

      - name: Fix cache ownership after root test run
        working-directory: backend
        # The root-run `go test` above reads and writes the same GOCACHE/GOMODCACHE that actions/setup-go's
        # cache restore and the earlier Build/Vet steps already populated as the `runner` user. Whether plain
        # `sudo` (no -H) here preserves HOME or resets it to /root depends on this runner image's sudoers
        # env_reset/always_set_home settings - not something to assume either way - but in both cases any
        # cache entry root creates or touches along the way lands owned by root, unreadable/unwritable by
        # `runner`. Reclaim ownership of both caches before the next (non-root) step touches either one, so a
        # permission error there can't get silently swallowed by that step's continue-on-error.
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        continue-on-error: true
        # Non-blocking on purpose, not because this doesn't matter: as of this writing there is one accepted,
        # currently-unfixable finding (a grpc-go CVE with no stable release yet - see deploy/README.md's
        # "Dependency scanning" section), and govulncheck exits non-zero for any finding, fixable or not. A hard
        # failure here would turn every run red for a thing nobody here can currently fix, which teaches everyone
        # to ignore the check - worse than not running it. Read this step's log on every run regardless: once the
        # grpc-go finding has a real fix, bump the dependency, confirm a clean run, and drop `continue-on-error`
        # so a genuinely new, fixable finding blocks the build the way it should.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Vulnerability scan (npm audit)
        run: npm audit --audit-level=high
        # `high` (not the default `low`) so this blocks on what's worth blocking on; see deploy/README.md's
        # "Dependency scanning" section - a clean run today says nothing about a dependency added tomorrow, which
        # is exactly why this runs on every push instead of only when someone remembers to run it by hand.
